<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 配置编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a2742, #0f1923); border-bottom: 1px solid #1e3a5f; padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header h1 { font-size: 20px; color: #4fc3f7; font-weight: 600; }
.header .subtitle { font-size: 12px; color: #78909c; margin-top: 2px; }
.input-group { display: flex; flex: 1; min-width: 300px; gap: 8px; }
.input-group input { flex: 1; padding: 10px 16px; border: 1px solid #1e3a5f; border-radius: 8px; background: #132238; color: #e0e0e0; font-size: 14px; outline: none; transition: border-color .2s; }
.input-group input:focus { border-color: #4fc3f7; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .2s; white-space: nowrap; }
.btn-primary { background: #1976d2; color: #fff; }
.btn-primary:hover { background: #1565c0; }
.btn-success { background: #388e3c; color: #fff; }
.btn-success:hover { background: #2e7d32; }
.btn-warning { background: #f57c00; color: #fff; }
.btn-warning:hover { background: #ef6c00; }
.btn-danger { background: #d32f2f; color: #fff; }
.btn-danger:hover { background: #c62828; }
.btn-info { background: #0097a7; color: #fff; }
.btn-info:hover { background: #00838f; }
.toolbar { padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #1e3a5f; background: #132238; }
.main { display: flex; height: calc(100vh - 140px); }
.panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #1e3a5f; }
.panel:last-child { border-right: none; }
.panel-header { padding: 12px 16px; background: #1a2742; font-size: 14px; font-weight: 600; color: #4fc3f7; display: flex; justify-content: space-between; align-items: center; }
.panel-body { flex: 1; overflow: auto; padding: 16px; }
.panel-body textarea { width: 100%; height: 100%; min-height: 300px; background: #0a1118; color: #a5d6a7; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; font-family: 'Courier New', monospace; font-size: 13px; resize: none; outline: none; }
.panel-body textarea:focus { border-color: #4fc3f7; }
.visual-item { background: #132238; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.visual-item label { display: block; font-size: 12px; color: #78909c; margin-bottom: 4px; margin-top: 8px; }
.visual-item label:first-child { margin-top: 0; }
.visual-item input, .visual-item select { width: 100%; padding: 8px 12px; border: 1px solid #1e3a5f; border-radius: 6px; background: #0a1118; color: #e0e0e0; font-size: 13px; outline: none; }
.visual-item input:focus, .visual-item select:focus { border-color: #4fc3f7; }
.section-title { font-size: 13px; font-weight: 600; color: #4fc3f7; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #1e3a5f; }
.section-title:first-child { margin-top: 0; }
.history-panel { position: fixed; top: 0; right: -360px; width: 360px; height: 100vh; background: #132238; border-left: 1px solid #1e3a5f; transition: right .3s; z-index: 100; overflow-y: auto; }
.history-panel.open { right: 0; }
.history-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.5); z-index: 99; display: none; }
.history-overlay.open { display: block; }
.history-item { padding: 12px 16px; border-bottom: 1px solid #1e3a5f; cursor: pointer; transition: background .2s; }
.history-item:hover { background: #1a2742; }
.history-item .history-url { font-size: 12px; color: #4fc3f7; word-break: break-all; }
.history-item .history-time { font-size: 11px; color: #78909c; margin-top: 4px; }
.history-header { padding: 16px; background: #1a2742; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.tab-bar { display: flex; gap: 4px; padding: 8px 16px; background: #1a2742; }
.tab-btn { padding: 6px 16px; border: none; border-radius: 6px; background: transparent; color: #78909c; cursor: pointer; font-size: 13px; transition: all .2s; }
.tab-btn.active { background: #1976d2; color: #fff; }
.tab-content { display: none; height: 100%; }
.tab-content.active { display: block; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #388e3c; color: #fff; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.error { background: #d32f2f; }
.empty-hint { text-align: center; color: #546e7a; padding: 40px 20px; font-size: 14px; }
.array-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
.array-item input { flex: 1; }
.array-item button { flex-shrink: 0; padding: 8px 12px; }
.add-btn { width: 100%; padding: 10px; border: 1px dashed #1e3a5f; border-radius: 6px; background: transparent; color: #4fc3f7; cursor: pointer; font-size: 13px; transition: all .2s; }
.add-btn:hover { border-color: #4fc3f7; background: rgba(79,195,247,.05); }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📦 TVBox 配置编辑器</h1>
    <div class="subtitle">本地记录依赖浏览器缓存，清空缓存将丢失记录</div>
  </div>
  <div class="input-group">
    <input type="text" id="apiUrl" placeholder="输入接口地址，回车加载..." />
    <button class="btn btn-primary" onclick="loadFromUrl()">加载</button>
    <button class="btn btn-success" onclick="decryptInput()">一键解密</button>
  </div>
  <button class="btn btn-info" onclick="toggleHistory()">📋 历史</button>
</div>

<div class="toolbar">
  <button class="btn btn-success" onclick="copyCode()">📋 复制</button>
  <button class="btn btn-primary" onclick="saveLocal()">💾 保存</button>
  <button class="btn btn-warning" onclick="clearAll()">🗑️ 清空</button>
  <button class="btn btn-info" onclick="exportJson()">📤 导出JSON</button>
  <button class="btn btn-info" onclick="importJson()">📥 导入JSON</button>
  <button class="btn btn-warning" onclick="formatJson()">🔧 格式化</button>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFile(event)">
</div>

<div class="main">
  <div class="panel">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('visual')">可视编辑</button>
      <button class="tab-btn" onclick="switchTab('source')">源码视图</button>
    </div>
    <div id="tab-visual" class="tab-content active">
      <div class="panel-body" id="visualBody">
        <div class="empty-hint">输入接口地址加载配置，或手动编辑下方内容</div>
      </div>
    </div>
    <div id="tab-source" class="tab-content">
      <div class="panel-body">
        <textarea id="sourceCode" placeholder='{"sites":[],"parses":[],"lives":[]}'></textarea>
      </div>
    </div>
  </div>
</div>

<!-- 历史面板 -->
<div class="history-overlay" id="historyOverlay" onclick="toggleHistory()"></div>
<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <span>本地历史记录</span>
    <button class="btn btn-danger" onclick="clearHistory()" style="padding:6px 12px;font-size:12px">清空</button>
  </div>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 核心数据 =====
let configData = { sites: [], parses: [], lives: [] };

// ===== 初始化 =====
window.onload = () => {
  loadHistory();
  const saved = localStorage.getItem('tvbox_config');
  if (saved) {
    try {
      configData = JSON.parse(saved);
      renderVisual();
      document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
    } catch(e) {}
  }
  document.getElementById('apiUrl').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromUrl(); });
};

// ===== 加载接口 =====
async function loadFromUrl() {
  const url = document.getElementById('apiUrl').value.trim();
  if (!url) { showToast('请输入接口地址', 'error'); return; }
  showToast('正在加载...');
  try {
    const res = await fetch(url, { headers: { 'Accept': 'application/json,text/plain,*/*' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    let text = await res.text();
    processLoadedData(text, url);
  } catch(e) {
    // 尝试通过代理或原生 fetch 失败时用 iframe 方式提示
    showToast('加载失败: ' + e.message + ' (可能跨域，尝试解密模式)', 'error');
    // 仍然尝试当成本地解密处理
    document.getElementById('sourceCode').value = '';
    document.getElementById('apiUrl').dataset.pendingUrl = url;
  }
}

// ===== 解密处理 =====
function decryptInput() {
  const url = document.getElementById('apiUrl').value.trim();
  if (!url) { showToast('请输入要解密的地址', 'error'); return; }
  // 常见TVBox加密: Base64、AES-CBC(部分)、或URL参数加密
  try {
    // 尝试 Base64 解码
    let decoded = atob(url);
    try { decoded = decodeURIComponent(escape(decoded)); } catch(e) {}
    // 尝试解析为JSON
    try {
      const json = JSON.parse(decoded);
      configData = { sites: json.sites || [], parses: json.parses || [], lives: json.lives || [] };
      renderVisual();
      document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
      showToast('解密成功！');
      saveToHistory(url, 'decrypt');
      return;
    } catch(e) {
      // 解密后不是JSON，显示原文
      document.getElementById('sourceCode').value = decoded;
      showToast('Base64解密完成（非JSON格式）');
      return;
    }
  } catch(e) {
    // 尝试 URL 参数提取
    try {
      const u = new URL(url);
      const params = new URLSearchParams(u.search);
      let found = false;
      for (const [k,v] of params) {
        try {
          let d = atob(v);
          try { d = decodeURIComponent(escape(d)); } catch(e) {}
          JSON.parse(d);
          configData = JSON.parse(d);
          renderVisual();
          document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
          showToast('从参数 ' + k + ' 解密成功！');
          saveToHistory(url, 'decrypt');
          found = true;
          break;
        } catch(e2) {}
      }
      if (!found) showToast('解密失败，请确认加密格式', 'error');
    } catch(e3) {
      showToast('解密失败: ' + e3.message, 'error');
    }
  }
}

function processLoadedData(text, url) {
  try {
    // 尝试直接解析JSON
    const json = JSON.parse(text);
    configData = { sites: json.sites || [], parses: json.parses || [], lives: json.lives || [] };
    renderVisual();
    document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
    showToast('加载成功！');
    saveToHistory(url, 'load');
  } catch(e) {
    // 尝试 Base64 解码后解析
    try {
      let decoded = atob(text.trim());
      try { decoded = decodeURIComponent(escape(decoded)); } catch(e2) {}
      const json = JSON.parse(decoded);
      configData = { sites: json.sites || [], parses: json.parses || [], lives: json.lives || [] };
      renderVisual();
      document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
      showToast('加载并解密成功！');
      saveToHistory(url, 'load+decrypt');
    } catch(e3) {
      // 直接显示源码
      document.getElementById('sourceCode').value = text;
      showToast('已加载（非标准JSON，请手动处理）');
    }
  }
}

// ===== 可视编辑 =====
function renderVisual() {
  const body = document.getElementById('visualBody');
  let html = '';

  // Sites
  html += '<div class="section-title">📺 站点 (sites) <button class="btn btn-success add-btn-inline" onclick="addSite()" style="padding:4px 12px;font-size:12px;float:right">+ 添加</button></div>';
  if (configData.sites.length === 0) html += '<div class="empty-hint" style="padding:12px">暂无站点</div>';
  configData.sites.forEach((site, i) => {
    html += `<div class="visual-item" data-type="site" data-index="${i}">
      <label>Key</label><input name="key" value="${esc(site.key||'')}" onchange="updateSite(${i},this)">
      <label>名称</label><input name="name" value="${esc(site.name||'')}" onchange="updateSite(${i},this)">
      <label>类型</label><select name="type" onchange="updateSite(${i},this)">
        <option value="0" ${site.type==='0'?'selected':''}>0-普通</option>
        <option value="1" ${site.type==='1'?'selected':''}>1-解析</option>
        <option value="2" ${site.type==='2'?'selected':''}>2-直链</option>
        <option value="3" ${site.type==='3'?'selected':''}>3-特殊</option>
      </select>
      <label>API</label><input name="api" value="${esc(site.api||'')}" onchange="updateSite(${i},this)">
      <label>播放地址</label><input name="playUrl" value="${esc(site.playUrl||'')}" onchange="updateSite(${i},this)">
      <label>搜索</label><input name="searchable" value="${esc(site.searchable||'1')}" onchange="updateSite(${i},this)" placeholder="1=可搜索">
      <label>筛选</label><input name="filterable" value="${esc(site.filterable||'1')}" onchange="updateSite(${i},this)" placeholder="1=可筛选">
      <button class="btn btn-danger" style="margin-top:8px;padding:4px 12px;font-size:12px" onclick="removeSite(${i})">删除</button>
    </div>`;
  });

  // Parses
  html += '<div class="section-title">🔗 解析 (parses) <button class="btn btn-success" onclick="addParse()" style="padding:4px 12px;font-size:12px;float:right">+ 添加</button></div>';
  if (configData.parses.length === 0) html += '<div class="empty-hint" style="padding:12px">暂无解析</div>';
  configData.parses.forEach((p, i) => {
    html += `<div class="visual-item" data-type="parse" data-index="${i}">
      <label>名称</label><input name="name" value="${esc(p.name||'')}" onchange="updateParse(${i},this)">
      <label>类型</label><input name="type" value="${esc(p.type||'')}" onchange="updateParse(${i},this)" placeholder="json/mp4">
      <label>URL</label><input name="url" value="${esc(p.url||'')}" onchange="updateParse(${i},this)">
      <button class="btn btn-danger" style="margin-top:8px;padding:4px 12px;font-size:12px" onclick="removeParse(${i})">删除</button>
    </div>`;
  });

  // Lives
  html += '<div class="section-title">📡 直播 (lives) <button class="btn btn-success" onclick="addLive()" style="padding:4px 12px;font-size:12px;float:right">+ 添加</button></div>';
  if (configData.lives.length === 0) html += '<div class="empty-hint" style="padding:12px">暂无直播</div>';
  configData.lives.forEach((l, i) => {
    html += `<div class="visual-item" data-type="live" data-index="${i}">
      <label>名称</label><input name="name" value="${esc(l.name||'')}" onchange="updateLive(${i},this)">
      <label>类型</label><input name="type" value="${esc(l.type||'0')}" onchange="updateLive(${i},this)">
      <label>URL</label><input name="url" value="${esc(l.url||'')}" onchange="updateLive(${i},this)">
      <label>UA</label><input name="ua" value="${esc(l.ua||'')}" onchange="updateLive(${i},this)">
      <button class="btn btn-danger" style="margin-top:8px;padding:4px 12px;font-size:12px" onclick="removeLive(${i})">删除</button>
    </div>`;
  });

  body.innerHTML = html;
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addSite() { configData.sites.push({ key:'', name:'', type:'0', api:'', playUrl:'', searchable:'1', filterable:'1' }); renderVisual(); syncSource(); }
function removeSite(i) { configData.sites.splice(i,1); renderVisual(); syncSource(); }
function updateSite(i, input) { configData.sites[i][input.name] = input.value; syncSource(); }

function addParse() { configData.parses.push({ name:'', type:'json', url:'' }); renderVisual(); syncSource(); }
function removeParse(i) { configData.parses.splice(i,1); renderVisual(); syncSource(); }
function updateParse(i, input) { configData.parses[i][input.name] = input.value; syncSource(); }

function addLive() { configData.lives.push({ name:'', type:'0', url:'', ua:'' }); renderVisual(); syncSource(); }
function removeLive(i) { configData.lives.splice(i,1); renderVisual(); syncSource(); }
function updateLive(i, input) { configData.lives[i][input.name] = input.value; syncSource(); }

function syncSource() {
  document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
}

// ===== 标签切换 =====
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='visual')||(i===1&&tab==='source')));
  document.getElementById('tab-visual').classList.toggle('active', tab==='visual');
  document.getElementById('tab-source').classList.toggle('active', tab==='source');
  if (tab === 'source') {
    document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
  }
}

// ===== 源码视图编辑同步 =====
document.getElementById('sourceCode').addEventListener('input', function() {
  try {
    const val = this.value.trim();
    if (val) { configData = JSON.parse(val); }
  } catch(e) {}
});

// ===== 功能按钮 =====
function copyCode() {
  const code = document.getElementById('sourceCode').value;
  if (!code) { showToast('没有内容可复制', 'error'); return; }
  navigator.clipboard.writeText(code).then(() => showToast('已复制到剪贴板！')).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制！');
  });
}

function saveLocal() {
  try {
    const val = document.getElementById('sourceCode').value;
    if (val) configData = JSON.parse(val);
    localStorage.setItem('tvbox_config', JSON.stringify(configData));
    showToast('已保存到本地缓存！');
  } catch(e) {
    showToast('保存失败：JSON格式错误', 'error');
  }
}

function clearAll() {
  if (!confirm('确定清空所有内容？此操作不可恢复（本地缓存也会清除）')) return;
  configData = { sites: [], parses: [], lives: [] };
  document.getElementById('sourceCode').value = '';
  renderVisual();
  localStorage.removeItem('tvbox_config');
  showToast('已清空');
}

function formatJson() {
  try {
    const val = document.getElementById('sourceCode').value;
    if (!val) return;
    const obj = JSON.parse(val);
    document.getElementById('sourceCode').value = JSON.stringify(obj, null, 2);
    configData = obj;
    renderVisual();
    showToast('格式化完成');
  } catch(e) {
    showToast('JSON格式错误，无法格式化', 'error');
  }
}

function exportJson() {
  try {
    const val = document.getElementById('sourceCode').value;
    const obj = val ? JSON.parse(val) : configData;
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tvbox_config_' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    showToast('导出成功！');
  } catch(e) {
    showToast('导出失败：JSON格式错误', 'error');
  }
}

function importJson() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const obj = JSON.parse(ev.target.result);
      configData = { sites: obj.sites || [], parses: obj.parses || [], lives: obj.lives || [] };
      renderVisual();
      document.getElementById('sourceCode').value = JSON.stringify(configData, null, 2);
      showToast('导入成功！');
    } catch(e) {
      showToast('文件格式错误', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== 历史记录 =====
function saveToHistory(url, type) {
  let history = JSON.parse(localStorage.getItem('tvbox_history') || '[]');
  history = history.filter(h => h.url !== url);
  history.unshift({ url, type, time: new Date().toLocaleString('zh-CN') });
  history = history.slice(0, 50);
  localStorage.setItem('tvbox_history', JSON.stringify(history));
}

function loadHistory() {
  const list = document.getElementById('historyList');
  const history = JSON.parse(localStorage.getItem('tvbox_history') || '[]');
  if (history.length === 0) { list.innerHTML = '<div class="empty-hint">暂无历史记录</div>'; return; }
  list.innerHTML = history.map((h, i) => `<div class="history-item" onclick="useHistory('${esc(h.url)}')">
    <div class="history-url">${esc(h.url)}</div>
    <div class="history-time">${h.type} · ${h.time}</div>
  </div>`).join('');
}

function useHistory(url) {
  document.getElementById('apiUrl').value = url;
  toggleHistory();
  loadFromUrl();
}

function clearHistory() {
  localStorage.removeItem('tvbox_history');
  loadHistory();
  showToast('历史已清空');
}

function toggleHistory() {
  document.getElementById('historyPanel').classList.toggle('open');
  document.getElementById('historyOverlay').classList.toggle('open');
  if (document.getElementById('historyPanel').classList.contains('open')) loadHistory();
}

// ===== Toast =====
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type === 'error' ? 'error' : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
