<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPTV 线路分享站4</title>
<style>
  :root {
    --primary: #1976d2;
    --primary-dark: #115293;
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #222;
    --text-light: #666;
    --border: #e0e0e0;
    --live-bg: #eef2f7;
    --origin-bg: #eaf2fd;
    --origin-border: #d6e6fb;
    --backup-bg: #f1f3f5;
    --backup-border: #e0e3e6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.9; margin-top: 4px; }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-box {
    flex: 1;
    min-width: 140px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px 8px 34px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.9);
  }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    font-size: 14px;
  }
  .mode-tabs {
    display: flex;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    overflow: hidden;
  }
  .mode-tab {
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    color: rgba(255,255,255,0.85);
    transition: 0.2s;
  }
  .mode-tab.active {
    background: #fff;
    color: var(--primary);
    font-weight: 600;
  }
  main {
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin: 20px 0 10px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .count-badge {
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 400;
  }
  /* 卡片通用 */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  /* 直播条目 */
  .live-entry {
    background: var(--live-bg);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #dfe6ee;
  }
  .live-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .live-title {
    font-size: 18px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .backup-time {
    font-size: 13px;
    color: #2e8b57;
  }
  /* 来源 + UA 行（移到红线上方） */
  .live-source-line {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-light);
    align-items: center;
    flex-wrap: wrap;
  }
  .source-tag {
    color: var(--primary);
    font-weight: 600;
  }
  .ua-text {
    color: #888;
    word-break: break-all;
  }
  /* 线路行通用 */
  .url-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    border: 1px solid transparent;
    transition: 0.2s;
  }
  .url-line:last-child { margin-bottom: 0; }
  .url-label {
    font-size: 13px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .url-text {
    flex: 1 1 120px;
    font-size: 14px;
    color: var(--primary);
    text-decoration: none;
    word-break: break-all;
    line-height: 1.5;
  }
  .url-text:hover { text-decoration: underline; }
  .copy-btn {
    padding: 4px 10px;
    font-size: 12px;
    border: none;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: 0.2s;
  }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied { background: #43a047; }
  /* 原始线路：标签+URL 同一浅蓝背景 */
  .live-entry .url-line {
    background: var(--origin-bg);
    border-color: var(--origin-border);
  }
  .live-entry .url-line .url-label {
    background: rgba(25,118,210,0.12);
    color: var(--primary);
  }
  /* 备份线路：淡灰 */
  .backup-line {
    background: var(--backup-bg);
    border-color: var(--backup-border);
  }
  .backup-line .url-label {
    background: #fff;
    color: #555;
    border: 1px solid #d8dce0;
  }
  /* 点播/下载卡片 */
  .vod-card, .download-card {
    padding: 14px;
  }
  .vod-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .vod-meta {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .vod-link {
    display: inline-block;
    color: var(--primary);
    text-decoration: none;
    font-size: 14px;
  }
  .download-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .download-desc {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 8px;
  }
  /* 关于页 */
  .about-page {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .about-page h2 { margin-top: 0; }
  .about-page p { font-size: 14px; color: var(--text-light); }
  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 15px;
  }
  /* 隐藏页 */
  .page { display: none; }
  .page.active { display: block; }
  /* 响应式 */
  @media (max-width: 600px) {
    .live-title { font-size: 16px; }
    .url-line { gap: 6px; padding: 8px 10px; }
    .url-text { font-size: 13px; }
    .copy-btn { padding: 3px 8px; font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <h1>IPTV 线路分享站</h1>
  <div class="header-sub">直播 · 点播 · 下载 · 每日更新</div>
  <div class="controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索线路名称...">
    </div>
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="live">直播</div>
      <div class="mode-tab" data-mode="vod">点播</div>
      <div class="mode-tab" data-mode="download">下载</div>
      <div class="mode-tab" data-mode="about">关于</div>
    </div>
  </div>
</header>

<main>
  <!-- 直播页 -->
  <div id="page-live" class="page active">
    <div class="section-title">直播线路 <span class="count-badge" id="liveCount">0</span></div>
    <div id="liveList"></div>
  </div>

  <!-- 点播页 -->
  <div id="page-vod" class="page">
    <div class="section-title">点播资源 <span class="count-badge" id="vodCount">0</span></div>
    <div id="vodList"></div>
  </div>

  <!-- 下载页 -->
  <div id="page-download" class="page">
    <div class="section-title">下载中心 <span class="count-badge" id="downloadCount">0</span></div>
    <div id="downloadList"></div>
  </div>

  <!-- 关于页 -->
  <div id="page-about" class="page">
    <div class="about-page">
      <h2>关于本页</h2>
      <p>本页面用于分享 IPTV 直播、点播线路及工具下载。</p>
      <p>数据自动从配置文件中加载，支持搜索与分类切换。</p>
      <p>使用方式：点击链接复制或打开，粘贴到对应播放器即可。</p>
      <p style="margin-top:16px;font-size:12px;">© 2026 IPTV Share</p>
    </div>
  </div>
</main>

<script>
let liveData = [];
let vodData = [];
let downloadData = [];
let currentMode = 'live';

// 复制功能
function copyText(text, btn) {
  const el = document.createElement('textarea');
  el.value = text;
  document.body.appendChild(el);
  el.select();
  try {
    document.execCommand('copy');
    btn.textContent = '已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 1200);
  } catch (e) {
    console.error('复制失败', e);
  }
  document.body.removeChild(el);
}

// 渲染直播
function renderLive(filter = '') {
  const list = document.getElementById('liveList');
  list.innerHTML = '';
  const kw = filter.trim().toLowerCase();
  const filtered = liveData.filter(item =>
    !kw || item.title.toLowerCase().includes(kw) ||
    (item.source && item.source.toLowerCase().includes(kw)) ||
    (item.ua && item.ua.toLowerCase().includes(kw))
  );
  document.getElementById('liveCount').textContent = filtered.length;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无匹配线路</div>';
    return;
  }
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'live-entry';
    
    // 来源 + UA 行（位于标题下、原始线路上方，即红线处）
    let sourceLine = '';
    if (item.source || item.ua) {
      const uaDisplay = item.ua && item.ua !== 'null' && item.ua !== 'undefined' ? `ua: ${item.ua}` : '';
      sourceLine = `
        <div class="live-source-line">
          ${item.source ? `<span class="source-tag">${item.source}</span>` : ''}
          ${uaDisplay ? `<span class="ua-text">${uaDisplay}</span>` : ''}
        </div>`;
    }
    
    // 原始线路：标签 + URL + 复制 同一浅蓝背景
    const originLine = item.origin ? `
      <div class="url-line">
        <span class="url-label">原始线路</span>
        <a class="url-text" href="${item.origin}" target="_blank" rel="noopener">${item.origin}</a>
        <button class="copy-btn" onclick="copyText('${item.origin.replace(/'/g, "\\'")}', this)">复制</button>
      </div>` : '';
    
    // 备份线路（保留原始后缀，淡灰）
    let backupLines = '';
    if (item.backups && item.backups.length) {
      item.backups.forEach((b, i) => {
        const label = b.label || `备份${numToChinese(i + 1)}线`;
        backupLines += `
          <div class="url-line backup-line">
            <span class="url-label">${label}</span>
            <a class="url-text" href="${b.url}" target="_blank" rel="noopener">${b.url}</a>
            <button class="copy-btn" onclick="copyText('${b.url.replace(/'/g, "\\'")}', this)">复制</button>
          </div>`;
      });
    }
    
    div.innerHTML = `
      <div class="live-header">
        <div class="live-title">${item.title}</div>
        <div class="backup-time">备份时间 ${item.time || '未知'}</div>
      </div>
      ${sourceLine}
      ${originLine}
      ${backupLines}
    `;
    list.appendChild(div);
  });
}

function numToChinese(n) {
  const map = ['一','二','三','四','五','六','七','八','九','十'];
  return map[n - 1] || n;
}

// 渲染点播
function renderVod(filter = '') {
  const list = document.getElementById('vodList');
  list.innerHTML = '';
  const kw = filter.trim().toLowerCase();
  const filtered = vodData.filter(item =>
    !kw || item.title.toLowerCase().includes(kw) ||
    (item.desc && item.desc.toLowerCase().includes(kw))
  );
  document.getElementById('vodCount').textContent = filtered.length;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无点播资源</div>';
    return;
  }
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card vod-card';
    div.innerHTML = `
      <div class="vod-title">${item.title}</div>
      <div class="vod-meta">${item.desc || ''}</div>
      <a class="vod-link" href="${item.url}" target="_blank" rel="noopener">▶ 播放 / 打开链接</a>
    `;
    list.appendChild(div);
  });
}

// 渲染下载
function renderDownload(filter = '') {
  const list = document.getElementById('downloadList');
  list.innerHTML = '';
  const kw = filter.trim().toLowerCase();
  const filtered = downloadData.filter(item =>
    !kw || item.name.toLowerCase().includes(kw) ||
    (item.desc && item.desc.toLowerCase().includes(kw))
  );
  document.getElementById('downloadCount').textContent = filtered.length;
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">暂无下载内容</div>';
    return;
  }
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card download-card';
    div.innerHTML = `
      <div class="download-name">${item.name}</div>
      <div class="download-desc">${item.desc || ''}</div>
      <a class="vod-link" href="${item.url}" target="_blank" rel="noopener" style="color:#43a047">⬇ 下载</a>
    `;
    list.appendChild(div);
  });
}

// 切换模式
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === `page-${mode}`);
  });
  const kw = document.getElementById('searchInput').value;
  if (mode === 'live') renderLive(kw);
  else if (mode === 'vod') renderVod(kw);
  else if (mode === 'download') renderDownload(kw);
}

// 解析直播数据
function parseLiveText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const result = [];
  let cur = null;
  lines.forEach(line => {
    if (line.startsWith('#')) {
      // 标题行：# 名称,来源,ua,时间
      const parts = line.replace(/^#\s*/, '').split(',');
      cur = {
        title: parts[0] || '未命名',
        source: parts[1] || '',
        ua: parts[2] || '',
        time: parts[3] || '',
        origin: '',
        backups: []
      };
      result.push(cur);
    } else if (cur) {
      // 线路行：标签$URL
      const idx = line.indexOf('$');
      if (idx > -1) {
        const label = line.substring(0, idx).trim();
        const url = line.substring(idx + 1).trim();
        if (label.includes('原始') || label.includes('主')) {
          cur.origin = url;
        } else {
          cur.backups.push({ label, url });
        }
      } else {
        // 无标签默认当原始
        if (!cur.origin) cur.origin = line;
        else cur.backups.push({ label: `备份${numToChinese(cur.backups.length + 1)}线`, url: line });
      }
    }
  });
  return result;
}

// 解析点播/下载（简单格式：标题 | 描述 | URL）
function parseSimple(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(s => s.trim());
    return {
      title: parts[0] || '',
      desc: parts[1] || '',
      url: parts[2] || '#'
    };
  }).filter(i => i.title);
}

// 加载数据
async function loadData() {
  try {
    const [liveRes, listRes] = await Promise.all([
      fetch('livelist.txt').then(r => r.text()),
      fetch('list.txt').then(r => r.text()).catch(() => '')
    ]);
    liveData = parseLiveText(liveRes);
    // list.txt 里可包含点播和下载，按前缀区分
    vodData = [];
    downloadData = [];
    listRes.split('\n').forEach(l => {
      const line = l.trim();
      if (!line) return;
      if (line.startsWith('vod:')) {
        const p = line.replace('vod:', '').split('|').map(s => s.trim());
        vodData.push({ title: p[0], desc: p[1], url: p[2] });
      } else if (line.startsWith('dl:')) {
        const p = line.replace('dl:', '').split('|').map(s => s.trim());
        downloadData.push({ name: p[0], desc: p[1], url: p[2] });
      }
    });
    renderLive();
  } catch (e) {
    document.getElementById('liveList').innerHTML =
      '<div class="empty-state">数据加载失败，请确保 livelist.txt / list.txt 存在并通过 HTTP 访问</div>';
    console.error(e);
  }
}

// 事件绑定
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});
document.getElementById('searchInput').addEventListener('input', e => {
  const v = e.target.value;
  if (currentMode === 'live') renderLive(v);
  else if (currentMode === 'vod') renderVod(v);
  else if (currentMode === 'download') renderDownload(v);
});

// 启动
loadData();
</script>

</body>
</html>
