<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>海量接口搬运备份5</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fa; color: #1e293b;
        padding: 16px 12px 8px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .container {
        max-width: 820px;
        margin: 0 auto;
        position: relative;
        padding: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    #modeToggleBtn {
        position: absolute; top: 12px; left: 8px; z-index: 999;
        width: 52px; padding: 4px 2px; border-radius: 12px;
        border: 1px solid #4a9eff; background: #fff; color: #4a9eff;
        font-size: 0.6rem; line-height: 1.25; text-align: center;
        cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    #modeToggleBtn:active { transform: scale(0.95); }

    .header-block { text-align: center; margin-bottom: 12px; padding-top: 12px; }
    h1 { font-size: 1.3rem; font-weight: 600; color: #0b1e33; }
    h1 .header-logo {
        width: 1.8rem; height: 1.8rem; border-radius: 50%;
        border: 1.5px solid #4a9eff; object-fit: cover;
        vertical-align: -0.45rem; margin-right: 6px;
    }
    .header-divider { height: 1px; background: #e9edf2; margin: 10px 0; }
    .subtitle { font-size: 0.8rem; color: #8b9eb0; line-height: 1.5; }

    .main-card {
        background: #ffffff; border-radius: 16px;
        padding: 16px 18px 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #f0f3f8;
        flex: 1;
    }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
    .nav-tab {
        padding: 7px 24px; border: 1.5px solid #4a9eff;
        border-radius: 40px; background: #fff; color: #4a9eff;
        font-size: 0.82rem; font-weight: 500; cursor: pointer;
        transition: all 0.2s; white-space: nowrap;
    }
    .nav-tab.active { background: #4a9eff; color: #fff; }
    .nav-tab:active { transform: scale(0.96); }

    .search-box {
        width: 100%; padding: 12px 16px;
        border: 1px solid #dce1e9; border-radius: 40px;
        font-size: 0.95rem; background: #fff; outline: none;
    }
    .search-box:focus { border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.15); }
    body.simple-mode .search-box { margin-bottom: 20px; }
    body:not(.simple-mode) .search-box { margin-bottom: 12px; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .api-list { padding: 0; }

    /* 点播条目 */
    .entry { padding: 16px 0; border-bottom: 1px solid #f0f4fa; }
    .entry:first-of-type { padding-top: 4px; }
    .entry:last-child { border-bottom: none; }
    .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .entry-name {
        font-size: 1.05rem; font-weight: 600; color: #0b1e33;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        flex-shrink: 1; min-width: 0;
    }
    .entry-meta-inline {
        margin-left: auto; display: flex; align-items: center;
        gap: 10px; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0;
    }
    .badge-new { color: #1b9e5a; } .badge-old { color: #b88b3a; }

    .url-line {
        padding: 5px 12px 5px 10px; margin-bottom: 6px;
        background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7;
        display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    }
    .url-line:last-child { margin-bottom: 0; }
    .url-tag {
        font-size: 0.7rem; font-weight: 500; color: #4a6a8a;
        background: #e6edf6; padding: 0 12px; border-radius: 30px;
        line-height: 24px; white-space: nowrap; flex-shrink: 0;
    }
    .url-text {
        font-size: 0.82rem; color: #2563eb;
        word-break: break-all; overflow-wrap: break-word;
        white-space: normal; line-height: 1.5; flex: 1 1 0; min-width: 40px;
    }
    .copy-btn {
        flex-shrink: 0; background: #4a9eff; color: white; border: none;
        border-radius: 30px; padding: 0 14px; font-size: 0.7rem; font-weight: 500;
        cursor: pointer; height: 26px; line-height: 26px;
        transition: background 0.15s; white-space: nowrap; margin-left: auto;
    }
    .copy-btn:active { background: #2a7ed9; transform: scale(0.96); }
    .copy-btn.copied { background: #3b9b6c; }

    .loading { text-align: center; color: #9aadc2; padding: 48px 0; font-size: 0.9rem; }
    .error-msg { text-align: center; color: #d9534f; padding: 16px; font-size: 0.82rem; background: #fff3f3; border-radius: 10px; margin: 8px 0; }

    .page-footer { text-align: center; padding: 20px 0 8px; font-size: 0.72rem; color: #9aadc2; flex-shrink: 0; }

    body.simple-mode .nav-tabs { display: none !important; }
    body.simple-mode #download-panel,
    body.simple-mode #about-panel,
    body.simple-mode #live-panel { display: none !important; }
    body.simple-mode #api-panel { display: block !important; }

    /* ===================== 直播页 ===================== */

    .live-top-aggregate {
        background: linear-gradient(135deg, #4a9eff 0%, #1e6fda 100%);
        border-radius: 16px; padding: 16px 18px; margin-bottom: 16px;
        color: #fff; box-shadow: 0 4px 12px rgba(74, 158, 255, 0.3);
    }
    .live-top-aggregate h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    .live-top-aggregate .domain-line {
        background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
        margin-top: 8px; display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 40px;
    }
    .live-top-aggregate .domain-line span { color: #fff; font-weight: 500; flex: 1; font-size: 0.75rem; word-break: break-all; }
    .live-top-aggregate .copy-btn { background: rgba(255,255,255,0.9); color: #1e6fda; font-weight: 600; }
    .live-top-aggregate .copy-btn.copied { background: #3b9b6c; color: #fff; }

    /* 直播条目 */
    .live-entry {
        background: #eef2f7;
        border: 1px solid #dce6f0;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
    }
    .live-entry:last-child { margin-bottom: 0; }

    .live-entry .entry-header {
        margin-bottom: 10px;
    }

    /* ✅✅✅ 左右两栏核心布局 ✅✅✅ */
    .live-split-row {
        display: flex;
        align-items: center;          /* 左栏整体垂直居中，跟随右栏高度 */
        gap: 16px;
        margin-bottom: 10px;
    }

    /* 左栏 */
    .live-split-left {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;                    /* 来源和原始线路之间间距 */
    }

    /* 右栏 */
    .live-split-right {
        flex: 1;
        min-width: 0;
    }

    /* 来源文字 */
    .live-source-text {
        font-size: 0.78rem;
        font-weight: 500;
        color: #4a6a8a;
        line-height: 1.4;
    }

    /* UA 文字 */
    .live-ua-text {
        font-size: 0.75rem;
        color: #5a6f88;
        line-height: 1.5;
        word-break: break-all;
        overflow-wrap: break-word;
    }

    /* 原始线路行（左栏第二行） */
    .live-origin-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 8px;
    }
    .live-origin-row .url-tag {
        font-size: 0.68rem;
        padding: 0 10px;
        line-height: 22px;
        flex-shrink: 0;
    }
    .live-origin-row .url-text {
        font-size: 0.78rem;
        flex: 1 1 80px;
        min-width: 60px;
        word-break: break-all;
        overflow-wrap: break-word;
        white-space: normal;
        line-height: 1.4;
    }
    .live-origin-row .copy-btn {
        font-size: 0.65rem;
        padding: 0 10px;
        height: 24px;
        line-height: 24px;
        flex-shrink: 0;
    }

    /* 备份线路 */
    .live-entry .url-line.backup-line {
        background: #f8fafc;
        border: 1px solid #eef2f7;
        border-radius: 40px;
        padding: 5px 12px 5px 10px;
        margin-bottom: 6px;
    }
    .live-entry .url-line.backup-line:last-child { margin-bottom: 0; }

    @media (max-width: 600px) {
        body { padding: 12px 6px 4px; }
        #modeToggleBtn { top: 10px; left: 6px; width: 46px; font-size: 0.55rem; padding: 3px 1px; border-radius: 10px; }
        .header-block { padding-top: 8px; margin-bottom: 8px; }
        .main-card { padding: 12px 12px 10px; }
        h1 .header-logo { width: 1.6rem; height: 1.6rem; vertical-align: -0.4rem; }
        .nav-tab { padding: 6px 20px; font-size: 0.78rem; }
        .live-entry { padding: 12px; }
        .live-split-row { gap: 10px; }
        .live-source-text { font-size: 0.72rem; }
        .live-ua-text { font-size: 0.7rem; }
        .live-origin-row .url-tag { font-size: 0.62rem; padding: 0 8px; line-height: 20px; }
        .live-origin-row .url-text { font-size: 0.72rem; }
        .live-origin-row .copy-btn { font-size: 0.6rem; padding: 0 8px; height: 22px; line-height: 22px; }
        .live-entry .url-line.backup-line { padding: 4px 8px; }
    }
</style>
</head>
<body class="simple-mode">

<div class="container">
    <button id="modeToggleBtn">切换<br>全能版</button>

    <div class="header-block">
        <h1><img class="header-logo" src="https://0.12yue.de5.net/tvbox/x/jueson.jpg" alt="Logo">海量接口搬运备份</h1>
        <div class="header-divider"></div>
        <p class="subtitle">备用数据源，防屏不迷路<br>QQ交流群：1067685939</p>
    </div>

    <input class="search-box" id="search" type="text" placeholder="🔍 搜索..." oninput="globalSearch()">

    <div class="main-card">

        <div class="tab-panel active" id="api-panel">

            <div class="loading" id="liveLoading">⏳ 正在加载直播源...</div>
            <div id="liveContainer"></div>
        </div>

        <div class="tab-panel" id="download-panel">
            <div id="downloads-content"><div class="loading">⏳ 正在加载下载资源...</div></div>
        </div>

        <div class="tab-panel" id="about-panel">
            <div class="about-inner" style="background:#f8fafc;border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid #eef2f7;">
                <h3 style="font-size:0.92rem;font-weight:600;color:#0b1e33;margin-bottom:8px;">🌐 备份线路域名</h3>
                <p style="margin-bottom:6px;font-size:0.76rem;color:#5a6f88;">三个域名互为备份，任一个可用：</p>
                <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:40px;border:1px solid #e0e6ed;margin-top:6px;">
                    <span style="flex:1;font-size:0.75rem;color:#2563eb;word-break:break-all;">https://0.12yue.de5.net</span>
                    <button class="copy-btn" data-url="https://0.12yue.de5.net">复制</button>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:40px;border:1px solid #e0e6ed;margin-top:6px;">
                    <span style="flex:1;font-size:0.75rem;color:#2563eb;word-break:break-all;">https://0.cdz.qzz.io</span>
                    <button class="copy-btn" data-url="https://0.cdz.qzz.io">复制</button>
                </div>
                <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:#fff;border-radius:40px;border:1px solid #e0e6ed;margin-top:6px;">
                    <span style="flex:1;font-size:0.75rem;color:#2563eb;word-break:break-all;">https://0.wdzb.eu.cc</span>
                    <button class="copy-btn" data-url="https://0.wdzb.eu.cc">复制</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <p>本站接口资源由【误道者】整理。所有资源均来自互联网，版权归原作者所有。仅供测试学习使用，请勿用于违法及商业用途，请勿付费购买。如涉及侵权，请联系删除。 QQ 群：1067685939。</p>
    </footer>
</div>

<script>
    const MODE_KEY = 'site_mode';
    const btn = document.getElementById('modeToggleBtn');
    const searchBox = document.getElementById('search');
    const mainCard = document.querySelector('.main-card');
    const navTabs = document.getElementById('navTabs');

    const API_DOMAINS = [
        { tag: "备份一线", base: "https://0.12yue.de5.net/tvbox/" },
        { tag: "备份二线", base: "https://0.cdz.qzz.io/tvbox/" },
        { tag: "备份三线", base: "https://0.wdzb.eu.cc/tvbox/" }
    ];
    const API_WEIGHTS = {
        "幸福年.json": 1, "老子数到三.json": 2, "饭太硬.json": 4, "肥猫.json": 5,
        "摸鱼.json": 6, "王二小.json": 7, "集多.json": 8, "潇洒.json": 9,
        "小米.json": 10, "嗷呜.json": 11, "南风.json": 12, "小虎斑.json": 13
    };
    const ROTATE_NAMES = ["幸福年年", "菠菜园", "少儿频道", "更新专用接口", "菠菜pro"];

    const LIVE_DOMAINS = [
        { tag: "备份一线", base: "https://0.12yue.de5.net/tvbox/live/" },
        { tag: "备份二线", base: "https://0.cdz.qzz.io/tvbox/live/" },
        { tag: "备份三线", base: "https://0.wdzb.eu.cc/tvbox/live/" }
    ];
    const LIVE_AGGREGATE = {
        name: "海量直播聚合多线路专用接口",
        url: "https://0.12yue.de5.net/tvbox/海量直播线路.json"
    };

    let currentMode = localStorage.getItem(MODE_KEY) || 'simple';
    document.body.className = currentMode + '-mode';
    updateBtnText();
    positionSearchBox();

    let topSeed = Date.now();
    let lastTopName = null;

    function getTopItem(rotateItems) {
        if (!rotateItems.length) return null;
        if (rotateItems.length === 1) return rotateItems[0];
        let idx = Math.abs(Math.floor(Math.sin(topSeed) * 10000)) % rotateItems.length;
        const candidate = rotateItems[idx];
        if (candidate.name === lastTopName) idx = (idx + 1) % rotateItems.length;
        return rotateItems[idx];
    }
    function rollTop() { topSeed = Date.now() + Math.random(); }

    function ensureJson(name) { return name.endsWith('.json') ? name : name + '.json'; }

    function bindCopy(container) {
        if (!container) return;
        container.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const url = this.getAttribute('data-url');
                if (!url) return;
                const done = () => {
                    const orig = this.textContent;
                    this.textContent = '✅ 已复制'; this.classList.add('copied');
                    setTimeout(() => { this.textContent = orig; this.classList.remove('copied'); }, 1500);
                };
                if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(fallback);
                else fallback();
                function fallback() {
                    const input = document.createElement('input');
                    input.value = url; document.body.appendChild(input);
                    input.select(); document.execCommand('copy'); document.body.removeChild(input); done();
                }
            });
        });
    }

    let rawListText = null;
    async function fetchListText() {
        if (rawListText !== null) return rawListText;
        const res = await fetch('list.txt?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        rawListText = await res.text();
        return rawListText;
    }

    function parseItems(text) {
        const lines = text.trim().split('\n').filter(l => l.trim());
        return lines.map(line => {
            const parts = line.split('|').map(s => s.trim());
            const file = parts[0];
            return {
                file: file,
                name: file.replace(/\.json$/i, ''),
                date: parts[1] || '',
                size: parts[2] || '',
                origUrl: parts[3] || '',
                weight: API_WEIGHTS.hasOwnProperty(file) ? API_WEIGHTS[file] : 999
            };
        });
    }

    function formatDateToChinese(d) {
        if (!d || d.length !== 8) return '----';
        return `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日`;
    }
    function isRecent(d) {
        if (!d || d.length !== 8) return false;
        const y = parseInt(d.slice(0,4),10), m = parseInt(d.slice(4,6),10)-1, day = parseInt(d.slice(6,8),10);
        return (Date.now() - new Date(y, m, day).getTime()) / 86400000 <= 2;
    }

    function renderApi(forceRoll) {
        const container = document.getElementById('listContainer');
        if (forceRoll) rollTop();

        fetchListText().then(text => {
            const loadingTip = document.getElementById('apiLoading');
            if (loadingTip) loadingTip.style.display = 'none';

            let items = parseItems(text);
            const rotateSet = new Set(ROTATE_NAMES.map(n => n.toLowerCase()));
            const rotateItems = items.filter(i => rotateSet.has(i.name.toLowerCase()));
            const topItem = getTopItem(rotateItems);
            if (topItem) { topItem.weight = Number.MIN_SAFE_INTEGER; lastTopName = topItem.name; }
            items.sort((a, b) => a.weight - b.weight);

            let html = '';
            items.forEach(it => {
                const isNew = isRecent(it.date);
                const cls = isNew ? 'badge-new' : 'badge-old';
                const jsonName = ensureJson(it.file);
                let linesHtml = '';
                if (it.origUrl) {
                    linesHtml += `<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`;
                }
                API_DOMAINS.forEach(d => {
                    const url = d.base + jsonName;
                    linesHtml += `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${url}</span><button class="copy-btn" data-url="${url}">复制</button></div>`;
                });
                html += `<div class="entry" data-name="${it.name.toLowerCase()}">
                    <div class="entry-header">
                        <div class="entry-name" title="${it.name}">${it.name}</div>
                        <div class="entry-meta-inline"><span class="${cls}">备份时间 ${formatDateToChinese(it.date)}</span>${it.size ? '&nbsp;&nbsp;' + it.size : ''}</div>
                    </div>
                    <div>${linesHtml}</div>
                </div>`;
            });

            container.innerHTML = html;
            bindCopy(container);
        }).catch(err => {
            const loadingTip = document.getElementById('apiLoading');
            if (loadingTip) loadingTip.style.display = 'none';
            container.innerHTML = `<div class="error-msg">❌ 接口加载失败：${err}</div>`;
        });
    }

    // ===================== 直播页渲染 =====================
    async function renderLive() {
        const container = document.getElementById('liveContainer');
        const loadingTip = document.getElementById('liveLoading');
        if (loadingTip) loadingTip.style.display = 'none';

        try {
            const res = await fetch('livelist.txt?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();

            let html = `<div class="live-top-aggregate">
                <h3>${LIVE_AGGREGATE.name}</h3>
                <div style="display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:40px;margin-top:8px;">
                    <span style="color:#fff;font-weight:500;flex:1;font-size:0.75rem;word-break:break-all;">${LIVE_AGGREGATE.url}</span>
                    <button class="copy-btn" data-url="${LIVE_AGGREGATE.url}" style="background:rgba(255,255,255,0.9);color:#1e6fda;font-weight:600;">复制</button>
                </div>
            </div>`;

            const lines = text.trim().split('\n').filter(l => l.trim());
            html += '<div class="api-list">';

            lines.forEach(line => {
                const parts = line.split('|').map(s => s.trim());
                const fileName = parts[0] || '';
                const date = parts[1] || '';
                const size = parts[2] || '';
                const rawUrl = parts[3] || '';
                const source = parts[4] || '';
                const ua = parts[5] || '';

                const displayName = fileName.replace(/\.[^.]+$/i, '');
                const isNew = isRecent(date);
                const cls = isNew ? 'badge-new' : 'badge-old';

                // 左栏
                const leftCol = `
                    <div class="live-split-left">
                        ${source ? `<div class="live-source-text">${source}</div>` : ''}
                        ${rawUrl ? `<div class="live-origin-row">
                            <span class="url-tag">原始线路</span>
                            <span class="url-text">${rawUrl}</span>
                            <button class="copy-btn" data-url="${rawUrl}">复制</button>
                        </div>` : ''}
                    </div>
                `;

                // 右栏
                const rightCol = `
                    <div class="live-split-right">
                        <div class="live-ua-text">${ua ? 'ua: ' + ua : 'ua: null'}</div>
                    </div>
                `;

                // 备份线路
                const backupLines = LIVE_DOMAINS.map(d => {
                    const url = d.base + fileName;
                    return `<div class="url-line backup-line">
                        <span class="url-tag">${d.tag}</span>
                        <span class="url-text">${url}</span>
                        <button class="copy-btn" data-url="${url}">复制</button>
                    </div>`;
                }).join('');

                html += `<div class="live-entry" data-name="${displayName.toLowerCase()}">
                    <div class="entry-header">
                        <div class="entry-name" title="${displayName}">${displayName}</div>
                        <div class="entry-meta-inline">
                            <span class="${cls}">备份时间 ${formatDateToChinese(date)}</span>
                            ${size ? '&nbsp;&nbsp;' + size : ''}
                        </div>
                    </div>

                    <div class="live-split-row">
                        ${leftCol}
                        ${rightCol}
                    </div>

                    ${backupLines}
                </div>`;
            });

            html += '</div>';
            container.innerHTML = html;
            bindCopy(container);

        } catch (err) {
            container.innerHTML = `<div class="error-msg">❌ 直播源加载失败：${err}</div>`;
        }
    }

    const tabsData = [
        { id: "api", label: "点播", hideSearch: false },
        { id: "live", label: "直播", hideSearch: false },
        { id: "download", label: "下载", hideSearch: false },
        { id: "about", label: "关于", hideSearch: true }
    ];

    function renderTabs() {
        const nav = document.getElementById('navTabs');
        nav.innerHTML = tabsData.map(t => `<button class="nav-tab ${t.id === 'api' ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
        nav.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                nav.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                showPanel(this.getAttribute('data-tab'), true);
            });
        });
    }

    let lastTab = 'api';
    function showPanel(tabId, fromTabClick) {
        if (tabId === 'api' && lastTab !== 'api' && fromTabClick !== false) renderApi(true);
        if (tabId === 'live' && lastTab !== 'live') renderLive();
        lastTab = tabId;

        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById(tabId + '-panel');
        if (panel) panel.classList.add('active');

        if (tabId === 'download') { /* 下载逻辑 */ }
        if (tabId === 'about') bindCopy(document.getElementById('about-panel'));

        const targetTab = tabsData.find(t => t.id === tabId);
        if (searchBox) searchBox.style.display = (targetTab && targetTab.hideSearch) ? 'none' : '';
    }

    function globalSearch() {
        const kw = (searchBox.value || '').toLowerCase().trim();
        document.querySelectorAll('#api-panel .entry').forEach(e => {
            const name = e.getAttribute('data-name') || '';
            e.style.display = name.includes(kw) ? '' : 'none';
        });
        document.querySelectorAll('#live-panel .live-entry').forEach(e => {
            const name = e.getAttribute('data-name') || '';
            e.style.display = name.includes(kw) ? '' : 'none';
        });
    }

    function positionSearchBox() {
        if (currentMode === 'simple') {
            if (searchBox.parentNode !== mainCard.parentNode) mainCard.parentNode.insertBefore(searchBox, mainCard);
        } else {
            if (searchBox.parentNode !== mainCard) navTabs.insertAdjacentElement('afterend', searchBox);
        }
    }

    function updateBtnText() {
        btn.innerHTML = currentMode === 'simple' ? '切换<br>全能版' : '切换<br>简洁版';
    }

    btn.addEventListener('click', () => {
        rollTop();
        currentMode = (currentMode === 'simple') ? 'full' : 'simple';
        localStorage.setItem(MODE_KEY, currentMode);
        document.body.className = currentMode + '-mode';
        updateBtnText();
        positionSearchBox();
        if (currentMode !== 'simple') {
            showPanel('api', true);
        } else {
            showPanel('api', true);
        }
    });

    renderTabs();
    renderApi(false);
</script>
</body>
</html>
