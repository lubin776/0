<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>海量接口搬运备份量</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 16px 12px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== 新增：顶部 Flex 布局 ===== */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e9edf2;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .header-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid #4a9eff;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(74, 158, 255, 0.2);
        }

        .header-text {
            min-width: 0;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0b1e33;
            margin: 0 0 2px 0;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #8b9eb0;
            margin: 0;
            line-height: 1.4;
        }

        .header-right {
            text-align: center;
            flex-shrink: 0;
        }

        .header-qrcode {
            width: 84px;
            height: 84px;
            border-radius: 10px;
            border: 1px solid #eef2f7;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }

        .qrcode-desc {
            font-size: 0.65rem;
            color: #8b9eb0;
            margin-top: 4px;
            line-height: 1.2;
        }

        /* ===== 以下原有样式不变 ===== */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dce1e9;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }

        .big-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f3f8;
        }

        .entry {
            padding: 16px 0;
            border-bottom: 1px solid #f0f4fa;
        }
        .entry:last-child {
            border-bottom: none;
        }

        .entry-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .entry-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0b1e33;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }

        .entry-note {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: flex-end;
        }
        .note-tag {
            background: #e8f4ff;
            color: #2a6bb0;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            line-height: 1.5;
            display: inline-block;
            max-width: 100%;
            white-space: normal;
            word-break: break-all;
            vertical-align: middle;
        }

        .entry-meta {
            display: block;
            padding: 6px 0;
            border-top: 1px solid #f0f4fa;
            border-bottom: 1px solid #f0f4fa;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .entry-meta::-webkit-scrollbar {
            display: none;
        }

        .meta-item {
            display: inline-block;
            font-size: 0.78rem;
            color: #5a6f88;
            padding: 0 6px;
            margin-right: 12px;
        }
        .meta-item:last-child {
            margin-right: 0;
        }

        .badge-new { color: #1b9e5a; }
        .badge-old { color: #b88b3a; }

        .entry-urls {
            display: block;
        }

        .url-line {
            padding: 5px 12px 5px 10px;
            margin-bottom: 6px;
            background: #f8fafc;
            border-radius: 40px;
            border: 1px solid #eef2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .url-line:last-child {
            margin-bottom: 0;
        }

        .url-tag {
            font-size: 0.7rem;
            font-weight: 500;
            color: #4a6a8a;
            background: #e6edf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 24px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .url-text {
            font-size: 0.82rem;
            color: #2563eb;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.5;
            flex: 1 1 0;
            min-width: 40px;
        }

        .copy-btn {
            flex-shrink: 0;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 14px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            height: 26px;
            line-height: 26px;
            transition: background 0.15s, transform 0.05s;
            white-space: nowrap;
            margin-left: auto;
        }
        .copy-btn:active {
            background: #2a7ed9;
            transform: scale(0.96);
        }
        .copy-btn.copied {
            background: #3b9b6c;
        }

        .loading, .empty {
            text-align: center;
            color: #9aadc2;
            padding: 48px 0;
            font-size: 0.9rem;
            background: #fff;
            border-radius: 24px;
            border: 1px dashed #dce3ed;
        }

        .entry.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            body { padding: 12px 6px; }
            .header-logo { width: 44px; height: 44px; }
            h1 { font-size: 1.1rem; }
            .subtitle { font-size: 0.75rem; }
            .header-qrcode { width: 72px; height: 72px; }
            .qrcode-desc { font-size: 0.6rem; }
            .big-card { padding: 12px 12px 10px; }
            .entry { padding: 12px 0; }
            .entry-header { gap: 6px; margin-bottom: 6px; }
            .entry-name { font-size: 0.95rem; }
            .entry-meta { font-size: 0.7rem; padding: 4px 0; margin-bottom: 8px; }
            .url-line { padding: 4px 8px; gap: 4px 6px; }
            .url-tag { font-size: 0.65rem; padding: 0 10px; line-height: 22px; }
            .url-text { font-size: 0.75rem; min-width: 30px; }
            .copy-btn { font-size: 0.65rem; padding: 0 10px; height: 24px; line-height: 24px; }
            .note-tag { font-size: 0.65rem; padding: 1px 10px; }
        }

        @media (max-width: 420px) {
            .header-logo { width: 38px; height: 38px; }
            h1 { font-size: 1rem; }
            .subtitle { font-size: 0.7rem; }
            .header-qrcode { width: 60px; height: 60px; }
            .qrcode-desc { font-size: 0.55rem; }
            .big-card { padding: 10px 8px 8px; }
            .entry { padding: 10px 0; }
            .entry-header { gap: 4px; margin-bottom: 4px; }
            .entry-name { font-size: 0.88rem; }
            .entry-meta { font-size: 0.6rem; gap: 4px 10px; margin-bottom: 6px; }
            .url-line { padding: 3px 6px; gap: 3px 4px; }
            .url-tag { font-size: 0.55rem; padding: 0 8px; line-height: 20px; }
            .url-text { font-size: 0.7rem; min-width: 20px; }
            .copy-btn { font-size: 0.55rem; padding: 0 8px; height: 20px; line-height: 20px; }
            .note-tag { font-size: 0.55rem; padding: 1px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部：左边 Logo+标题，右边二维码 -->
        <div class="header-section">
            <div class="header-left">
                <img class="header-logo" src="https://0.12yue.de5.net/tvbox/x/jueson.jpg" alt="Logo">
                <div class="header-text">
                    <h1>海量接口搬运备份</h1>
                    <p class="subtitle">点击链接复制，粘贴到 TVBox 即可使用</p>
                </div>
            </div>
            <div class="header-right">
                <img class="header-qrcode" src="https://0.12yue.de5.net/tvbox/x/lib/加群.jpeg" alt="加群二维码">
                <p class="qrcode-desc">扫码加群</p>
            </div>
        </div>

        <input class="search-box" id="search" type="text" placeholder="搜索接口名称..." oninput="filterList()">
        <div id="listContainer">
            <div class="loading">⏳ 正在加载接口列表...</div>
        </div>
    </div>

    <script>

        (function() {
            // ... 你原来的全部 JS ...
        })();
    </script>
</body>
</html>
