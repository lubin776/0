<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>海量接口搬运备份</title>
    
    <style>
        /* 原有样式不变，省略... 我直接给你完整代码 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 16px 12px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* ===== 新增：Logo 样式 ===== */
        .logo-wrap {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2.5px solid #4a9eff;
            object-fit: cover;
            box-shadow: 0 2px 10px rgba(74, 158, 255, 0.25);
        }

        /* ===== 新增：加群二维码区域 ===== */
        .qrcode-wrap {
            text-align: center;
            margin-bottom: 18px;
            padding: 14px 12px 16px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f3f8;
        }
        .qrcode-tip {
            font-size: 0.82rem;
            color: #5a6f88;
            margin-bottom: 10px;
        }
        .qrcode-img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            border: 1px solid #eef2f7;
            object-fit: cover;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 4px 0 2px;
            color: #0b1e33;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #8b9eb0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dce1e9;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }

        .big-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f3f8;
        }

        .entry {
            padding: 16px 0;
            border-bottom: 1px solid #f0f4fa;
        }
        .entry:last-child {
            border-bottom: none;
        }

        .entry-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .entry-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0b1e33;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 1;
            min-width: 0;
        }

        .entry-note {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: flex-end;
        }
        .note-tag {
            background: #e8f4ff;
            color: #2a6bb0;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            line-height: 1.5;
            display: inline-block;
            max-width: 100%;
            white-space: normal;
            word-break: break-all;
            vertical-align: middle;
        }

        .entry-meta {
            display: block;
            padding: 6px 0;
            border-top: 1px solid #f0f4fa;
            border-bottom: 1px solid #f0f4fa;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .entry-meta::-webkit-scrollbar {
            display: none;
        }

        .meta-item {
            display: inline-block;
            font-size: 0.78rem;
            color: #5a6f88;
            padding: 0 6px;
            margin-right: 12px;
        }
        .meta-item:last-child {
            margin-right: 0;
        }

        .badge-new { color: #1b9e5a; }
        .badge-old { color: #b88b3a; }

        .entry-urls {
            display: block;
        }

        .url-line {
            padding: 5px 12px 5px 10px;
            margin-bottom: 6px;
            background: #f8fafc;
            border-radius: 40px;
            border: 1px solid #eef2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .url-line:last-child {
            margin-bottom: 0;
        }

        .url-tag {
            font-size: 0.7rem;
            font-weight: 500;
            color: #4a6a8a;
            background: #e6edf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 24px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .url-text {
            font-size: 0.82rem;
            color: #2563eb;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.5;
            flex: 1 1 0;
            min-width: 40px;
        }

        .copy-btn {
            flex-shrink: 0;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 14px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            height: 26px;
            line-height: 26px;
            transition: background 0.15s, transform 0.05s;
            white-space: nowrap;
            margin-left: auto;
        }
        .copy-btn:active {
            background: #2a7ed9;
            transform: scale(0.96);
        }
        .copy-btn.copied {
            background: #3b9b6c;
        }

        .loading, .empty {
            text-align: center;
            color: #9aadc2;
            padding: 48px 0;
            font-size: 0.9rem;
            background: #fff;
            border-radius: 24px;
            border: 1px dashed #dce3ed;
        }

        .entry.hidden {
            display: none;
        }

        @media (max-width: 600px) {
            body { padding: 12px 6px; }
            .logo-img { width: 52px; height: 52px; }
            .qrcode-img { width: 140px; height: 140px; }
            .big-card { padding: 12px 12px 10px; }
            .entry { padding: 12px 0; }
            .entry-header { gap: 6px; margin-bottom: 6px; }
            .entry-name { font-size: 0.95rem; }
            .entry-meta { font-size: 0.7rem; padding: 4px 0; margin-bottom: 8px; }
            .url-line { padding: 4px 8px; gap: 4px 6px; }
            .url-tag { font-size: 0.65rem; padding: 0 10px; line-height: 22px; }
            .url-text { font-size: 0.75rem; min-width: 30px; }
            .copy-btn { font-size: 0.65rem; padding: 0 10px; height: 24px; line-height: 24px; }
            .note-tag { font-size: 0.65rem; padding: 1px 10px; }
        }

        @media (max-width: 420px) {
            .logo-img { width: 44px; height: 44px; }
            .qrcode-img { width: 120px; height: 120px; }
            .big-card { padding: 10px 8px 8px; }
            .entry { padding: 10px 0; }
            .entry-header { gap: 4px; margin-bottom: 4px; }
            .entry-name { font-size: 0.88rem; }
            .entry-meta { font-size: 0.6rem; gap: 4px 10px; margin-bottom: 6px; }
            .url-line { padding: 3px 6px; gap: 3px 4px; }
            .url-tag { font-size: 0.55rem; padding: 0 8px; line-height: 20px; }
            .url-text { font-size: 0.7rem; min-width: 20px; }
            .copy-btn { font-size: 0.55rem; padding: 0 8px; height: 20px; line-height: 20px; }
            .note-tag { font-size: 0.55rem; padding: 1px 6px; }
        }
    </style>
</head>
