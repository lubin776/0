<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>海量接口搬运动备份</title>
    <style>
        /* 重置 & 基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 16px 12px;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 4px 0 2px;
            color: #0b1e33;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #8b9eb0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 12px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dce1e9;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }

        /* 卡片列表 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 单个卡片 */
        .card-item {
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 16px 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f3f8;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            overflow: hidden;   /* 防止任何溢出 */
        }

        /* ---------- 第一行：接口名称 ---------- */
        .card-name {
            font-size: 0.98rem;
            font-weight: 600;
            color: #0b1e33;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.5;
        }

        /* ---------- 第二行：状态 + 日期 + 体积 （强制一行，居左） ---------- */
        .card-meta {
            display: flex;
            flex-wrap: nowrap;          /* 坚决不换行 */
            align-items: center;
            gap: 6px 16px;
            font-size: 0.72rem;
            color: #5a6f88;
            padding: 4px 0;
            border-top: 1px solid #f0f4fa;
            border-bottom: 1px solid #f0f4fa;
            overflow: hidden;
            white-space: nowrap;
        }
        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;            /* 不压缩，保持在一行 */
        }
        .badge-new {
            color: #1b9e5a;
        }
        .badge-old {
            color: #b88b3a;
        }
        .note-tag {
            background: #e8f4ff;
            color: #2a6bb0;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            line-height: 20px;
            flex-shrink: 0;
        }

        /* ---------- 第三行及以后：每个URL独立一行 ---------- */
        .card-urls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .url-line {
            display: flex;
            flex-wrap: wrap;            /* URL过长时自动换行 */
            align-items: center;
            gap: 4px 6px;
            background: #f8fafc;
            padding: 5px 10px 5px 8px;
            border-radius: 30px;
            border: 1px solid #eef2f7;
            width: 100%;
            overflow: hidden;
        }
        .url-tag {
            font-size: 0.65rem;
            font-weight: 500;
            color: #4a6a8a;
            background: #e6edf6;
            padding: 0 10px;
            border-radius: 30px;
            line-height: 22px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .url-text {
            font-size: 0.8rem;
            color: #2563eb;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.5;
            flex: 1 1 0;               /* 占据剩余空间，允许换行 */
            min-width: 30px;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: border-color 0.12s;
        }
        .url-text:hover {
            border-bottom-color: #2563eb;
        }
        .copy-btn {
            flex-shrink: 0;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 12px;
            font-size: 0.65rem;
            font-weight: 500;
            cursor: pointer;
            height: 24px;
            line-height: 24px;
            transition: background 0.15s, transform 0.05s;
            white-space: nowrap;
            margin-left: auto;          /* 靠右 */
        }
        .copy-btn:active {
            background: #2a7ed9;
            transform: scale(0.96);
        }
        .copy-btn.copied {
            background: #3b9b6c;
        }

        /* 辅助 */
        .loading, .empty {
            text-align: center;
            color: #9aadc2;
            padding: 48px 0;
            font-size: 0.9rem;
            background: #fff;
            border-radius: 24px;
            border: 1px dashed #dce3ed;
        }
        .card-item.hidden {
            display: none;
        }

        /* ---------- 手机端优化（确保不溢出，元数据强制一行，URL自动换行） ---------- */
        @media (max-width: 600px) {
            body { padding: 12px 6px; }
            .card-item { padding: 12px 10px 10px; gap: 5px; }

            .card-name { font-size: 0.92rem; }

            /* 元数据行：强制一行，如果宽度不够则横向滚动（但不会换行） */
            .card-meta {
                font-size: 0.65rem;
                gap: 4px 10px;
                padding: 3px 0;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .card-meta::-webkit-scrollbar { display: none; }
            .meta-item { flex-shrink: 0; }
            .note-tag { font-size: 0.6rem; line-height: 18px; padding: 0 8px; }

            /* URL行 */
            .url-line { padding: 4px 6px; gap: 3px 4px; }
            .url-tag { font-size: 0.6rem; padding: 0 8px; line-height: 20px; }
            .url-text { font-size: 0.74rem; min-width: 20px; flex: 1 1 0; }
            .copy-btn { font-size: 0.6rem; padding: 0 10px; height: 22px; line-height: 22px; }
        }

        @media (max-width: 420px) {
            .card-item { padding: 10px 6px 8px; gap: 4px; }
            .card-name { font-size: 0.86rem; }
            .card-meta { font-size: 0.6rem; gap: 2px 8px; padding: 2px 0; }
            .url-line { padding: 3px 4px; gap: 2px 3px; }
            .url-tag { font-size: 0.55rem; padding: 0 6px; line-height: 18px; }
            .url-text { font-size: 0.7rem; min-width: 15px; }
            .copy-btn { font-size: 0.55rem; padding: 0 8px; height: 20px; line-height: 20px; }
            .note-tag { font-size: 0.55rem; line-height: 16px; padding: 0 6px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📦 海量接口搬运备份</h1>
    <p class="subtitle">点击链接复制，粘贴到 TVBox 即可使用</p>
    <input class="search-box" id="search" type="text" placeholder="搜索接口名称..." oninput="filterList()">

    <div id="listContainer">
        <div class="loading">⏳ 正在加载接口列表...</div>
    </div>
</div>

<script>
    (function() {
        // ----- 排序权重 -----
        const WEIGHTS = {
            "菠菜园.json": 1,
            "菠菜园pro.json": 2,
            "少儿频道.json": 3,
            "饭太硬.json": 4,
            "肥猫.json": 5,
            "摸鱼.json": 6,
            "王二小.json": 7,
            "集多.json": 8,
            "潇洒.json": 9,
        };

        // ----- 备用域名（三个搬运线路）-----
        const DOMAINS = [
            { tag: "一线", base: "https://0.12yue.de5.net/tvbox/" },
            { tag: "二线", base: "https://0.cdz.qzz.io/qzz/tvbox/" },
            { tag: "三线", base: "https://0.wdzb.eu.cc/tvbox/" },
        ];

        // ----- 工具函数 -----
        function decodeName(str) {
            try { return decodeURIComponent(str); } catch (_) { return str; }
        }

        function isRecent(dateStr) {
            if (!dateStr || dateStr.length !== 8) return false;
            const y = parseInt(dateStr.slice(0, 4), 10);
            const m = parseInt(dateStr.slice(4, 6), 10) - 1;
            const d = parseInt(dateStr.slice(6, 8), 10);
            const dt = new Date(y, m, d);
            return (Date.now() - dt.getTime()) / (1000 * 60 * 60 * 24) <= 2;
        }

        // ----- 渲染单个卡片 (严格四行结构) -----
        function renderCard(file, date, size, note) {
            const displayName = decodeName(file).replace(/\.json$/i, '');
            const isNew = isRecent(date);
            const metaDate = date || '----';
            const metaSize = size || '-';

            // 第一行：接口名称
            const nameHtml = `<div class="card-name" title="${displayName}">${displayName}</div>`;

            // 第二行：状态 + 日期 + 体积 (强制一行)
            const newClass = isNew ? 'badge-new' : 'badge-old';
            const newLabel = isNew ? '● 最近连通' : '● 历史';
            const noteHtml = note ? `<span class="note-tag">${note}</span>` : '';
            const metaHtml = `
                <div class="card-meta">
                    <span class="meta-item"><span class="${newClass}">${newLabel}</span></span>
                    <span class="meta-item">📅 ${metaDate}</span>
                    <span class="meta-item">📦 ${metaSize}</span>
                    ${noteHtml}
                </div>
            `;

            // 第三行及以后：每个URL独立一行
            let urlLinesHtml = '';
            DOMAINS.forEach(domain => {
                const rawFile = decodeName(file);
                const fullUrl = domain.base + rawFile;
                const encodedFile = encodeURIComponent(file);
                const hrefUrl = domain.base + encodedFile;

                urlLinesHtml += `
                    <div class="url-line">
                        <span class="url-tag">${domain.tag}</span>
                        <a class="url-text" href="${hrefUrl}" target="_blank" rel="noopener">${fullUrl}</a>
                        <button class="copy-btn" data-url="${fullUrl}">复制</button>
                    </div>
                `;
            });

            return `
                <div class="card-item" data-name="${displayName.toLowerCase()}">
                    ${nameHtml}
                    ${metaHtml}
                    <div class="card-urls">
                        ${urlLinesHtml}
                    </div>
                </div>
            `;
        }

        // ----- 加载 & 渲染 -----
        const container = document.getElementById('listContainer');

        function renderList(dataMap) {
            const entries = Object.entries(dataMap);
            if (!entries.length) {
                container.innerHTML = `<div class="empty">📭 暂无接口数据</div>`;
                return;
            }

            let items = entries.map(([file, info]) => ({
                file,
                date: info.date || '',
                size: info.size || '',
                note: info.note || '',
                weight: WEIGHTS[file] !== undefined ? WEIGHTS[file] : null,
            }));

            items.sort((a, b) => {
                if (a.weight !== null && b.weight !== null) return a.weight - b.weight;
                if (a.weight !== null) return -1;
                if (b.weight !== null) return 1;
                return Math.random() - 0.5;
            });

            let html = '<div class="card-list">';
            items.forEach(item => {
                html += renderCard(item.file, item.date, item.size, item.note);
            });
            html += '</div>';
            container.innerHTML = html;

            // 复制事件
            container.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const url = this.getAttribute('data-url');
                    if (!url) return;
                    navigator.clipboard.writeText(url).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制';
                        this.classList.add('copied');
                        setTimeout(() => {
                            this.textContent = orig;
                            this.classList.remove('copied');
                        }, 1500);
                    }).catch(() => {
                        const input = document.createElement('input');
                        input.value = url;
                        document.body.appendChild(input);
                        input.select();
                        document.execCommand('copy');
                        document.body.removeChild(input);
                        const orig = this.textContent;
                        this.textContent = '📋 已复制';
                        setTimeout(() => { this.textContent = orig; }, 1200);
                    });
                });
            });
        }

        // ----- 获取 list.txt -----
        function fetchData() {
            fetch('list.txt?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(text => {
                    const lines = text.trim().split('\n').filter(line => line.trim() !== '');
                    if (!lines.length) {
                        container.innerHTML = `<div class="empty">📭 list.txt 为空</div>`;
                        return;
                    }

                    const dataMap = {};
                    lines.forEach(line => {
                        const parts = line.split('|').map(s => s.trim());
                        if (parts.length < 3) return;
                        const file = parts[0];
                        const date = parts[1] || '';
                        const size = parts[2] || '';
                        const note = parts[3] || '';
                        if (file) {
                            dataMap[file] = { date, size, note };
                        }
                    });

                    if (!Object.keys(dataMap).length) {
                        container.innerHTML = `<div class="empty">⚠️ 未解析到有效数据</div>`;
                        return;
                    }
                    renderList(dataMap);
                })
                .catch(err => {
                    console.warn('加载失败:', err);
                    container.innerHTML = `<div class="empty">❌ 加载失败，请确认 list.txt 存在且格式正确</div>`;
                });
        }

        // ----- 搜索过滤 -----
        window.filterList = function() {
            const keyword = document.getElementById('search').value.toLowerCase().trim();
            const cards = container.querySelectorAll('.card-item');
            cards.forEach(card => {
                const name = card.getAttribute('data-name') || '';
                card.classList.toggle('hidden', !name.includes(keyword));
            });
        };

        fetchData();
    })();
</script>
</body>
</html>
