<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>海量接口搬运备份</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa; color: #1e293b; padding: 16px 12px;
        }
        .container { max-width: 820px; margin: 0 auto; }
        h1 { text-align: center; font-size: 1.3rem; font-weight: 600; margin: 4px 0 2px; color: #0b1e33; }
        .subtitle { text-align: center; font-size: 0.8rem; color: #8b9eb0; margin-bottom: 20px; border-bottom: 1px solid #e9edf2; padding-bottom: 12px; }
        .search-box {
            width: 100%; padding: 12px 16px; border: 1px solid #dce1e9; border-radius: 40px;
            font-size: 0.95rem; background: #fff; outline: none; transition: 0.2s; margin-bottom: 20px;
        }
        .search-box:focus { border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15); }
        .big-card { background: #ffffff; border-radius: 16px; padding: 16px 18px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f3f8; }
        .entry { padding: 16px 0; border-bottom: 1px solid #f0f4fa; }
        .entry:last-child { border-bottom: none; }
        .entry-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
        .entry-name { font-size: 1.05rem; font-weight: 600; color: #0b1e33; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
        .entry-note { flex: 1; min-width: 0; display: flex; justify-content: flex-end; }
        .note-tag { background: #e8f4ff; color: #2a6bb0; padding: 2px 12px; border-radius: 30px; font-size: 0.7rem; line-height: 1.5; display: inline-block; max-width: 100%; white-space: normal; word-break: break-all; vertical-align: middle; }
        .entry-meta { display: block; padding: 6px 0; border-top: 1px solid #f0f4fa; border-bottom: 1px solid #f0f4fa; margin-bottom: 10px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
        .entry-meta::-webkit-scrollbar { display: none; }
        .meta-item { display: inline-block; font-size: 0.78rem; color: #5a6f88; padding: 0 6px; margin-right: 12px; }
        .meta-item:last-child { margin-right: 0; }
        .badge-new { color: #1b9e5a; }
        .badge-old { color: #b88b3a; }
        .entry-urls { display: block; }
        .url-line { padding: 5px 12px 5px 10px; margin-bottom: 6px; background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
        .url-line:last-child { margin-bottom: 0; }
        .url-tag { font-size: 0.7rem; font-weight: 500; color: #4a6a8a; background: #e6edf6; padding: 0 12px; border-radius: 30px; line-height: 24px; white-space: nowrap; flex-shrink: 0; }
        .url-text { font-size: 0.82rem; color: #2563eb; word-break: break-all; overflow-wrap: break-word; white-space: normal; line-height: 1.5; flex: 1 1 0; min-width: 40px; }
        .copy-btn {
            flex-shrink: 0; background: #4a9eff; color: white; border: none; border-radius: 30px;
            padding: 0 14px; font-size: 0.7rem; font-weight: 500; cursor: pointer; height: 26px; line-height: 26px; transition: background 0.15s, transform 0.05s; white-space: nowrap; margin-left: auto;
        }
        .copy-btn:active { background: #2a7ed9; transform: scale(0.96); }
        .copy-btn.copied { background: #3b9b6c; }
        .loading, .empty { text-align: center; color: #9aadc2; padding: 48px 0; font-size: 0.9rem; background: #fff; border-radius: 24px; border: 1px dashed #dce3ed; }
        .entry.hidden { display: none; }
        @media (max-width: 600px) {
            body { padding: 12px 6px; }
            .big-card { padding: 12px 12px 10px; }
            .entry { padding: 12px 0; }
            .entry-header { gap: 6px; margin-bottom: 6px; }
            .entry-name { font-size: 0.95rem; }
            .entry-meta { font-size: 0.7rem; padding: 4px 0; margin-bottom: 8px; }
            .url-line { padding: 4px 8px; gap: 4px 6px; }
            .url-tag { font-size: 0.65rem; padding: 0 10px; line-height: 22px; }
            .url-text { font-size: 0.75rem; min-width: 30px; }
            .copy-btn { font-size: 0.65rem; padding: 0 10px; height: 24px; line-height: 24px; }
            .note-tag { font-size: 0.65rem; padding: 1px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 海量接口搬运备份</h1>
        <p class="subtitle">点击链接复制，粘贴到 TVBox 即可使用</p>
        <input class="search-box" id="search" type="text" placeholder="搜索接口名称..." oninput="filterList()">
        <div id="listContainer">
            <div class="loading">⏳ 正在加载接口列表...</div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 1. 在这里修改三个备份线路的域名 ====================
            const DOMAINS = [
                { tag: "备份一线", base: "https://0.12yue.de5.net/tvbox/" },
                { tag: "备份二线", base: "https://0.cdz.qzz.io/qzz/tvbox/" },
                { tag: "备份三线", base: "https://0.wdzb.eu.cc/tvbox/" },
            ];

            // ==================== 2. 在这里添加/修改你的内置数据 ====================
            // 格式：文件名|日期|大小|备注（备注可以是完整链接，也可以是文字说明）
            const BUILT_IN_DATA = `
菠菜pro.json|20260906|95.2K|https://0.12yue.de5.net/5/x4pro.json
菠菜园.json|20260906|50.1K|https://0.12yue.de5.net/5/x4.json
少儿频道.json|20260906|19.2K|https://0.12yue.de5.net/5/tv少儿.json
            `.trim();
            // =======================================================================

            const WEIGHTS = {
                "菠菜园.json": 1, "菠菜园pro.json": 2, "少儿频道.json": 3,
                "饭太硬.json": 4, "肥猫.json": 5, "摸鱼.json": 6,
                "王二小.json": 7, "集多.json": 8, "潇洒.json": 9,
            };

            function decodeName(str) { try { return decodeURIComponent(str); } catch (_) { return str; } }
            function isRecent(dateStr) {
                if (!dateStr || dateStr.length !== 8) return false;
                const y = parseInt(dateStr.slice(0, 4), 10);
                const m = parseInt(dateStr.slice(4, 6), 10) - 1;
                const d = parseInt(dateStr.slice(6, 8), 10);
                const dt = new Date(y, m, d);
                return (Date.now() - dt.getTime()) / (1000 * 60 * 60 * 24) <= 2;
            }

            function renderEntry(file, date, size, note) {
                const decodedFile = decodeName(file);
                const displayName = decodedFile.replace(/\.json$/i, '');
                const isNew = isRecent(date);
                const newClass = isNew ? 'badge-new' : 'badge-old';

                const headerHtml = `
                    <div class="entry-header">
                        <div class="entry-name" title="${displayName}">${displayName}</div>
                        ${note ? `<div class="entry-note"><span class="note-tag">${note}</span></div>` : ''}
                    </div>`;

                const metaHtml = `
                    <div class="entry-meta">
                        <span class="meta-item"><span class="${newClass}">${isNew ? '● 最近连通' : '● 历史'}</span></span>
                        <span class="meta-item">📅 ${date || '----'}</span>
                        <span class="meta-item">📦 ${size || '-'}</span>
                    </div>`;

                let urlLinesHtml = '';
                DOMAINS.forEach((domain, index) => {
                    // 如果备注是完整链接，且当前是“备份一线”，则使用备注的链接
                    let fullUrl = domain.base + decodedFile;
                    if (index === 0 && note && note.startsWith('http')) {
                        fullUrl = note;
                    }
                    urlLinesHtml += `
                        <div class="url-line">
                            <span class="url-tag">${domain.tag}</span>
                            <span class="url-text">${fullUrl}</span>
                            <button class="copy-btn" data-url="${fullUrl}">复制</button>
                        </div>`;
                });

                return `<div class="entry" data-name="${displayName.toLowerCase()}">${headerHtml}${metaHtml}<div class="entry-urls">${urlLinesHtml}</div></div>`;
            }

            const container = document.getElementById('listContainer');

            function renderList(dataMap) {
                const entries = Object.entries(dataMap);
                if (!entries.length) {
                    container.innerHTML = `<div class="empty">📭 暂无接口数据</div>`;
                    return;
                }

                let items = entries.map(([file, info]) => ({
                    file, date: info.date || '', size: info.size || '', note: info.note || '',
                    weight: WEIGHTS[file] !== undefined ? WEIGHTS[file] : null,
                }));

                items.sort((a, b) => {
                    if (a.weight !== null && b.weight !== null) return a.weight - b.weight;
                    if (a.weight !== null) return -1;
                    if (b.weight !== null) return 1;
                    return Math.random() - 0.5;
                });

                let entriesHtml = '';
                items.forEach(item => { entriesHtml += renderEntry(item.file, item.date, item.size, item.note); });
                container.innerHTML = `<div class="big-card">${entriesHtml}</div>`;

                container.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.getAttribute('data-url');
                        if (!url) return;
                        navigator.clipboard.writeText(url).then(() => {
                            const orig = this.textContent;
                            this.textContent = '✅ 已复制';
                            this.classList.add('copied');
                            setTimeout(() => { this.textContent = orig; this.classList.remove('copied'); }, 1500);
                        }).catch(() => {
                            const input = document.createElement('input');
                            input.value = url; document.body.appendChild(input); input.select();
                            document.execCommand('copy'); document.body.removeChild(input);
                            const orig = this.textContent;
                            this.textContent = '📋 已复制';
                            setTimeout(() => { this.textContent = orig; }, 1200);
                        });
                    });
                });
            }

            // ==================== 3. 数据加载逻辑 ====================
            function fetchData() {
                const dataMap = {};

                // 先解析内置数据
                if (BUILT_IN_DATA) {
                    BUILT_IN_DATA.split('\n').forEach(line => {
                        const parts = line.split('|').map(s => s.trim());
                        if (parts.length >= 3 && parts[0]) {
                            dataMap[parts[0]] = { date: parts[1] || '', size: parts[2] || '', note: parts[3] || '' };
                        }
                    });
                }

                // 立刻渲染内置数据（不用等 list.txt）
                renderList(dataMap);

                // 再尝试加载 list.txt 并合并（如果 list.txt 有同名文件会覆盖内置的）
                fetch('list.txt?t=' + Date.now())
                    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
                    .then(text => {
                        const lines = text.trim().split('\n').filter(line => line.trim() !== '');
                        lines.forEach(line => {
                            const parts = line.split('|').map(s => s.trim());
                            if (parts.length >= 3 && parts[0]) {
                                dataMap[parts[0]] = { date: parts[1] || '', size: parts[2] || '', note: parts[3] || '' };
                            }
                        });
                        renderList(dataMap); // 合并后重新渲染
                    })
                    .catch(err => {
                        console.warn('list.txt 加载失败，已显示内置数据:', err);
                    });
            }

            window.filterList = function() {
                const keyword = document.getElementById('search').value.toLowerCase().trim();
                container.querySelectorAll('.entry').forEach(entry => {
                    const name = entry.getAttribute('data-name') || '';
                    entry.classList.toggle('hidden', !name.includes(keyword));
                });
            };

            fetchData();
        })();
    </script>
</body>
</html>
