<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>海量接口搬运备份</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 16px 12px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 4px 0 2px;
            color: #0b1e33;
        }
        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #8b9eb0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dce1e9;
            border-radius: 40px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .search-box:focus {
            border-color: #4a9eff;
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
        }

        /* 大卡片 */
        .big-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #f0f3f8;
        }

        /* ---------- 每个条目 ---------- */
        .entry {
            padding: 16px 0;
            border-bottom: 1px solid #f0f4fa;
        }
        .entry:last-child {
            border-bottom: none;
        }

        /* 名称块 */
        .entry-name {
            display: block;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0b1e33;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        /* 元数据块（状态、日期、体积） */
        .entry-meta {
            display: block;
            padding: 6px 0;
            border-top: 1px solid #f0f4fa;
            border-bottom: 1px solid #f0f4fa;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .entry-meta::-webkit-scrollbar {
            display: none;
        }

        .meta-item {
            display: inline-block;
            font-size: 0.78rem;
            color: #5a6f88;
            padding: 0 6px;
            margin-right: 12px;
        }
        .meta-item:last-child {
            margin-right: 0;
        }

        .badge-new { color: #1b9e5a; }
        .badge-old { color: #b88b3a; }
        
        .note-tag {
            background: #e8f4ff;
            color: #2a6bb0;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            line-height: 22px;
            display: inline-block;
        }

        /* 新增：备注单独成行，解除 nowrap 限制 */
        .entry-note {
            padding: 4px 0 10px;
            word-break: break-all;
        }
        .entry-note .note-tag {
            white-space: normal;       /* 允许 URL 在标签内换行 */
            line-height: 1.6;
            padding: 2px 12px;
        }

        /* URL 块 */
        .entry-urls {
            display: block;
        }

        .url-line {
            padding: 5px 12px 5px 10px;
            margin-bottom: 6px;
            background: #f8fafc;
            border-radius: 40px;
            border: 1px solid #eef2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .url-line:last-child {
            margin-bottom: 0;
        }

        .url-tag {
            font-size: 0.7rem;
            font-weight: 500;
            color: #4a6a8a;
            background: #e6edf6;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 24px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .url-text {
            font-size: 0.82rem;
            color: #2563eb;
            word-break: break-all;
            overflow-wrap: break-word;
            white-space: normal;
            line-height: 1.5;
            flex: 1 1 0;
            min-width: 40px;
            text-decoration: none;
            border-bottom: 1px dotted transparent;
            transition: border-color 0.12s;
        }
        .url-text:hover {
            border-bottom-color: #2563eb;
        }

        .copy-btn {
            flex-shrink: 0;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0 14px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            height: 26px;
            line-height: 26px;
            transition: background 0.15s, transform 0.05s;
            white-space: nowrap;
            margin-left: auto;
        }
        .copy-btn:active {
            background: #2a7ed9;
            transform: scale(0.96);
        }
        .copy-btn.copied {
            background: #3b9b6c;
        }

        .loading, .empty {
            text-align: center;
            color: #9aadc2;
            padding: 48px 0;
            font-size: 0.9rem;
            background: #fff;
            border-radius: 24px;
            border: 1px dashed #dce3ed;
        }

        .entry.hidden {
            display: none;
        }

        /* 手机端微调 */
        @media (max-width: 600px) {
            body { padding: 12px 6px; }
            .big-card { padding: 12px 12px 10px; }
            .entry { padding: 12px 0; }
            .entry-name { font-size: 0.95rem; }
            .entry-meta { font-size: 0.7rem; padding: 4px 0; margin-bottom: 8px; }
            .url-line { padding: 4px 8px; gap: 4px 6px; }
            .url-tag { font-size: 0.65rem; padding: 0 10px; line-height: 22px; }
            .url-text { font-size: 0.75rem; min-width: 30px; }
            .copy-btn { font-size: 0.65rem; padding: 0 10px; height: 24px; line-height: 24px; }
            .note-tag { font-size: 0.65rem; line-height: 20px; padding: 0 8px; }
            .entry-note .note-tag { padding: 2px 8px; line-height: 1.5; }
        }

        @media (max-width: 420px) {
            .big-card { padding: 10px 8px 8px; }
            .entry { padding: 10px 0; }
            .entry-name { font-size: 0.88rem; }
            .entry-meta { font-size: 0.6rem; gap: 4px 10px; margin-bottom: 6px; }
            .url-line { padding: 3px 6px; gap: 3px 4px; }
            .url-tag { font-size: 0.55rem; padding: 0 8px; line-height: 20px; }
            .url-text { font-size: 0.7rem; min-width: 20px; }
            .copy-btn { font-size: 0.55rem; padding: 0 8px; height: 20px; line-height: 20px; }
            .note-tag { font-size: 0.55rem; line-height: 18px; padding: 0 6px; }
            .entry-note .note-tag { padding: 2px 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 海量接口搬运备份</h1>
        <p class="subtitle">点击链接复制，粘贴到 TVBox 即可使用</p>
        <input class="search-box" id="search" type="text" placeholder="搜索接口名称..." oninput="filterList()">
        <div id="listContainer">
            <div class="loading">⏳ 正在加载接口列表...</div>
        </div>
    </div>

    <script>
        (function() {
            const WEIGHTS = {
                "菠菜园.json": 1,
                "菠菜园pro.json": 2,
                "少儿频道.json": 3,
                "饭太硬.json": 4,
                "肥猫.json": 5,
                "摸鱼.json": 6,
                "王二小.json": 7,
                "集多.json": 8,
                "潇洒.json": 9,
            };

            const DOMAINS = [
                { tag: "一线", base: "https://0.12yue.de5.net/tvbox/" },
                { tag: "二线", base: "https://0.cdz.qzz.io/qzz/tvbox/" },
                { tag: "三线", base: "https://0.wdzb.eu.cc/tvbox/" },
            ];

            function decodeName(str) {
                try { return decodeURIComponent(str); } catch (_) { return str; }
            }

            function isRecent(dateStr) {
                if (!dateStr || dateStr.length !== 8) return false;
                const y = parseInt(dateStr.slice(0, 4), 10);
                const m = parseInt(dateStr.slice(4, 6), 10) - 1;
                const d = parseInt(dateStr.slice(6, 8), 10);
                const dt = new Date(y, m, d);
                return (Date.now() - dt.getTime()) / (1000 * 60 * 60 * 24) <= 2;
            }

            function renderEntry(file, date, size, note) {
                const decodedFile = decodeName(file);
                const displayName = decodedFile.replace(/\.json$/i, '');
                const isNew = isRecent(date);
                const metaDate = date || '----';
                const metaSize = size || '-';

                const nameHtml = `<div class="entry-name" title="${displayName}">${displayName}</div>`;

                // 1. 元数据行（已移除 note，确保状态、日期、体积在一行内）
                const newClass = isNew ? 'badge-new' : 'badge-old';
                const newLabel = isNew ? '● 最近连通' : '● 历史';
                const metaHtml = `
                    <div class="entry-meta">
                        <span class="meta-item"><span class="${newClass}">${newLabel}</span></span>
                        <span class="meta-item">📅 ${metaDate}</span>
                        <span class="meta-item">📦 ${metaSize}</span>
                    </div>
                `;

                // 2. 备注单独成行（不再受 meta 的 nowrap 限制）
                const noteHtml = note ? `<div class="entry-note"><span class="note-tag">${note}</span></div>` : '';

                let urlLinesHtml = '';
                DOMAINS.forEach(domain => {
                    const fullUrl = domain.base + decodedFile;
                    const hrefUrl = domain.base + encodeURIComponent(decodedFile);

                    urlLinesHtml += `
                        <div class="url-line">
                            <span class="url-tag">${domain.tag}</span>
                            <a class="url-text" href="${hrefUrl}" target="_blank" rel="noopener">${fullUrl}</a>
                            <button class="copy-btn" data-url="${fullUrl}">复制</button>
                        </div>
                    `;
                });

                // 3. 渲染顺序：名称 -> 元数据 -> 备注URL -> 线路URL
                return `
                    <div class="entry" data-name="${displayName.toLowerCase()}">
                        ${nameHtml}
                        ${metaHtml}
                        ${noteHtml}
                        <div class="entry-urls">
                            ${urlLinesHtml}
                        </div>
                    </div>
                `;
            }

            const container = document.getElementById('listContainer');

            function renderList(dataMap) {
                const entries = Object.entries(dataMap);
                if (!entries.length) {
                    container.innerHTML = `<div class="empty">📭 暂无接口数据</div>`;
                    return;
                }

                let items = entries.map(([file, info]) => ({
                    file,
                    date: info.date || '',
                    size: info.size || '',
                    note: info.note || '',
                    weight: WEIGHTS[file] !== undefined ? WEIGHTS[file] : null,
                }));

                items.sort((a, b) => {
                    if (a.weight !== null && b.weight !== null) return a.weight - b.weight;
                    if (a.weight !== null) return -1;
                    if (b.weight !== null) return 1;
                    return Math.random() - 0.5;
                });

                let entriesHtml = '';
                items.forEach(item => {
                    entriesHtml += renderEntry(item.file, item.date, item.size, item.note);
                });

                container.innerHTML = `<div class="big-card">${entriesHtml}</div>`;

                container.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.getAttribute('data-url');
                        if (!url) return;
                        navigator.clipboard.writeText(url).then(() => {
                            const orig = this.textContent;
                            this.textContent = '✅ 已复制';
                            this.classList.add('copied');
                            setTimeout(() => {
                                this.textContent = orig;
                                this.classList.remove('copied');
                            }, 1500);
                        }).catch(() => {
                            const input = document.createElement('input');
                            input.value = url;
                            document.body.appendChild(input);
                            input.select();
                            document.execCommand('copy');
                            document.body.removeChild(input);
                            const orig = this.textContent;
                            this.textContent = '📋 已复制';
                            setTimeout(() => { this.textContent = orig; }, 1200);
                        });
                    });
                });
            }

            function fetchData() {
                fetch('list.txt?t=' + Date.now())
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.text();
                    })
                    .then(text => {
                        const lines = text.trim().split('\n').filter(line => line.trim() !== '');
                        if (!lines.length) {
                            container.innerHTML = `<div class="empty">📭 list.txt 为空</div>`;
                            return;
                        }

                        const dataMap = {};
                        lines.forEach(line => {
                            const parts = line.split('|').map(s => s.trim());
                            if (parts.length < 3) return;
                            const file = parts[0];
                            const date = parts[1] || '';
                            const size = parts[2] || '';
                            const note = parts[3] || '';
                            if (file) {
                                dataMap[file] = { date, size, note };
                            }
                        });

                        if (!Object.keys(dataMap).length) {
                            container.innerHTML = `<div class="empty">⚠️ 未解析到有效数据</div>`;
                            return;
                        }
                        renderList(dataMap);
                    })
                    .catch(err => {
                        console.warn('加载失败:', err);
                        container.innerHTML = `<div class="empty">❌ 加载失败，请确认 list.txt 存在且格式正确</div>`;
                    });
            }

            window.filterList = function() {
                const keyword = document.getElementById('search').value.toLowerCase().trim();
                const entries = container.querySelectorAll('.entry');
                entries.forEach(entry => {
                    const name = entry.getAttribute('data-name') || '';
                    entry.classList.toggle('hidden', !name.includes(keyword));
                });
            };

            fetchData();
        })();
    </script>
</body>
</html>
