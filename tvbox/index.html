<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>海量接口搬运备份</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #1e293b;
      padding: 16px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      margin: 4px 0 2px;
      letter-spacing: 0.3px;
      color: #0b1e33;
    }
    .subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #8b9eb0;
      margin-bottom: 20px;
      border-bottom: 1px solid #e9edf2;
      padding-bottom: 12px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dce1e9;
      border-radius: 40px;
      font-size: 0.95rem;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .search-box:focus {
      border-color: #4a9eff;
      box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.15);
    }
    /* ----- 卡片列表 ----- */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #f0f3f8;
      transition: box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .card-item:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    /* ----- 第一行：接口名称 (单行省略) ----- */
    .card-name-row {
      display: flex;
      align-items: center;
      padding-bottom: 2px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .card-name {
      font-size: 0.98rem;
      font-weight: 600;
      color: #0b1e33;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      line-height: 1.5;
      max-width: 100%;
      width: 100%;
    }

    /* ----- 第二行：元数据 (状态/日期/体积) 强制一行显示 ----- */
    .card-meta-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px 16px;
      font-size: 0.72rem;
      color: #5a6f88;
      padding: 4px 0 4px;
      border-top: 1px solid #f0f4fa;
      border-bottom: 1px solid #f0f4fa;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-new {
      color: #1b9e5a;
    }
    .badge-old {
      color: #b88b3a;
    }
    .note-tag {
      background: #e8f4ff;
      color: #2a6bb0;
      padding: 0 12px;
      border-radius: 30px;
      font-size: 0.65rem;
      line-height: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ----- 第三行：URL 区域 (强制显示两行) ----- */
    .card-urls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .url-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 6px;
      background: #f8fafc;
      padding: 5px 10px 5px 8px;
      border-radius: 30px;
      border: 1px solid #eef2f7;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      /* 强制每个URL行占两行的高度 */
      min-height: 52px;
      height: auto;
    }
    /* 让URL文本强制换行显示为两行 */
    .url-text-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      flex: 1 1 0;
      min-width: 30px;
      max-width: 100%;
      gap: 2px;
    }
    .url-tag {
      font-size: 0.65rem;
      font-weight: 500;
      color: #4a6a8a;
      background: #e6edf6;
      padding: 0 10px;
      border-radius: 30px;
      line-height: 22px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }
    .url-text {
      font-size: 0.8rem;
      color: #2563eb;
      word-break: break-all;
      overflow-wrap: break-word;
      white-space: normal;
      line-height: 1.5;
      flex: 1 1 0;
      min-width: 30px;
      max-width: 100%;
      text-decoration: none;
      border-bottom: 1px dotted transparent;
      transition: border-color 0.12s;
      display: inline;
      /* 强制显示为两行：限制行数 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .url-text:hover {
      border-bottom-color: #2563eb;
    }
    .copy-btn {
      flex-shrink: 0;
      background: #4a9eff;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      height: 24px;
      line-height: 24px;
      transition: background 0.15s, transform 0.05s;
      white-space: nowrap;
      letter-spacing: 0.2px;
      margin-left: auto;
    }
    .copy-btn:active {
      background: #2a7ed9;
      transform: scale(0.96);
    }
    .copy-btn.copied {
      background: #3b9b6c;
    }

    /* 辅助 */
    .loading, .empty {
      text-align: center;
      color: #9aadc2;
      padding: 48px 0;
      font-size: 0.9rem;
      background: #ffffff;
      border-radius: 24px;
      border: 1px dashed #dce3ed;
    }
    .card-item.hidden {
      display: none;
    }

    /* ----- 手机端优化 ----- */
    @media (max-width: 600px) {
      body { padding: 12px 6px; }
      .card-item { 
        padding: 12px 10px 10px; 
        gap: 5px;
        max-width: 100%;
        overflow: hidden;
      }
      .card-name {
        font-size: 0.92rem;
      }
      .card-meta-row {
        font-size: 0.65rem;
        gap: 4px 10px;
        padding: 3px 0;
        flex-wrap: nowrap;
        white-space: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .card-meta-row::-webkit-scrollbar {
        display: none;
      }
      .meta-badge {
        flex-shrink: 0;
      }
      .note-tag {
        font-size: 0.6rem;
        line-height: 18px;
        padding: 0 8px;
        flex-shrink: 0;
      }
      .url-line {
        padding: 4px 6px 4px 6px;
        gap: 3px 4px;
        border-radius: 24px;
        min-height: 48px;
      }
      .url-tag {
        font-size: 0.6rem;
        padding: 0 8px;
        line-height: 20px;
        flex-shrink: 0;
      }
      .url-text {
        font-size: 0.74rem;
        min-width: 20px;
        flex: 1 1 0;
        max-width: calc(100% - 80px);
        -webkit-line-clamp: 2;
      }
      .copy-btn {
        font-size: 0.6rem;
        padding: 0 10px;
        height: 22px;
        line-height: 22px;
        flex-shrink: 0;
      }
    }
    @media (max-width: 420px) {
      .card-item { 
        padding: 10px 6px 8px; 
        gap: 4px;
      }
      .card-name {
        font-size: 0.86rem;
      }
      .card-meta-row {
        font-size: 0.6rem;
        gap: 2px 8px;
        padding: 2px 0;
      }
      .url-line {
        padding: 3px 4px 3px 4px;
        gap: 2px 3px;
        border-radius: 20px;
        min-height: 44px;
      }
      .url-tag {
        font-size: 0.55rem;
        padding: 0 6px;
        line-height: 18px;
      }
      .url-text {
        font-size: 0.7rem;
        min-width: 15px;
        flex: 1 1 0;
        max-width: calc(100% - 70px);
        -webkit-line-clamp: 2;
      }
      .copy-btn {
        font-size: 0.55rem;
        padding: 0 8px;
        height: 20px;
        line-height: 20px;
      }
      .note-tag {
        font-size: 0.55rem;
        line-height: 16px;
        padding: 0 6px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 海量接口搬运备份</h1>
  <p class="subtitle">点击链接复制，粘贴到 TVBox 即可使用</p>
  <input class="search-box" id="search" type="text" placeholder="搜索接口名称..." oninput="filterList()">

  <div id="listContainer">
    <div class="loading">⏳ 正在加载接口列表...</div>
  </div>
</div>

<script>
  (function() {
    // ----- 排序权重 (数字小优先) -----
    const WEIGHTS = {
      "菠菜园.json": 1,
      "菠菜园pro.json": 2,
      "少儿频道.json": 3,
      "饭太硬.json": 4,
      "肥猫.json": 5,
      "摸鱼.json": 6,
      "王二小.json": 7,
      "集多.json": 8,
      "潇洒.json": 9,
    };

    // ----- 备用域名（三个搬运线路）-----
    const DOMAINS = [
      { tag: "一线", base: "https://0.12yue.de5.net/tvbox/" },
      { tag: "二线", base: "https://0.cdz.qzz.io/qzz/tvbox/" },
      { tag: "三线", base: "https://0.wdzb.eu.cc/tvbox/" },
    ];

    // ----- 工具函数 -----
    function decodeName(str) {
      try { return decodeURIComponent(str); } catch (_) { return str; }
    }

    function isRecent(dateStr) {
      if (!dateStr || dateStr.length !== 8) return false;
      const y = parseInt(dateStr.slice(0, 4), 10);
      const m = parseInt(dateStr.slice(4, 6), 10) - 1;
      const d = parseInt(dateStr.slice(6, 8), 10);
      const dt = new Date(y, m, d);
      return (Date.now() - dt.getTime()) / (1000 * 60 * 60 * 24) <= 2;
    }

    // ----- 渲染单个卡片 -----
    function renderCard(file, date, size, note) {
      const displayName = decodeName(file).replace(/\.json$/i, '');
      const isNew = isRecent(date);
      const metaDate = date || '----';
      const metaSize = size || '-';

      // 第一行：接口名称
      const nameHtml = `
        <div class="card-name-row">
          <span class="card-name" title="${displayName}">${displayName}</span>
        </div>
      `;

      // 第二行：元数据 (强制一行)
      const newClass = isNew ? 'badge-new' : 'badge-old';
      const newLabel = isNew ? '● 最近连通' : '● 历史';
      const noteHtml = note ? `<span class="note-tag">${note}</span>` : '';
      const metaHtml = `
        <div class="card-meta-row">
          <span class="meta-badge"><span class="${newClass}">${newLabel}</span></span>
          <span class="meta-badge">📅 ${metaDate}</span>
          <span class="meta-badge">📦 ${metaSize}</span>
          ${noteHtml}
        </div>
      `;

      // 第三行：URL 列表 (强制每个URL显示两行)
      let urlLinesHtml = '';
      DOMAINS.forEach(domain => {
        const rawFile = decodeName(file);
        const fullUrl = domain.base + rawFile;
        const encodedFile = encodeURIComponent(file);
        const hrefUrl = domain.base + encodedFile;

        urlLinesHtml += `
          <div class="url-line">
            <span class="url-tag">${domain.tag}</span>
            <span class="url-text-wrapper">
              <a class="url-text" href="${hrefUrl}" target="_blank" rel="noopener">${fullUrl}</a>
            </span>
            <button class="copy-btn" data-url="${fullUrl}">复制</button>
          </div>
        `;
      });

      return `
        <div class="card-item" data-name="${displayName.toLowerCase()}">
          ${nameHtml}
          ${metaHtml}
          <div class="card-urls">
            ${urlLinesHtml}
          </div>
        </div>
      `;
    }

    // ----- 加载 & 渲染 -----
    const container = document.getElementById('listContainer');

    function renderList(dataMap) {
      const entries = Object.entries(dataMap);
      if (!entries.length) {
        container.innerHTML = `<div class="empty">📭 暂无接口数据</div>`;
        return;
      }

      let items = entries.map(([file, info]) => ({
        file,
        date: info.date || '',
        size: info.size || '',
        note: info.note || '',
        weight: WEIGHTS[file] !== undefined ? WEIGHTS[file] : null,
      }));

      items.sort((a, b) => {
        if (a.weight !== null && b.weight !== null) return a.weight - b.weight;
        if (a.weight !== null) return -1;
        if (b.weight !== null) return 1;
        return Math.random() - 0.5;
      });

      let html = '<div class="card-list">';
      items.forEach(item => {
        html += renderCard(item.file, item.date, item.size, item.note);
      });
      html += '</div>';
      container.innerHTML = html;

      // 复制事件委托
      container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const url = this.getAttribute('data-url');
          if (!url) return;
          navigator.clipboard.writeText(url).then(() => {
            const orig = this.textContent;
            this.textContent = '✅ 已复制';
            this.classList.add('copied');
            setTimeout(() => {
              this.textContent = orig;
              this.classList.remove('copied');
            }, 1500);
          }).catch(() => {
            const input = document.createElement('input');
            input.value = url;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            const orig = this.textContent;
            this.textContent = '📋 已复制';
            setTimeout(() => { this.textContent = orig; }, 1200);
          });
        });
      });
    }

    // ----- 获取 list.txt -----
    function fetchData() {
      fetch('list.txt?t=' + Date.now())
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(text => {
          const lines = text.trim().split('\n').filter(line => line.trim() !== '');
          if (!lines.length) {
            container.innerHTML = `<div class="empty">📭 list.txt 为空</div>`;
            return;
          }

          const dataMap = {};
          lines.forEach(line => {
            const parts = line.split('|').map(s => s.trim());
            if (parts.length < 3) return;
            const file = parts[0];
            const date = parts[1] || '';
            const size = parts[2] || '';
            const note = parts[3] || '';
            if (file) {
              dataMap[file] = { date, size, note };
            }
          });

          if (!Object.keys(dataMap).length) {
            container.innerHTML = `<div class="empty">⚠️ 未解析到有效数据</div>`;
            return;
          }
          renderList(dataMap);
        })
        .catch(err => {
          console.warn('加载失败:', err);
          container.innerHTML = `<div class="empty">❌ 加载失败，请确认 list.txt 存在且格式正确</div>`;
        });
    }

    // ----- 搜索过滤 -----
    window.filterList = function() {
      const keyword = document.getElementById('search').value.toLowerCase().trim();
      const cards = container.querySelectorAll('.card-item');
      cards.forEach(card => {
        const name = card.getAttribute('data-name') || '';
        card.classList.toggle('hidden', !name.includes(keyword));
      });
    };

    fetchData();
  })();
</script>
</body>
</html>
