<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配置说明</title>
    <style>
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
        }
        h1 {
            color: #e94560;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 18px;
            padding: 14px;
            background: #0f3460;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .section:active {
            background: #1a5276;
        }
        .label {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .content {
            color: #ccc;
            word-break: break-all;
        }
        .copy-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #27ae60;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 配置说明</h1>

    <div class="section" onclick="copyText('http://example.com/api')">
        <div class="label">🔗 接口地址</div>
        <div class="content">http://example.com/api</div>
        <button class="copy-btn">点击复制</button>
    </div>

    <div class="section" onclick="copyText('http://example.com/sub')">
        <div class="label">📡 订阅链接</div>
        <div class="content">http://example.com/sub</div>
        <button class="copy-btn">点击复制</button>
    </div>

    <div class="section">
        <div class="label">🕐 更新时间</div>
        <div class="content">每天凌晨4点自动更新</div>
    </div>

    <div class="section">
        <div class="label">⚠️ 注意事项</div>
        <div class="content">请勿用于商业用途<br>仅供学习交流使用</div>
    </div>

    <div class="section" onclick="copyText('https://github.com/your-repo')">
        <div class="label">💬 反馈渠道</div>
        <div class="content">GitHub Issues</div>
        <button class="copy-btn">点击复制</button>
    </div>
</div>

<div id="toast" class="toast">✅ 已复制到剪贴板</div>

<script>
function copyText(text) {
    // 兼容 iOS/Android 的复制方式
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    
    try {
        document.execCommand('copy');
        showToast();
    } catch (err) {
        // 备用方式：Clipboard API
        navigator.clipboard.writeText(text).then(showToast).catch(() => {});
    }
    
    document.body.removeChild(textarea);
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 2000);
}
</script>

</body>
</html>
