<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播页 HTML 测试</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fa; color: #1e293b;
        padding: 16px 12px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1.1rem; text-align: center; margin-bottom: 12px; color: #0b1e33; }
    .subtitle { font-size: 0.75rem; color: #8b9eb0; text-align: center; margin-bottom: 16px; }

    /* ============ 复用点播页同名类 ============ */
    .api-list { padding: 0; border: none; background: transparent; }
    .entry { padding: 16px 0; border-bottom: 1px solid #f0f4fa; }
    .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .entry-name { font-size: 1.05rem; font-weight: 600; color: #0b1e33; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
    .entry-name::before { content: none; } /* ✅ 去掉红色三角，纯文字 */
    .entry-meta-inline { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }
    .badge-new { color: #1b9e5a; } .badge-old { color: #b88b3a; }
    .entry-urls { display: block; }
    .url-line { padding: 5px 12px 5px 10px; margin-bottom: 6px; background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .url-tag { font-size: 0.7rem; font-weight: 500; color: #4a6a8a; background: #e6edf6; padding: 0 12px; border-radius: 30px; line-height: 24px; white-space: nowrap; flex-shrink: 0; }
    .url-text { font-size: 0.82rem; color: #2563eb; word-break: break-all; flex: 1 1 0; min-width: 40px; }
    .copy-btn { flex-shrink: 0; background: #4a9eff; color: white; border: none; border-radius: 30px; padding: 0 14px; font-size: 0.7rem; height: 26px; line-height: 26px; cursor: pointer; margin-left: auto; }

    /* ============ 一区：整个直播条目（稍深浅色调） ============ */
    .live-entry {
        background: #eef2f7;      /* ✅ 一区：稍深浅灰蓝 */
        border: 1px solid #dce6f0;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
    }

    /* ============ 二区：来源+UA+原始线路（淡灰，从一区移来） ============ */
    .live-block {
        background: #f8fafc;      /* ✅ 二区：淡灰 */
        border: 1px solid #e3eaf3;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 6px;
    }
    .live-meta {
        display: flex; flex-wrap: wrap; align-items: baseline;
        gap: 4px 12px;
        line-height: 24px;
        margin-bottom: 8px;
    }
    .meta-source { font-size: 0.82rem; font-weight: 400; color: #5a6f88; background: none; padding: 0; } /* ✅ 来源：纯文本，无背景 */
    .meta-ua, .meta-ua-null { font-size: 0.82rem; color: #5a6f88; font-style: normal; font-weight: 400; }
    .meta-ua-prefix { font-size: 0.7rem; color: #4a6a8a; }

    .live-block .url-line { background: #fff; margin-bottom: 0; } /* 原始线路嵌在 block 内，白色层次 */

    /* ============ 聚合头部 ============ */
    .live-top-aggregate { background: linear-gradient(135deg, #4a9eff, #1e6fda); border-radius: 12px; padding: 14px; margin-bottom: 16px; color: #fff; }
    .live-top-aggregate h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
    .live-top-aggregate .domain-line { background: rgba(255,255,255,0.15); border-radius: 40px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; }
    .live-top-aggregate .domain-line span { flex: 1; font-size: 0.72rem; word-break: break-all; }
    .live-top-aggregate .copy-btn { margin-left: 8px; background: rgba(255,255,255,0.9); color: #1e6fda; }

    .legend { font-size: 0.72rem; color: #8b9eb0; margin: 4px 0 16px; padding: 10px 12px; background: #fff; border-radius: 10px; line-height: 1.8; }
    .legend b { color: #4a6a8a; }
</style>
</head>
<body>
<div class="container">
    <h1>直播页 · HTML 完整测试</h1>
    <p class="subtitle">内嵌 mock 数据，验证一区/二区背景色与来源/UA/原始线路结构</p>

    <div class="legend">
        <b>图例：</b><br>
        ▍一区 .live-entry → <span style="color:#eef2f7;background:#999;">&nbsp;#eef2f7&nbsp;</span> 稍深浅灰蓝（整条卡片）<br>
        ▍二区 .live-block → <span style="color:#f8fafc;background:#999;">&nbsp;#f8fafc&nbsp;</span> 淡灰（来源+UA+原始线路）<br>
        ▍来源 = 纯文本（无背景）｜UA 有值/无值 同款样式
    </div>

    <!-- 聚合头部 -->
    <div class="live-top-aggregate">
        <h3>📡 海量直播聚合多线路专用接口</h3>
        <div class="domain-line">
            <span>https://0.12yue.de5.net/tvbox/海量直播线路.json</span>
            <button class="copy-btn">复制</button>
        </div>
    </div>

    <!-- 直播列表容器（JS 渲染） -->
    <div class="api-list" id="liveContainer"></div>
</div>

<script>
    // ============ Mock livelist 数据（模拟真实 6 字段解析） ============
    // 字段：名称|日期|大小|URL|来源|UA
    const mockText = `
综合直播.m3u|20260911|41.9K|http://193.123.86.190:25461/iptv.php|王二小二线|bingcha/1.1 (mianfeifenxiang)
Ipv4.txt|20260911|216B|http://example.com/ipv4.txt|测试来源|
Kimentanm1线|20260910|8.4K|| |Mozilla/5.0
驸马影视·电信专线|20260908|31.4K|http://fmys.top/fmys.json| |
无后缀名称|20260909|5.0K|http://example.com/noext|某来源|some/ua 1.0
`.trim();

    const LIVE_DOMAINS = [
        { tag: "备份一线", base: "https://0.12yue.de5.net/tvbox/live/" },
        { tag: "备份二线", base: "https://0.cdz.qzz.io/tvbox/live/" },
        { tag: "备份三线", base: "https://0.wdzb.eu.cc/tvbox/live/" }
    ];

    function formatDateToChinese(d) { return d ? `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日` : '----'; }
    function isRecent(d) { if (!d || d.length !== 8) return false; const y=+d.slice(0,4),m=+d.slice(4,6)-1,day=+d.slice(6,8); return (Date.now()-new Date(y,m,day).getTime())/86400000 <= 2; }

    // ============ 渲染逻辑（与 index.html 的 renderLive 完全一致） ============
    function renderLive() {
        const container = document.getElementById('liveContainer');
        const lines = mockText.split('\n').filter(l => l.trim());
        let html = '';

        lines.forEach(line => {
            const parts = line.split('|').map(s => s.trim());
            const fileName  = parts[0] || '';
            const date      = parts[1] || '';
            const size      = parts[2] || '';
            const rawUrl    = parts[3] || '';
            const source    = parts[4] || '';
            const ua        = parts[5] || '';

            const displayName = fileName.replace(/\.[^.]+$/i, ''); // 去后缀（仅用于标题/搜索）
            const cls = isRecent(date) ? 'badge-new' : 'badge-old';

            // ✅ 来源 + UA（同行，来源无背景，UA 有值/无值同款样式）
            let metaHtml = '';
            if (source || ua) {
                const uaPart = ua ? `<span class="meta-ua">ua: ${ua}</span>` : `<span class="meta-ua-null">ua: null</span>`;
                metaHtml = `<div class="live-meta"><span class="meta-source">${source}</span>&nbsp;&nbsp;&nbsp;&nbsp;${uaPart}</div>`;
            }

            // ✅ 原始线路
            let origHtml = '';
            if (rawUrl) {
                origHtml = `<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${rawUrl}</span><button class="copy-btn">复制</button></div>`;
            }

            // ✅ 备份线路：URL 保留完整 fileName（含原始后缀）
            const backupHtml = LIVE_DOMAINS.map(d => {
                const url = d.base + fileName; // ✅ 保留后缀，如 综合直播.m3u
                return `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${url}</span><button class="copy-btn">复制</button></div>`;
            }).join('');

            html += `<div class="entry live-entry" data-name="${displayName.toLowerCase()}">
                <div class="entry-header">
                    <div class="entry-name" title="${displayName}">${displayName}</div>
                    <div class="entry-meta-inline">
                        <span class="${cls}">备份时间 ${formatDateToChinese(date)}</span>
                        ${size ? `<span>${size}</span>` : ''}
                    </div>
                </div>
                ${metaHtml ? `<div class="live-block">${metaHtml}${origHtml}</div>` : ''}
                ${origHtml && !metaHtml ? `<div class="live-block">${origHtml}</div>` : ''}
                ${backupHtml}
            </div>`;
        });

        container.innerHTML = html;
    }

    renderLive();
</script>
</body>
</html>
