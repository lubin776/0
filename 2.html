<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>颜色对比预览</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef2f7;
    color: #1a2b3d;
    padding: 24px 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.1rem;
    text-align: center;
    margin-bottom: 20px;
    color: #0a1a2b;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 1px solid #d4dbe5;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .swatch {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .info {
    flex: 1;
  }
  .name {
    font-size: .82rem;
    font-weight: 600;
    color: #0b1e33;
    margin-bottom: 4px;
  }
  .code {
    font-size: .72rem;
    color: #8fa3b8;
    font-family: monospace;
    margin-bottom: 6px;
  }
  .preview {
    font-size: .84rem;
    color: #2563eb;
  }
  .preview span {
    font-weight: 600;
  }
</style>
</head>
<body>

  <h1>颜色对比预览</h1>

  <div class="item">
    <div class="swatch" style="background:#FF4500;"></div>
    <div class="info">
      <div class="name">橙红（推荐）</div>
      <div class="code">#FF4500</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#FF4500;">点击</span></div>
    </div>
  </div>

  <div class="item">
    <div class="swatch" style="background:#FF8C00;"></div>
    <div class="info">
      <div class="name">亮橙</div>
      <div class="code">#FF8C00</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#FF8C00;">点击</span></div>
    </div>
  </div>

  <div class="item">
    <div class="swatch" style="background:#E91E63;"></div>
    <div class="info">
      <div class="name">玫红</div>
      <div class="code">#E91E63</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#E91E63;">点击</span></div>
    </div>
  </div>

  <div class="item">
    <div class="swatch" style="background:#FF0000;"></div>
    <div class="info">
      <div class="name">鲜红</div>
      <div class="code">#FF0000</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#FF0000;">点击</span></div>
    </div>
  </div>

  <div class="item">
    <div class="swatch" style="background:#00C853;"></div>
    <div class="info">
      <div class="name">翠绿</div>
      <div class="code">#00C853</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#00C853;">点击</span></div>
    </div>
  </div>

  <div class="item">
    <div class="swatch" style="background:#FFD700;"></div>
    <div class="info">
      <div class="name">金色（原方案）</div>
      <div class="code">#FFD700</div>
      <div class="preview">猛戳这里加入QQ群: <span style="color:#FFD700;">点击</span></div>
    </div>
  </div>

</body>
</html>
