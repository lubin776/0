<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVBox 全能一体化工具 · CF 版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f14;--bg2:#111820;--bg3:#161f2a;--line:#22303f;
  --fg:#c8d6e5;--fg2:#7b8fa6;--acc:#3ddc97;--acc2:#3b82f6;
  --warn:#f5a524;--err:#f45b69;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--fg);min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,#132030 0%,transparent 45%),
                   radial-gradient(circle at 85% 100%,#0f1d18 0%,transparent 45%);
}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
header{padding:18px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
h1{font-size:22px;font-weight:600;letter-spacing:.5px}
h1 .ver{font-size:12px;color:var(--acc);border:1px solid var(--acc);
  padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;font-weight:400}
.sub{color:var(--fg2);font-size:13px;margin-top:6px}
.grid{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.panel h2 small{text-transform:none;letter-spacing:0;font-weight:400;color:#556b82}
.panel+.panel{margin-top:14px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;
  padding:9px 11px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  transition:.15s;user-select:none}
.sw label:hover{border-color:#2e4459}
.sw label.on{border-color:var(--acc);background:#0e2a20;color:var(--acc)}
.sw input{accent-color:var(--acc);cursor:pointer}
textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  color:var(--fg);padding:9px 11px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;
  outline:none;transition:.15s;resize:vertical}
textarea:focus,input:focus{border-color:var(--acc2)}
textarea::placeholder{color:#44586c}
.row{display:flex;gap:10px;margin-top:10px}
.row>div{flex:1}
.row label{display:block;font-size:11px;color:var(--fg2);margin-bottom:4px}
.btn{
  width:100%;padding:13px;border:none;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:600;letter-spacing:.5px;
  background:linear-gradient(135deg,#3ddc97,#25a97a);color:#04140e;
  transition:.2s;margin-top:16px
}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sec{background:var(--bg3);color:var(--fg);border:1px solid var(--line);margin-top:10px}
.btn.sec:hover{border-color:var(--acc2);color:var(--acc2)}
#log{
  height:360px;overflow-y:auto;background:#080c11;border:1px solid var(--line);
  border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-all
}
#log::-webkit-scrollbar{width:8px}
#log::-webkit-scrollbar-thumb{background:#22303f;border-radius:4px}
.l-ok{color:var(--acc)}
.l-err{color:var(--err)}
.l-warn{color:var(--warn)}
.l-dim{color:#556b82}
.l-head{color:var(--acc2);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--acc);font-weight:600}
.stat span{font-size:11px;color:var(--fg2)}
#files{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.fitem{display:flex;justify-content:space-between;padding:7px 12px;font-size:12px;
  font-family:ui-monospace,monospace;border-bottom:1px solid #18222e}
.fitem:last-child{border-bottom:none}
.fitem:hover{background:#131c26}
.fitem .p{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .s{color:var(--fg2);margin-left:12px;flex-shrink:0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;
  background:#1a2b3d;color:var(--acc2);margin-left:8px}
.hint{font-size:11.5px;color:var(--fg2);line-height:1.6;margin-top:6px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #2a3c50;
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TVBox 全能一体化工具<span class="ver">CF v9.3</span></h1>
    <div class="sub">抓取远程 API · 扫描聚合 lives/sites · RY 本地包 · 全量本地化 · 一键打包下载</div>
  </header>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>任务开关</h2>
        <div class="sw" id="switches">
          <label class="on"><input type="checkbox" id="tA" checked>A · 抓取远程 API</label>
          <label><input type="checkbox" id="tB">B · 扫描聚合</label>
          <label><input type="checkbox" id="tC">C · RY 下载</label>
          <label class="on"><input type="checkbox" id="tD" checked>D · 全量本地化</label>
        </div>
      </div>

      <div class="panel">
        <h2>接口列表 <small>名称|url1|url2</small></h2>
        <textarea id="apiList" rows="8" placeholder="饭太硬|http://www.饭太硬.net/tv
小苹果|https://example.com/api.json|https://mirror.example.com/api.json"></textarea>
        <div class="hint">同名行会自动合并为多源容灾。支持 <b>#</b> 开头注释。</div>
      </div>

      <div class="panel">
        <h2>RY 链接 <small>可选</small></h2>
        <textarea id="ryLinks" rows="4" placeholder="名称,https://xxx/ry.json&#10;https://yyy/ry2.json"></textarea>
      </div>

      <div class="panel">
        <h2>高级选项</h2>
        <div class="row">
          <div>
            <label>请求超时 (秒)</label>
            <input type="number" id="timeout" value="12" min="3" max="60">
          </div>
          <div>
            <label>旧 list.txt</label>
            <input type="text" id="oldList" placeholder="留空则忽略">
          </div>
        </div>
        <div class="row">
          <div>
            <label>本地化目录名</label>
            <input type="text" id="locDir" value="localize">
          </div>
          <div>
            <label>调试日志</label>
            <select id="debug"><option value="0">关闭</option><option value="1">开启</option></select>
          </div>
        </div>
      </div>

      <button class="btn" id="runBtn">▶ 开始执行</button>
      <button class="btn sec" id="zipBtn" disabled>⬇ 下载 ZIP 打包</button>
    </div>

    <div>
      <div class="panel">
        <h2>运行日志 <small id="status">待命中</small></h2>
        <div id="log"><span class="l-dim">等待开始...</span></div>
      </div>

      <div class="panel">
        <h2>输出文件 <small><span id="fcount">0</span> 个</small></h2>
        <div class="stats">
          <div class="stat"><b id="sFiles">0</b><span>文件</span></div>
          <div class="stat"><b id="sSize">0</b><span>体积</span></div>
          <div class="stat"><b id="sApi">0</b><span>接口</span></div>
          <div class="stat"><b id="sFail">0</b><span>失败</span></div>
        </div>
        <div id="files"><div class="fitem"><span class="p l-dim">暂无输出</span></div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var collected = [];      // {path, data:Uint8Array}
  var running = false;
  var stats = {files:0, size:0, api:0, fail:0};

  // ---- 开关高亮 ----
  document.querySelectorAll('.sw label').forEach(function(l){
    var cb = l.querySelector('input');
    var sync = function(){ l.classList.toggle('on', cb.checked); };
    cb.addEventListener('change', sync); sync();
  });

  // ---- 日志 ----
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function colorize(line){
    if (/✓|成功|完成/.test(line)) return '<span class="l-ok">'+esc(line)+'</span>';
    if (/✗|失败|异常|错误/.test(line)) return '<span class="l-err">'+esc(line)+'</span>';
    if (/⚠|跳过|超时/.test(line)) return '<span class="l-warn">'+esc(line)+'</span>';
    if (/▶|=====|-----/.test(line)) return '<span class="l-head">'+esc(line)+'</span>';
    return esc(line);
  }
  function log(msg){
    var el = $('log');
    if (el.querySelector('.l-dim') && el.children.length === 1) el.innerHTML = '';
    var div = document.createElement('div');
    div.innerHTML = colorize(msg);
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  // ---- 文件展示 ----
  function addFile(path, data){
    collected.push({path:path, data:data});
    stats.files++;
    stats.size += data.length;
    if (/tvbox\/.*\.json$/.test(path) && !/live\//.test(path)) stats.api++;
    if (/failed_links/.test(path)) { /* noop */ }
    renderFiles();
  }
  function renderFiles(){
    $('sFiles').textContent = stats.files;
    $('sSize').textContent  = fmtBytes(stats.size);
    $('sApi').textContent   = stats.api;
    $('sFail').textContent  = stats.fail;
    $('fcount').textContent = stats.files;
    var el = $('files');
    if (!collected.length){ el.innerHTML = '<div class="fitem"><span class="p l-dim">暂无输出</span></div>'; return; }
    var html = '';
    for (var i = 0; i < collected.length; i++){
      var f = collected[i];
      html += '<div class="fitem"><span class="p">'+esc(f.path)+'</span>'
            + '<span class="s">'+fmtBytes(f.data.length)+'</span></div>';
    }
    el.innerHTML = html;
  }
  function fmtBytes(n){
    if (n < 1024) return n + 'B';
    if (n < 1048576) return (n/1024).toFixed(1) + 'K';
    return (n/1048576).toFixed(2) + 'M';
  }

  // ---- base64 ----
  function b64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function strToBytes(s){ return new TextEncoder().encode(s); }

  // ---- SSE 解析 ----
  function handleEvent(evName, dataStr){
    var data;
    try { data = JSON.parse(dataStr); } catch(e){ return; }
    if (evName === 'log'){
      log(data.msg);
      if (/✗|失败/.test(data.msg)) { }
    } else if (evName === 'file'){
      if (data.b64 != null) addFile(data.path, b64ToBytes(data.b64));
      else addFile(data.path, strToBytes(data.text != null ? data.text : ''));
    } else if (evName === 'stat'){
      if (data.failed != null) { stats.fail = data.failed; renderFiles(); }
    } else if (evName === 'error'){
      log('✗ 服务端错误: ' + data.msg);
    } else if (evName === 'done'){
      log('');
      log('==============================================================');
      log(data.ok ? '✓ 全部完成' : '✗ 执行中断');
      log('==============================================================');
      $('status').textContent = data.ok ? '完成' : '失败';
    }
  }

  // ---- 启动 ----
  async function run(){
    if (running) return;

    var apiText = $('apiList').value.trim();
    if (!$('tA').checked && !$('tC').checked){
      alert('至少需要启用任务 A 或任务 C');
      return;
    }
    if ($('tA').checked && !apiText){
      alert('任务 A 需要填写接口列表');
      return;
    }

    running = true;
    collected = []; stats = {files:0, size:0, api:0, fail:0};
    renderFiles();
    $('log').innerHTML = '';
    $('runBtn').disabled = true;
    $('zipBtn').disabled = true;
    $('status').innerHTML = '<span class="spin"></span> 运行中';

    var cfg = {
      tasks: {
        fetchApi:  $('tA').checked,
        scanLocal: $('tB').checked,
        ryDownload:$('tC').checked,
        localize:  $('tD').checked
      },
      apiListText: apiText,
      ryLinksText: $('ryLinks').value,
      oldListTxt:  $('oldList').value,
      timeout:     parseInt($('timeout').value, 10) || 12,
      localizeDir: $('localDir') ? $('localDir').value : 'localize',
      debug:       $('debug').value === '1'
    };
    if (cfg.localizeDir === undefined) cfg.localizeDir = 'localize';
    cfg.localizeDir = ($('locDir') ? $('locDir').value : 'localize') || 'localize';

    try {
      var res = await fetch('/api/run', {
        method: 'POST',
        headers: {'content-type':'application/json'},
        body: JSON.stringify(cfg)
      });
      if (!res.ok || !res.body){
        throw new Error('HTTP ' + res.status);
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';

      while (true){
        var r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, {stream:true});
        var idx;
        while ((idx = buf.indexOf('\n\n')) >= 0){
          var chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          var evName = 'message', dataStr = '';
          var lines = chunk.split('\n');
          for (var i = 0; i < lines.length; i++){
            var ln = lines[i];
            if (ln.indexOf('event:') === 0) evName = ln.slice(6).trim();
            else if (ln.indexOf('data:') === 0) dataStr += ln.slice(5).trim();
          }
          if (dataStr) handleEvent(evName, dataStr);
        }
      }
    } catch(e){
      log('✗ 连接失败: ' + e.message);
      $('status').textContent = '错误';
    } finally {
      running = false;
      $('runBtn').disabled = false;
      if (collected.length) $('zipBtn').disabled = false;
      if ($('status').textContent === '运行中' || $('status').querySelector && $('status').querySelector('.spin')){
        $('status').textContent = '完成';
      }
    }
  }

  $('runBtn').addEventListener('click', run);

  // ---- ZIP 打包（store 模式，自实现） ----
  var CRC_TABLE = null;
  function crc32(buf){
    if (!CRC_TABLE){
      CRC_TABLE = new Uint32Array(256);
      for (var i = 0; i < 256; i++){
        var c = i;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        CRC_TABLE[i] = c >>> 0;
      }
    }
    var crc = 0xFFFFFFFF;
    for (var j = 0; j < buf.length; j++){
      crc = CRC_TABLE[(crc ^ buf[j]) & 0xFF] ^ (crc >>> 8);
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(files){
    var enc = new TextEncoder();
    var parts = [];
    var central = [];
    var offset = 0;
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

    for (var i = 0; i < files.length; i++){
      var f = files[i];
      var nameBytes = enc.encode(f.path);
      var data = f.data;
      var crc = crc32(data);
      var size = data.length;

      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);

      parts.push(lh);
      parts.push(data);

      var cd = new Uint8Array(46 + nameBytes.length);
      var dv2 = new DataView(cd.buffer);
      dv2.setUint32(0, 0x02014b50, true);
      dv2.setUint16(4, 20, true);
      dv2.setUint16(6, 20, true);
      dv2.setUint16(8, 0x0800, true);
      dv2.setUint16(10, 0, true);
      dv2.setUint16(12, dosTime, true);
      dv2.setUint16(14, dosDate, true);
      dv2.setUint32(16, crc, true);
      dv2.setUint32(20, size, true);
      dv2.setUint32(24, size, true);
      dv2.setUint16(28, nameBytes.length, true);
      dv2.setUint16(30, 0, true);
      dv2.setUint16(32, 0, true);
      dv2.setUint16(34, 0, true);
      dv2.setUint16(36, 0, true);
      dv2.setUint32(38, 0, true);
      dv2.setUint32(42, offset, true);
      cd.set(nameBytes, 46);
      central.push(cd);

      offset += lh.length + size;
    }

    var cdSize = 0;
    for (var k = 0; k < central.length; k++) cdSize += central[k].length;

    var eocd = new Uint8Array(22);
    var dv3 = new DataView(eocd.buffer);
    dv3.setUint32(0, 0x06054b50, true);
    dv3.setUint16(4, 0, true);
    dv3.setUint16(6, 0, true);
    dv3.setUint16(8, central.length, true);
    dv3.setUint16(10, central.length, true);
    dv3.setUint32(12, cdSize, true);
    dv3.setUint32(16, offset, true);
    dv3.setUint16(20, 0, true);

    var all = parts.concat(central);
    all.push(eocd);
    return new Blob(all, {type:'application/zip'});
  }

  $('zipBtn').addEventListener('click', function(){
    if (!collected.length) return;
    $('zipBtn').disabled = true;
    $('zipBtn').textContent = '⏳ 打包中...';
    setTimeout(function(){
      try {
        var blob = buildZip(collected);
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var ts = new Date();
        var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
        var stamp = ts.getFullYear() + pad(ts.getMonth()+1) + pad(ts.getDate())
                  + '_' + pad(ts.getHours()) + pad(ts.getMinutes()) + pad(ts.getSeconds());
        a.href = url;
        a.download = 'tvbox_output_' + stamp + '.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
        log('✓ ZIP 已生成并开始下载 (' + fmtBytes(blob.size) + ')');
      } catch(e){
        log('✗ 打包失败: ' + e.message);
      } finally {
        $('zipBtn').disabled = false;
        $('zipBtn').textContent = '⬇ 下载 ZIP 打包';
      }
    }, 30);
  });

  renderFiles();
})();
</script>
</body>
</html>
