<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 接口列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #2c3e50; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .desc { color: #7f8c8d; font-size: 0.85rem; margin-bottom: 20px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  input[type="text"] { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #fafbfc; color: #95a5a6; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  tbody tr:hover { background: #f8f9ff; }
  .url { font-family: monospace; color: #3498db; word-break: break-all; }
  .size { color: #27ae60; font-variant-numeric: tabular-nums; }
  .date { color: #7f8c8d; font-variant-numeric: tabular-nums; }
  button.copy { padding: 6px 12px; border: none; background: #3498db; color: #fff; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: background .2s; }
  button.copy:hover { background: #2980b9; }
  button.copy.ok { background: #27ae60; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #27ae60; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading, .error { padding: 30px; text-align: center; color: #95a5a6; }
  .error { color: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <h1>📺 TVBox 接口列表</h1>
  <p class="desc">域名 + 路径 + 文件名，可直接复制为接口地址</p>

  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索文件名 / 备注...">
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>接口地址</th>
          <th>更新时间</th>
          <th>大小</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="4" class="loading">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast">已复制到剪贴板</div>

<script>
// ====== 配置:接口文件所在的基础路径(域名 + 目录) ======
// 网页会自动用 当前域名 + 此路径 + 文件名 拼接完整接口地址
const BASE_PATH = "https://0.12yue.de5.net/api/";
const LIST_URL  = "list.txt";  // 与 HTML 同目录的数据文本

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + "K";
  return (bytes / (1024 * 1024)).toFixed(2) + "M";
}

function copy(text) {
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  });
}

async function loadList() {
  const res = await fetch(LIST_URL + "?t=" + Date.now());
  if (!res.ok) throw new Error("无法加载 list.txt (HTTP " + res.status + ")");
  const text = await res.text();
  const items = [];
  for (const line of text.split(/\r?\n/)) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith("#")) continue;
    const parts = trimmed.split("|").map(s => s.trim());
    if (parts.length < 3) continue;
    items.push({
      file: parts[0],
      date: parts[1],
      size: parseInt(parts[2], 10) || 0,
      note: parts[3] || "",
      url: BASE_PATH + encodeURI(parts[0]),
    });
  }
  return items;
}

function render(items) {
  const body = document.getElementById("listBody");
  if (!items.length) {
    body.innerHTML = '<tr><td colspan="4" class="loading">暂无数据</td></tr>';
    return;
  }
  body.innerHTML = items.map(it => `
    <tr>
      <td>
        <div class="url">${it.url}</div>
        ${it.note ? `<div style="font-size:0.78rem;color:#95a5a6;margin-top:2px;">${it.note}</div>` : ""}
      </td>
      <td class="date">${it.date}</td>
      <td class="size">${formatSize(it.size)}</td>
      <td><button class="copy" onclick="copy('${it.url}')">复制接口</button></td>
    </tr>
  `).join("");
}

(async () => {
  try {
    const items = await loadList();
    render(items);
    document.getElementById("search").addEventListener("input", (e) => {
      const kw = e.target.value.trim().toLowerCase();
      render(items.filter(it =>
        !kw || it.file.toLowerCase().includes(kw) || it.note.toLowerCase().includes(kw)
      ));
    });
  } catch (err) {
    document.getElementById("listBody").innerHTML =
      `<tr><td colspan="4" class="error">加载失败: ${err.message}<br><small>请确认 list.txt 与本页面在同一目录,且通过服务器访问</small></td></tr>`;
  }
})();
</script>
</body>
</html>
