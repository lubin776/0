<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 接口解析工具</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3;
  --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
  --yellow:#d29922; --purple:#bc8cff; --input-bg:#0d1117; --hover:#21262d;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
}
.container{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
header{text-align:center;padding:30px 0 20px;}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:6px;
  background:linear-gradient(135deg,#58a6ff,#bc8cff);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;}
header p{color:var(--muted);font-size:.9rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.section-title{font-size:1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-title .num{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.75rem;}
.input-group{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
input[type=text],input[type=url]{flex:1;min-width:200px;padding:10px 14px;background:var(--input-bg);
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;outline:none;
  transition:border-color .2s;}
input:focus{border-color:var(--accent);}
button{cursor:pointer;padding:10px 18px;border:none;border-radius:8px;font-size:.9rem;
  font-weight:500;transition:all .2s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#4a96ef;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:var(--hover);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:#2ea043;}
.btn-small{padding:6px 12px;font-size:.8rem;}
.tabs{display:flex;gap:4px;margin-bottom:0;flex-wrap:wrap;}
.tab{padding:8px 16px;background:transparent;border:1px solid var(--border);border-bottom:none;
  border-radius:8px 8px 0 0;color:var(--muted);cursor:pointer;font-size:.85rem;transition:all .2s;}
.tab.active{background:var(--card);color:var(--text);border-color:var(--border);}
.tab-content{display:none;border:1px solid var(--border);border-radius:0 12px 12px 12px;padding:20px;background:var(--card);}
.tab-content.active{display:block;}
.url-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;}
.url-list-item{display:flex;gap:8px;align-items:center;}
.url-list-item input{flex:1;}
.url-list-item .btn-remove{background:var(--red);color:#fff;width:32px;height:32px;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:1.1rem;}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px;}
.option-item{display:flex;align-items:center;gap:8px;}
.option-item label{font-size:.85rem;color:var(--muted);cursor:pointer;}
.option-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);}
.option-item select{padding:6px 10px;background:var(--input-bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text);font-size:.85rem;outline:none;}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.badge{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;}
.badge-success{background:rgba(63,185,80,.15);color:var(--green);}
.badge-error{background:rgba(248,81,73,.15);color:var(--red);}
.badge-warning{background:rgba(210,153,34,.15);color:var(--yellow);}
.badge-info{background:rgba(88,166,255,.15);color:var(--accent);}
pre{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:16px;
  overflow:auto;max-height:500px;font-size:.82rem;line-height:1.5;white-space:pre-wrap;word-break:break-all;
  font-family:'SF Mono',Consolas,'Courier New',monospace;}
.info-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:.82rem;color:var(--muted);}
.info-row span{display:flex;align-items:center;gap:4px;}
.log{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;
  max-height:200px;overflow-y:auto;font-size:.8rem;font-family:Consolas,monospace;}
.log-entry{margin-bottom:4px;padding:2px 0;border-bottom:1px solid rgba(48,54,61,.5);}
.log-entry:last-child{border-bottom:none;}
.log-time{color:var(--muted);}
.log-success{color:var(--green);}
.log-error{color:var(--red);}
.log-info{color:var(--accent);}
.log-warning{color:var(--yellow);}
.preset-group{margin-bottom:16px;}
.preset-group h4{font-size:.85rem;color:var(--muted);margin-bottom:8px;}
.preset-tags{display:flex;flex-wrap:wrap;gap:6px;}
.preset-tag{background:var(--border);color:var(--text);padding:4px 12px;border-radius:16px;
  font-size:.8rem;cursor:pointer;transition:all .2s;border:none;}
.preset-tag:hover{background:var(--accent);color:#fff;}
.hidden{display:none;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.stat-value{font-size:1.5rem;font-weight:700;}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:2px;}
.loading{display:inline-block;width:16px;height:16px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;
  border-radius:8px;font-size:.9rem;z-index:9999;animation:fadeIn .3s;}
.toast-success{background:var(--green);color:#fff;}
.toast-error{background:var(--red);color:#fff;}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--hover);}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>📡 TVBox 接口解析工具</h1>
  <p>浏览器端纯JS实现 · AES-128-CBC解密 · Base64解码 · Gzip解压 · 零后端依赖</p>
</header>

<!-- ==================== 模块1: 单接口解析 ==================== -->
<div class="card">
  <div class="section-title"><span class="num">1</span> 单接口解析</div>
  <div class="input-group">
    <input type="url" id="singleUrl" placeholder="粘贴接口URL，如 https://example.com/api.json">
    <button class="btn-primary" id="btnParse" onclick="parseSingle()">🔍 解析</button>
  </div>
  <div class="options">
    <div class="option-item">
      <input type="checkbox" id="optFilter" checked>
      <label for="optFilter">过滤非标准字段</label>
    </div>
    <div class="option-item">
      <input type="checkbox" id="optAbsolutize" checked>
      <label for="optAbsolutize">相对URL转绝对</label>
    </div>
    <div class="option-item">
      <input type="checkbox" id="optFormat" checked>
      <label for="optFormat">格式化JSON</label>
    </div>
    <div class="option-item">
      <label>代理</label>
      <select id="optProxy">
        <option value="">无代理</option>
        <option value="https://corsproxy.io/?url=">corsproxy.io</option>
        <option value="https://api.allorigins.win/raw?url=">allorigins</option>
        <option value="https://thingproxy.freeboard.io/fetch/">thingproxy</option>
      </select>
    </div>
  </div>
</div>

<!-- ==================== 模块2: 批量解析 ==================== -->
<div class="card">
  <div class="section-title"><span class="num">2</span> 批量解析（每行一个 URL）</div>
  <div class="tabs">
    <div class="tab active" onclick="switchBatchTab('manual')">手动输入</div>
    <div class="tab" onclick="switchBatchTab('preset')">预设分组</div>
  </div>
  <div class="tab-content active" id="batch-manual">
    <textarea id="batchUrls" placeholder="每行一个接口URL&#10;例如：&#10;https://example.com/api.json&#10;http://test.com/tv" 
      style="width:100%;min-height:120px;padding:10px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;resize:vertical;outline:none;"></textarea>
  </div>
  <div class="tab-content" id="batch-preset">
    <div class="preset-group">
      <h4>📺 电视直播类</h4>
      <div class="preset-tags" id="preset-live"></div>
    </div>
    <div class="preset-group">
      <h4>🎬 影视资源类</h4>
      <div class="preset-tags" id="preset-vod"></div>
    </div>
    <div class="preset-group">
      <h4>🐱 猫源类</h4>
      <div class="preset-tags" id="preset-cat"></div>
    </div>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn-primary" id="btnBatch" onclick="parseBatch()">🚀 批量解析</button>
    <button class="btn-secondary" onclick="clearBatch()">🗑️ 清空</button>
    <button class="btn-secondary" onclick="loadAllPresets()">📋 加载全部预设</button>
  </div>
</div>

<!-- ==================== 模块3: 运行日志 ==================== -->
<div class="card">
  <div class="section-title"><span class="num">3</span> 运行日志</div>
  <div class="log" id="log"></div>
</div>

<!-- ==================== 模块4: 解析结果 ==================== -->
<div class="card" id="resultCard" style="display:none;">
  <div class="result-header">
    <div>
      <span class="badge" id="resultBadge">-</span>
      <span id="resultName" style="margin-left:8px;font-weight:600;"></span>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-green btn-small" onclick="copyResult()">📋 复制</button>
      <button class="btn-secondary btn-small" onclick="downloadResult()">📥 下载JSON</button>
    </div>
  </div>
  <div class="info-row" id="resultInfo"></div>
  <pre id="resultText"></pre>
</div>

<!-- ==================== 模块5: 批量结果 ==================== -->
<div class="card" id="batchResultCard" style="display:none;">
  <div class="section-title">📊 批量解析结果</div>
  <div class="stats" id="batchStats"></div>
  <div id="batchResults"></div>
</div>
</div>

<script>
// ======================================================================
// 工具函数
// ======================================================================
function log(msg, type='info'){
  const el=document.getElementById('log');
  const time=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  const entry=document.createElement('div');
  entry.className='log-entry';
  entry.innerHTML=`<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
  el.insertBefore(entry,el.firstChild);
  if(el.children.length>200) el.removeChild(el.lastChild);
}

function toast(msg,type='success'){
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function showLoading(btn){
  const orig=btn.textContent;
  btn.disabled=true;
  btn.dataset.orig=orig;
  btn.innerHTML='<span class="loading"></span> 处理中...';
}

function hideLoading(btn){
  btn.disabled=false;
  btn.textContent=btn.dataset.orig||'解析';
}

// ======================================================================
// AES-128-CBC 纯JS实现（移植自Python版）
// ======================================================================
const AES_SBOX=[
0x63,0x7C,0x77,0x7B,0xF2,0x6B,0x6F,0xC5,0x30,0x01,0x67,0x2B,0xFE,0xD7,0xAB,0x76,
0xCA,0x82,0xC9,0x7D,0xFA,0x59,0x47,0xF0,0xAD,0xD4,0xA2,0xAF,0x9C,0xA4,0x72,0xC0,
0xB7,0xFD,0x93,0x26,0x36,0x3F,0xF7,0xCC,0x34,0xA5,0xE5,0xF1,0x71,0xD8,0x31,0x15,
0x04,0xC7,0x23,0xC3,0x18,0x96,0x05,0x9A,0x07,0x12,0x80,0xE2,0xEB,0x27,0xB2,0x75,
0x09,0x83,0x2C,0x1A,0x1B,0x6E,0x5A,0xA0,0x52,0x3B,0xD6,0xB3,0x29,0xE3,0x2F,0x84,
0x53,0xD1,0x00,0xED,0x20,0xFC,0xB1,0x5B,0x6A,0xCB,0xBE,0x39,0x4A,0x4C,0x58,0xCF,
0xD0,0xEF,0xAA,0xFB,0x43,0x4D,0x33,0x85,0x45,0xF9,0x02,0x7F,0x50,0x3C,0x9F,0xA8,
0x51,0xA3,0x40,0x8F,0x92,0x9D,0x38,0xF5,0xBC,0xB6,0xDA,0x21,0x10,0xFF,0xF3,0xD2,
0xCD,0x0C,0x13,0xEC,0x5F,0x97,0x44,0x17,0xC4,0xA7,0x7E,0x3D,0x64,0x5D,0x19,0x73,
0x60,0x81,0x4F,0xDC,0x22,0x2A,0x90,0x88,0x46,0xEE,0xB8,0x14,0xDE,0x5E,0x0B,0xDB,
0xE0,0x32,0x3A,0x0A,0x49,0x06,0x24,0x5C,0xC2,0xD3,0xAC,0x62,0x91,0x95,0xE4,0x79,
0xE7,0xC8,0x37,0x6D,0x8D,0xD5,0x4E,0xA9,0x6C,0x56,0xF4,0xEA,0x65,0x7A,0xAE,0x08,
0xBA,0x78,0x25,0x2E,0x1C,0xA6,0xB4,0xC6,0xE8,0xDD,0x74,0x1F,0x4B,0xBD,0x8B,0x8A,
0x70,0x3E,0xB5,0x66,0x48,0x03,0xF6,0x0E,0x61,0x35,0x57,0xB9,0x86,0xC1,0x1D,0x9E,
0xE1,0xF8,0x98,0x11,0x69,0xD9,0x8E,0x94,0x9B,0x1E,0x87,0xE9,0xCE,0x55,0x28,0xDF,
0x8C,0xA1,0x89,0x0D,0xBF,0xE6,0x42,0x68,0x41,0x99,0x2D,0x0F,0xB0,0x54,0xBB,0x16,
];

const AES_RCON=[0x00,0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1B,0x36];

function aes_xtime(b){return((b<<1)^(0x1B&(b>>7?0xFF:0)))&0xFF;}

function aes_sub_word(w){
  return(AES_SBOX[(w>>>24)&0xFF]<<24)|(AES_SBOX[(w>>>16)&0xFF]<<16)|
    (AES_SBOX[(w>>>8)&0xFF]<<8)|AES_SBOX[w&0xFF];
}

function aes_rot_word(w){return((w<<8)&0xFFFFFFFF)|((w>>>24)&0xFF);}

function aes_expand_key(key){
  const Nk=4,Nr=10;
  const w=new Array(4*(Nr+1)).fill(0);
  for(let i=0;i<Nk;i++){
    w[i]=(key[4*i]<<24)|(key[4*i+1]<<16)|(key[4*i+2]<<8)|key[4*i+3];
  }
  for(let i=Nk;i<4*(Nr+1);i++){
    let temp=w[i-1];
    if(i%Nk===0){
      temp=aes_sub_word(aes_rot_word(temp))^(AES_RCON[i/Nk]<<24);
    }
    w[i]=w[i-Nk]^temp;
  }
  const out=new Uint8Array(16*(Nr+1));
  for(let i=0;i<4*(Nr+1);i++){
    out[4*i]=(w[i]>>>24)&0xFF;
    out[4*i+1]=(w[i]>>>16)&0xFF;
    out[4*i+2]=(w[i]>>>8)&0xFF;
    out[4*i+3]=w[i]&0xFF;
  }
  return out;
}

function aes_inv_sub_bytes(state){
  const inv=new Array(256);
  for(let i=0;i<256;i++) inv[AES_SBOX[i]]=i;
  return Uint8Array.from(state,b=>inv[b]);
}

function aes_inv_shift_rows(state){
  const s=Array.from(state);
  for(let row=1;row<=3;row++){
    const shift=row;
    const base=[];
    for(let c=0;c<4;c++) base.push(s[row+4*c]);
    const rotated=[...base.slice(-shift),...base.slice(0,-shift)];
    for(let c=0;c<4;c++) s[row+4*c]=rotated[c];
  }
  return new Uint8Array(s);
}

function aes_inv_mix_columns(state){
  function mul(a,b){
    let r=0;
    while(b){
      if(b&1) r^=a;
      a=aes_xtime(a);
      b>>>=1;
    }
    return r;
  }
  const s=Array.from(state);
  for(let c=0;c<4;c++){
    const i=4*c;
    const a0=s[i],a1=s[i+1],a2=s[i+2],a3=s[i+3];
    s[i]=mul(a0,0x0e)^mul(a1,0x0b)^mul(a2,0x0d)^mul(a3,0x09);
    s[i+1]=mul(a0,0x09)^mul(a1,0x0e)^mul(a2,0x0b)^mul(a3,0x0d);
    s[i+2]=mul(a0,0x0d)^mul(a1,0x09)^mul(a2,0x0e)^mul(a3,0x0b);
    s[i+3]=mul(a0,0x0b)^mul(a1,0x0d)^mul(a2,0x09)^mul(a3,0x0e);
  }
  return new Uint8Array(s);
}

function aes_decrypt_block(block,rk){
  const Nr=10;
  let state=new Uint8Array(16);
  for(let i=0;i<16;i++) state[i]=block[i]^rk[16*Nr+i];
  for(let r=Nr-1;r>=1;r--){
    state=aes_inv_shift_rows(state);
    state=aes_inv_sub_bytes(state);
    for(let i=0;i<16;i++) state[i]^=rk[16*r+i];
    state=aes_inv_mix_columns(state);
  }
  state=aes_inv_shift_rows(state);
  state=aes_inv_sub_bytes(state);
  for(let i=0;i<16;i++) state[i]^=rk[i];
  return state;
}

function aes_decrypt_cbc(ciphertext,key,iv){
  const rk=aes_expand_key(key);
  const plain=new Uint8Array(ciphertext.length);
  let prev=new Uint8Array(iv);
  for(let i=0;i<ciphertext.length;i+=16){
    const block=ciphertext.slice(i,i+16);
    const decrypted=aes_decrypt_block(block,rk);
    for(let j=0;j<16;j++) plain[i+j]=decrypted[j]^prev[j];
    prev=block;
  }
  // Remove PKCS7 padding
  const pad=plain[plain.length-1];
  let unpadded=plain;
  if(pad>=1&&pad<=16&&plain.length>=pad){
    let valid=true;
    for(let i=plain.length-pad;i<plain.length;i++){
      if(plain[i]!==pad){valid=false;break;}
    }
    if(valid) unpadded=plain.slice(0,plain.length-pad);
  }
  return new TextDecoder('utf-8',{fatal:false}).decode(unpadded);
}

// ======================================================================
// Base64 工具
// ======================================================================
function b64_to_bytes(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}

function bytes_to_b64(bytes){
  let bin='';
  for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}

// UTF-8 安全的 base64 编码
function utf8_to_b64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

// ======================================================================
// Gzip 解压（使用浏览器 DecompressionStream）
// ======================================================================
async function gunzip(bytes){
  if(typeof DecompressionStream==='undefined'){
    throw new Error('浏览器不支持 DecompressionStream，无法解压 gzip');
  }
  const stream=new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
  const result=await new Response(stream).arrayBuffer();
  return new Uint8Array(result);
}

// ======================================================================
// 核心解析逻辑（移植自 find_result）
// ======================================================================
function isJson(text){
  if(!text) return false;
  const t=text.trim();
  return t.startsWith('{')||t.startsWith('[');
}

function collapseWhitespace(text){
  if(!text) return '';
  return text.replace(/\s+/g,' ').trim();
}

function tryDecrypt2423Hex(stripped){
  const idx2423=stripped.indexOf('2423');
  const idx2324=stripped.indexOf('2324');
  if(idx2423<0||idx2324<0||idx2324<=idx2423+4) throw new Error('2423结构不完整');
  
  const keyHex=stripped.slice(idx2423+4,idx2324);
  // 匹配Python: try bytes.fromhex() else fallback to raw string
  let keyStr;
  try{
    const keyRaw=hexToBytes(keyHex);
    keyStr=bytesToLatin1(keyRaw);
  }catch(e){
    keyStr=keyHex; // fallback: 直接用原始字符串作为key
  }
  keyStr=padRight(keyStr,'0',16);
  
  const dataStart=idx2324+4;
  const contentRstrip=stripped.replace(/\s+$/,'');
  const tsHex=contentRstrip.slice(contentRstrip.length-26);
  const dataEnd=stripped.length-26;
  if(dataEnd<=dataStart) throw new Error('hex形态: data区间非法');
  
  const dataHex=stripped.slice(dataStart,dataEnd);
  const tsBytes=hexToBytes(tsHex);
  const ivStr=padRight(bytesToLatin1(tsBytes),'0',16);
  
  const keyBytes=utf8Bytes(keyStr).slice(0,16);
  const ivBytes=utf8Bytes(ivStr).slice(0,16);
  const cipherBytes=hexToBytes(dataHex);
  
  if(keyBytes.length!==16) throw new Error('Key长度不为16');
  if(ivBytes.length!==16) throw new Error('IV长度不为16');
  if(cipherBytes.length%16!==0) throw new Error('Cipher长度不是16倍数');
  
  return aes_decrypt_cbc(cipherBytes,keyBytes,ivBytes);
}

function tryDecrypt2423Plain(S){
  const idx2324=S.indexOf('2324');
  const pDoll=S.indexOf('$#');
  const pSharp=S.indexOf('#$');
  if(idx2324<0||pDoll<0||pSharp<0) throw new Error('2423-plain结构不完整');
  
  let dataHex=S.slice(idx2324+4,pDoll);
  dataHex=dataHex.replace(/[^0-9a-fA-F]/g,'');
  if(dataHex.length%2!==0) dataHex=dataHex.slice(0,-1);
  
  const key=padRight(S.slice(pDoll+2,pSharp),'0',16);
  const iv=padRight(S.slice(S.length-13),'0',16);
  
  const keyBytes=latin1Bytes(key).slice(0,16);
  const ivBytes=latin1Bytes(iv).slice(0,16);
  const cipherBytes=hexToBytes(dataHex);
  
  return aes_decrypt_cbc(cipherBytes,keyBytes,ivBytes);
}

function hexToBytes(hex){
  const clean=hex.replace(/[^0-9a-fA-F]/g,'');
  if(clean.length%2!==0) throw new Error('hex长度奇数');
  const bytes=new Uint8Array(clean.length/2);
  for(let i=0;i<bytes.length;i++){
    bytes[i]=parseInt(clean.slice(i*2,i*2+2),16);
  }
  return bytes;
}

function bytesToLatin1(bytes){
  let s='';
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return s;
}

function utf8Bytes(str){
  const bytes=new TextEncoder().encode(str);
  return bytes;
}

function latin1Bytes(str){
  const bytes=new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) bytes[i]=str.charCodeAt(i)&0xFF;
  return bytes;
}

function padRight(s,ch,length){
  if(s.length>=length) return s.slice(0,length);
  return s+ch.repeat(length-s.length);
}

// 递归解析（对应 find_result）
async function findResult(rawText,rawBytes,depth=0){
  if(depth>5) return rawText||'';
  
  const content=rawText||(rawBytes?new TextDecoder('utf-8',{fatal:false}).decode(rawBytes):'');
  
  // 1. 已经是JSON，直接返回
  if(isJson(content)){
    log(`  已是有效JSON，深度=${depth}`,'success');
    return content;
  }
  
  // 2. 图片壳 + base64 (** 标记)
  if(rawBytes){
    const starIdx=findDoubleStar(rawBytes);
    if(starIdx>=0){
      log(`  发现 ** 标记 (offset=${starIdx})，尝试base64解码`,'info');
      const b64Bytes=rawBytes.slice(starIdx+2).filter(b=>![0x09,0x0a,0x0d,0x20].includes(b));
      try{
        const decoded=atob(bytesToLatin1(b64Bytes));
        const result=await findResult(decoded,null,depth+1);
        if(isJson(result)) return result;
      }catch(e){
        log(`  base64解码失败: ${e.message}`,'warning');
      }
    }
  }
  
  // 3. 2423 壳解密
  const stripped=collapseWhitespace(content);
  if(stripped.startsWith('2423')&&stripped.includes('2324')){
    log(`  发现2423壳，深度=${depth}`,'info');
    let lastErr=null;
    try{
      const result=tryDecrypt2423Hex(stripped);
      log(`  2423-hex形态解密成功`,'success');
      return await findResult(result,null,depth+1);
    }catch(e){
      lastErr=e;
      log(`  2423-hex失败: ${e.message}`,'warning');
    }
    try{
      const result=tryDecrypt2423Plain(stripped);
      log(`  2423-plain形态解密成功`,'success');
      return await findResult(result,null,depth+1);
    }catch(e2){
      log(`  2423-plain也失败: ${e2.message}`,'warning');
      throw new Error(`2423双形态均解密失败: hex=${lastErr?.message} / plain=${e2.message}`);
    }
  }
  
  // 4. 纯 base64
  const cleanNoSpace=content.replace(/\s/g,'');
  if(/^[A-Za-z0-9+/=]+$/.test(cleanNoSpace)&&cleanNoSpace.length>50){
    try{
      const decoded=atob(cleanNoSpace);
      const result=await findResult(decoded,null,depth+1);
      if(isJson(result)) return result;
    }catch(e){}
  }
  
  // 5. Gzip 解压
  if(rawBytes&&rawBytes.length>2&&rawBytes[0]===0x1f&&rawBytes[1]===0x8b){
    try{
      const decompressed=await gunzip(rawBytes);
      const text=new TextDecoder('utf-8',{fatal:false}).decode(decompressed);
      log(`  Gzip解压成功 (${decompressed.length}字节)`,'success');
      return await findResult(text,decompressed,depth+1);
    }catch(e){
      log(`  Gzip解压失败: ${e.message}`,'warning');
    }
  }
  
  return content;
}

function findDoubleStar(bytes){
  // 查找 ** 标记（但前面需要有足够的随机数据）
  for(let i=0;i<bytes.length-1;i++){
    if(bytes[i]===0x2a&&bytes[i+1]===0x2a){
      // 检查前面8字节是否像随机数据
      if(i>=8) return i;
    }
  }
  // 也支持文本搜索
  return -1;
}

// ======================================================================
// JSON 后处理
// ======================================================================
const KEEP_FIELDS=new Set([
  'video','sites','lives','parses','rules','spider','wallpaper',
  'livePlayHeaders','md5','name','homeSite','homeLogo','homeBg',
  'homeSearch','homeRec','searchable'
]);

function filterJson(text){
  try{
    const obj=JSON.parse(text);
    if(typeof obj!=='object'||Array.isArray(obj)){
      return JSON.stringify(obj,null,2);
    }
    const filtered={};
    for(const[k,v]of Object.entries(obj)){
      if(KEEP_FIELDS.has(k)) filtered[k]=v;
    }
    return JSON.stringify(Object.keys(filtered).length?filtered:obj,null,2);
  }catch(e){
    return text;
  }
}

function absolutizeJson(text,sourceUrl){
  if(!sourceUrl) return text;
  try{
    const obj=JSON.parse(text);
    const base=getBaseUrl(sourceUrl);
    if(!base) return text;
    
    const topFields=['spider','wallpaper','homeLogo','homeBg','homeSite','livePlayHeaders'];
    if(typeof obj==='object'&&!Array.isArray(obj)){
      for(const field of topFields){
        if(obj[field]&&typeof obj[field]==='string'){
          obj[field]=resolveUrl(obj[field],base);
        }
      }
      if(obj.sites&&Array.isArray(obj.sites)){
        for(const site of obj.sites){
          if(typeof site!=='object') continue;
          for(const field of['ext','jar','playUrl']){
            if(site[field]&&typeof site[field]==='string'){
              site[field]=resolveUrl(site[field],base);
            }
          }
        }
      }
      if(obj.lives&&Array.isArray(obj.lives)){
        for(const live of obj.lives){
          if(live.url&&typeof live.url==='string'){
            live.url=resolveUrl(live.url,base);
          }
        }
      }
      if(obj.parses&&Array.isArray(obj.parses)){
        for(const p of obj.parses){
          if(p.url&&typeof p.url==='string'){
            p.url=resolveUrl(p.url,base);
          }
        }
      }
    }
    return JSON.stringify(obj,null,2);
  }catch(e){
    return text;
  }
}

function getBaseUrl(url){
  if(!url) return '';
  const idx=url.lastIndexOf('/');
  if(idx<=0) return '';
  return url.slice(0,idx+1);
}

function isAbsoluteUrl(v){
  if(!v||typeof v!=='string') return true;
  return /^(https?:\/\/|data:|file:\/\/|\/\/)/.test(v.trim());
}

function resolveUrl(rel,base){
  if(!rel||isAbsoluteUrl(rel)) return rel;
  if(!base) return rel;
  try{
    return new URL(rel,base).toString();
  }catch(e){
    // manual join
    if(rel.startsWith('/')) return base.split('/').slice(0,3).join('/')+rel;
    return base+rel;
  }
}

function extractJson(text){
  if(!text) return text;
  // Remove comments
  text=removeJsonComments(text);
  const start=text.search(/[{[]/);
  if(start<0) return text;
  const end=text.lastIndexOf('}');
  if(end<=start) return text;
  const jsonText=text.slice(start,end+1);
  try{
    JSON.parse(jsonText);
    return jsonText;
  }catch(e){
    return text;
  }
}

function removeJsonComments(text){
  if(!text) return text;
  // Remove BOM
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  // Simple comment removal (line comments only)
  const lines=text.split('\n');
  let inBlock=false;
  const result=[];
  for(let line of lines){
    if(inBlock){
      const idx=line.indexOf('*/');
      if(idx>=0){
        inBlock=false;
        line=line.slice(idx+2);
      }else continue;
    }
    const blockIdx=line.indexOf('/*');
    if(blockIdx>=0){
      const after=line.slice(blockIdx+2);
      if(after.includes('*/')){
        line=line.slice(0,blockIdx)+after.slice(after.indexOf('*/')+2);
      }else{
        inBlock=true;
        line=line.slice(0,blockIdx);
      }
    }
    // Remove // comments (simple)
    let inStr=false,strChar=null;
    for(let i=0;i<line.length-1;i++){
      const c=line[i];
      if((c==='"'||c==="'")&&(i===0||line[i-1]!=='\\')){
        if(!inStr){inStr=true;strChar=c;}
        else if(c===strChar) inStr=false;
      }
      if(!inStr&&line[i]==='/'&&line[i+1]==='/'){
        line=line.slice(0,i);
        break;
      }
    }
    if(line.trim()) result.push(line);
  }
  return result.join('\n');
}

// ======================================================================
// 网络请求
// ======================================================================
async function fetchWithProxy(url,proxy=''){
  const finalUrl=proxy?proxy+encodeURIComponent(url):url;
  const headers={};
  // 随机选择一个 TVBox UA
  const uas=[
    'okhttp/3.15','okhttp/4.9.3','TVBox/1.0.0',
    'com.github.tvbox','Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
  ];
  const ua=uas[Math.floor(Math.random()*uas.length)];
  headers['User-Agent']=ua;
  
  log(`  请求: ${url}`,'info');
  if(proxy) log(`  通过代理: ${proxy}`,'info');
  
  const resp=await fetch(finalUrl,{
    method:'GET',
    headers,
    mode:'cors',
    redirect:'follow',
  });
  
  if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
  
  const contentType=resp.headers.get('content-type')||'';
  const buffer=await resp.arrayBuffer();
  
  if(contentType.includes('json')||contentType.includes('text')||contentType.includes('xml')){
    const text=await resp.text();
    return {text,bytes:new Uint8Array(buffer),format:'text'};
  }
  
  // binary (可能是图片壳)
  return {text:null,bytes:new Uint8Array(buffer),format:'binary'};
}

let currentResult='';
let currentFilename='';

async function parseSingle(){
  const url=document.getElementById('singleUrl').value.trim();
  if(!url){
    toast('请输入URL','error');
    return;
  }
  
  const btn=document.getElementById('btnParse');
  showLoading(btn);
  log(`开始解析: ${url}`,'info');
  
  try{
    const proxy=document.getElementById('optProxy').value;
    const doFilter=document.getElementById('optFilter').checked;
    const doAbs=document.getElementById('optAbsolutize').checked;
    const doFormat=document.getElementById('optFormat').checked;
    
    const {text,bytes,format}=await fetchWithProxy(url,proxy);
    
    log(`  下载完成 (${bytes?bytes.length:0} 字节, 格式=${format})`,'success');
    
    // 核心解析
    let rawText=text||'';
    let rawBytes=bytes||new TextEncoder().encode(rawText);
    
    let result=await findResult(rawText,rawBytes);
    
    // 提取JSON
    result=extractJson(result);
    
    // 过滤
    if(doFilter) result=filterJson(result);
    
    // 绝对化
    if(doAbs) result=absolutizeJson(result,url);
    
    // 格式化
    if(doFormat){
      try{
        result=JSON.stringify(JSON.parse(result),null,2);
      }catch(e){}
    }
    
    // 显示结果
    displayResult('单接口',url,result,'JSON');
    log(`✓ 解析完成 (${result.length} 字符)`,'success');
    toast('解析成功！');
    
  }catch(e){
    log(`✗ 解析失败: ${e.message}`,'error');
    // 显示原始响应（如果有）
    displayResult('单接口',url,e.message,'ERROR');
    toast('解析失败: '+e.message,'error');
  }finally{
    hideLoading(btn);
  }
}

function displayResult(name,url,content,status){
  currentResult=content;
  currentFilename=name.replace(/[^\w\u4e00-\u9fff]/g,'_')+'.json';
  
  const card=document.getElementById('resultCard');
  const badge=document.getElementById('resultBadge');
  const nameEl=document.getElementById('resultName');
  const info=document.getElementById('resultInfo');
  const text=document.getElementById('resultText');
  
  card.style.display='block';
  badge.className='badge '+(status==='JSON'?'badge-success':status==='TEXT'?'badge-warning':'badge-error');
  badge.textContent=status;
  nameEl.textContent=name;
  
  info.innerHTML=`<span>🔗 ${url}</span><span>📏 ${content.length} 字符</span>`;
  text.textContent=content;
  
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyResult(){
  if(!currentResult){
    toast('没有可复制的内容','error');
    return;
  }
  navigator.clipboard.writeText(currentResult).then(()=>{
    toast('已复制到剪贴板！');
  }).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');
    ta.value=currentResult;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制！');
  });
}

function downloadResult(){
  if(!currentResult){
    toast('没有可下载的内容','error');
    return;
  }
  const blob=new Blob([currentResult],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=currentFilename;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('下载已开始！');
}

function switchBatchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('batch-'+tab).classList.add('active');
}

function clearBatch(){
  document.getElementById('batchUrls').value='';
  toast('已清空');
}

function getBatchUrls(){
  const activeTab=document.querySelector('.tab-content.active').id;
  if(activeTab==='batch-manual'){
    return document.getElementById('batchUrls').value
      .split('\n').map(s=>s.trim()).filter(s=>s&&s.startsWith('http'));
  }else{
    // preset
    return window._presetUrls||[];
  }
}

async function parseBatch(){
  const urls=getBatchUrls();
  if(!urls.length){
    toast('没有有效的URL','error');
    return;
  }
  
  const btn=document.getElementById('btnBatch');
  showLoading(btn);
  log(`批量解析开始: ${urls.length} 个接口`,'info');
  
  const proxy=document.getElementById('optProxy').value;
  const doFilter=document.getElementById('optFilter').checked;
  const doAbs=document.getElementById('optAbsolutize').checked;
  const doFormat=document.getElementById('optFormat').checked;
  
  const results=[];
  let success=0,failed=0;
  
  for(let i=0;i<urls.length;i++){
    const url=urls[i];
    const name=`接口${i+1}`;
    try{
      log(`[${i+1}/${urls.length}] ${url}`,'info');
      const {text,bytes,format}=await fetchWithProxy(url,proxy);
      let result=await findResult(text||'',bytes||new TextEncoder().encode(text||''));
      result=extractJson(result);
      if(doFilter) result=filterJson(result);
      if(doAbs) result=absolutizeJson(result,url);
      if(doFormat){
        try{result=JSON.stringify(JSON.parse(result),null,2);}catch(e){}
      }
      results.push({name,url,status:'JSON',content:result,size:result.length});
      success++;
      log(`  ✓ ${result.length} 字符`,'success');
    }catch(e){
      results.push({name,url,status:'ERROR',content:e.message,size:0});
      failed++;
      log(`  ✗ ${e.message}`,'error');
    }
    // 更新进度
    updateBatchStats(results,success,failed);
  }
  
  displayBatchResults(results);
  hideLoading(btn);
  log(`批量解析完成: ${success}成功 / ${failed}失败`,success?'success':'error');
  toast(`完成！${success}成功 ${failed}失败`);
}

function updateBatchStats(results,success,failed){
  const total=results.length;
  document.getElementById('batchStats').innerHTML=`
    <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">总数</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--green)">${success}</div><div class="stat-label">成功</div></div>
    <div class="stat"><div class="stat-value" style="color:var(--red)">${failed}</div><div class="stat-label">失败</div></div>
  `;
}

function displayBatchResults(results){
  const card=document.getElementById('batchResultCard');
  const container=document.getElementById('batchResults');
  card.style.display='block';
  
  container.innerHTML=results.map((r,i)=>`
    <div class="card" style="margin-bottom:8px;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div>
          <span class="badge ${r.status==='JSON'?'badge-success':'badge-error'}">${r.status}</span>
          <span style="margin-left:8px;font-size:.85rem;">${r.url}</span>
        </div>
        ${r.status==='JSON'?`
          <div style="display:flex;gap:6px;">
            <button class="btn-green btn-small" onclick="copyText(\`${r.content.replace(/`/g,'\\`')}\`)">📋</button>
            <button class="btn-secondary btn-small" onclick="downloadText(\`${r.content.replace(/`/g,'\\`')}\`,'${i}.json')">📥</button>
          </div>

      </div>
      ${r.status==='JSON'?`<pre style="max-height:200px;font-size:.75rem;">${r.content.slice(0,2000)}${r.content.length>2000?'...':''}</pre>`:''}
    </div>
  `).join('');
  
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyText(text){
