// ======================================================================
//  缓存管理（localStorage）
// ======================================================================
const CACHE_PREFIX = "tvbox_cache_";
const CACHE_META_KEY = "tvbox_cache_meta";

function getCache(key) {
    try {
        const data = localStorage.getItem(CACHE_PREFIX + key);
        if (!data) return null;
        const parsed = JSON.parse(data);
        // 检查是否过期（默认 1 小时）
        const ttl = 60 * 60 * 1000;
        if (Date.now() - parsed.timestamp > ttl) {
            localStorage.removeItem(CACHE_PREFIX + key);
            return null;
        }
        return parsed;
    } catch (e) {
        return null;
    }
}

function setCache(key, value) {
    try {
        const payload = { timestamp: Date.now(), data: value };
        localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(payload));
        // 更新元数据（LRU，最多保留 100 条）
        let meta = JSON.parse(localStorage.getItem(CACHE_META_KEY) || "{}");
        meta[key] = Date.now();
        const keys = Object.keys(meta).sort((a, b) => meta[b] - meta[a]);
        for (const k of keys.slice(100)) {
            localStorage.removeItem(CACHE_PREFIX + k);
            delete meta[k];
        }
        localStorage.setItem(CACHE_META_KEY, JSON.stringify(meta));
    } catch (e) {
        log(`缓存写入失败: ${e.message}`, "warn");
    }
}

function clearCache() {
    const keys = Object.keys(localStorage).filter(k => k.startsWith(CACHE_PREFIX) || k === CACHE_META_KEY);
    keys.forEach(k => localStorage.removeItem(k));
    log("🗑️ 缓存已清除", "info");
    stats.cache = 0;
    updateStats();
}

// ======================================================================
//  AES-128-CBC + PKCS7（纯 JS 实现）
// ======================================================================
class AES128 {
    static SBOX = [
        0x63,0x7c,0x77,0x7b,0xf2,0x6b,0x6f,0xc5,0x30,0x01,0x67,0x2b,0xfe,0xd7,0xab,0x76,

        0xb7,0xfd,0x93,0x26,0x36,0x3f,0xf7,0xcc,0x34,0xa5,0xe5,0xf1,0x71,0xd8,0x31,0x15,

        0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
        0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
        0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
        0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
        0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,
        0x60,0x81,0x4f,0xdc,0x22,0x2a,0x90,0x88,0x46,0xee,0xb8,0x14,0xde,0x5e,0x0b,0xdb,
        0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,
        0xe7,0xc8,0x37,0x6d,0x8d,0xd5,0x4e,0xa9,0x6c,0x56,0xf4,0xea,0x65,0x7a,0xae,0x08,
        0xba,0x78,0x25,0x2e,0x1c,0xa6,0xb4,0xc6,0xe8,0xdd,0x74,0x1f,0x4b,0xbd,0x8b,0x8a,
        0x70,0x3e,0xb5,0x66,0x48,0x03,0xf6,0x0e,0x61,0x35,0x57,0xb9,0x86,0xc1,0x1d,0x9e,
        0xe1,0xf8,0x98,0x11,0x69,0xd9,0x8e,0x94,0x9b,0x1e,0x87,0xe9,0xce,0x55,0x28,0xdf,
        0x8c,0xa1,0x89,0x0d,0xbf,0xe6,0x42,0x68,0x41,0x99,0x2d,0x0f,0xb0,0x54,0xbb,0x16,
    ];

    static RCON = [0x00, 0x01, 0x02, 0x04, 0x08, 0x10, 0x20, 0x40, 0x80, 0x1b, 0x36];

    static _subWord(w) {
        return (AES128.SBOX[(w >> 24) & 0xff] << 24) |
               (AES128.SBOX[(w >> 16) & 0xff] << 16) |
               (AES128.SBOX[(w >> 8) & 0xff] << 8) |
               (AES128.SBOX[w & 0xff]);
    }

    static _rotWord(w) {
        return ((w << 8) & 0xffffffff) | ((w >>> 24) & 0xff);
    }

    static _expandKey(key) {
        const Nk = 4, Nr = 10;
        const w = new Array(4 * (Nr + 1)).fill(0);
        for (let i = 0; i < Nk; i++) {
            w[i] = (key[4*i] << 24) | (key[4*i+1] << 16) | (key[4*i+2] << 8) | key[4*i+3];
        }
        for (let i = Nk; i < 4 * (Nr + 1); i++) {
            let temp = w[i - 1];
            if (i % Nk === 0) {
                temp = AES128._subWord(AES128._rotWord(temp)) ^ (AES128.RCON[i / Nk] << 24);
            }
            w[i] = w[i - Nk] ^ temp;
        }
        const out = new Uint8Array(16 * (Nr + 1));
        for (let i = 0; i < 4 * (Nr + 1); i++) {
            out[4*i]   = (w[i] >>> 24) & 0xff;
            out[4*i+1] = (w[i] >>> 16) & 0xff;
            out[4*i+2] = (w[i] >>> 8) & 0xff;
            out[4*i+3] = w[i] & 0xff;
        }
        return out;
    }

    static _xtime(b) {
        return ((b << 1) ^ ((b & 0x80) ? 0x1b : 0)) & 0xff;
    }

    static _invSubBytes(state) {
        const inv = new Array(256);
        for (let i = 0; i < 256; i++) inv[AES128.SBOX[i]] = i;
        return Uint8Array.from(state, b => inv[b]);
    }

    static _invShiftRows(state) {
        const s = Array.from(state);
        for (const [row, shift] of [[1,1],[2,2],[3,3]]) {
            const base = [s[row], s[row+4], s[row+8], s[row+12]];
            const rotated = base.slice(-shift).concat(base.slice(0, -shift));
            for (let c = 0; c < 4; c++) s[row + 4*c] = rotated[c];
        }
        return new Uint8Array(s);
    }

    static _gfMul(a, b) {
        let r = 0;
        while (b) {
            if (b & 1) r ^= a;
            a = AES128._xtime(a);
            b >>>= 1;
        }
        return r;
    }

    static _invMixColumns(state) {
        const s = Array.from(state);
        for (let c = 0; c < 4; c++) {
            const i = 4*c;
            const a0 = s[i], a1 = s[i+1], a2 = s[i+2], a3 = s[i+3];
            s[i]   = AES128._gfMul(a0,0x0e) ^ AES128._gfMul(a1,0x0b) ^ AES128._gfMul(a2,0x0d) ^ AES128._gfMul(a3,0x09);
            s[i+1] = AES128._gfMul(a0,0x09) ^ AES128._gfMul(a1,0x0e) ^ AES128._gfMul(a2,0x0b) ^ AES128._gfMul(a3,0x0d);
            s[i+2] = AES128._gfMul(a0,0x0d) ^ AES128._gfMul(a1,0x09) ^ AES128._gfMul(a2,0x0e) ^ AES128._gfMul(a3,0x0b);
            s[i+3] = AES128._gfMul(a0,0x0b) ^ AES128._gfMul(a1,0x0d) ^ AES128._gfMul(a2,0x09) ^ AES128._gfMul(a3,0x0e);
        }
        return new Uint8Array(s);
    }

    static _decryptBlock(block, rk) {
        const Nr = 10;
        let state = new Uint8Array(16);
        for (let i = 0; i < 16; i++) state[i] = block[i] ^ rk[16*Nr + i];
        for (let r = Nr - 1; r > 0; r--) {
            state = AES128._invShiftRows(state);
            state = AES128._invSubBytes(state);
            for (let i = 0; i < 16; i++) state[i] ^= rk[16*r + i];
            state = AES128._invMixColumns(state);
        }
        state = AES128._invShiftRows(state);
        state = AES128._invSubBytes(state);
        for (let i = 0; i < 16; i++) state[i] ^= rk[i];
        return state;
    }

    static decryptCBC(ciphertext, key, iv) {
        if (key.length !== 16 || iv.length !== 16) throw new Error("Key/IV must be 16 bytes");
        if (ciphertext.length % 16 !== 0) throw new Error("Ciphertext length must be multiple of 16");
        const rk = AES128._expandKey(key);
        const plain = new Uint8Array(ciphertext.length);
        let prev = iv;
        for (let i = 0; i < ciphertext.length; i += 16) {
            const block = ciphertext.slice(i, i + 16);
            const decrypted = AES128._decryptBlock(block, rk);
            for (let j = 0; j < 16; j++) plain[i + j] = decrypted[j] ^ prev[j];
            prev = block;
        }
        // PKCS7 unpad
        const pad = plain[plain.length - 1];
        let result;
        if (pad >= 1 && pad <= 16 && plain.length >= pad) {
            let valid = true;
            for (let i = plain.length - pad; i < plain.length; i++) {
                if (plain[i] !== pad) { valid = false; break; }
            }
            if (valid) result = plain.slice(0, plain.length - pad);
            else result = plain;
        } else {
            result = plain;
        }
        return new TextDecoder("utf-8", { fatal: false }).decode(result);
    }
}

// ======================================================================
//  工具函数
// ======================================================================
function rightPadding(s, ch, length) {
    if (s.length >= length) return s.substring(0, length);
    return s + ch.repeat(length - s.length);
}

function strToBytes(s) {
    return new TextEncoder().encode(s);
}

function hexToBytes(hex) {
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substring(i * 2, i * 2 + 2), 16);
    }
    return bytes;
}

function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

function isJSON(text) {
    if (!text) return false;
    const t = text.trim();
    return t.startsWith("{") || t.startsWith("[");
}

function collapseWhitespace(text) {
    if (!text) return "";
    if (!/\s/.test(text)) return text;
    return text.replace(/\s+/g, " ").trim();
}

// ======================================================================
//  解密逻辑（移植自 Python find_result）
// ======================================================================
function tryDecrypt2423Hex(stripped) {
    const idx2423 = stripped.indexOf("2423");
    const idx2324 = stripped.indexOf("2324");
    if (idx2324 <= idx2423 + 4) throw new Error("hex形态: 结构异常");
    const keyHex = stripped.substring(idx2423 + 4, idx2324);
    // Python: bytes.fromhex(key_hex) —— 无效 hex 时抛 ValueError，fallback 到明文
    // JS: hexToBytes 对无效 hex 返回空 Uint8Array，需手动检测
    const isValidHex = /^[0-9a-fA-F]+$/.test(keyHex) && keyHex.length % 2 === 0;
    let keyRaw;
    if (isValidHex) {
        const kb = hexToBytes(keyHex);
        keyRaw = kb.length > 0
            ? new TextDecoder("latin-1", { fatal: false }).decode(kb)
            : keyHex;
    } else {
        keyRaw = keyHex; // 非 hex 时当作明文（对齐 Python 的 except 分支）
    }
    const keyStr = rightPadding(keyRaw, "0", 16);
    const dataStart = idx2324 + 4;
    const dataEnd = stripped.length - 26;
    if (dataEnd <= dataStart) throw new Error("hex形态: data区间非法");
    const dataHex = stripped.substring(dataStart, dataEnd);
    const contentRstrip = stripped.replace(/\s+$/, "");
    const tsHex = contentRstrip.substring(contentRstrip.length - 26);
    const tsIsValidHex = /^[0-9a-fA-F]+$/.test(tsHex) && tsHex.length % 2 === 0;
    const tsBytes = tsIsValidHex ? hexToBytes(tsHex) : strToBytes(tsHex);
    const ivStr = rightPadding(new TextDecoder("latin-1", { fatal: false }).decode(tsBytes), "0", 16);
    const keyBytes = strToBytes(rightPadding(keyStr, "0", 16)).slice(0, 16);
    const ivBytes = strToBytes(rightPadding(ivStr, "0", 16)).slice(0, 16);
    const cipherBytes = hexToBytes(dataHex.replace(/[^0-9a-fA-F]/g, ""));
    return AES128.decryptCBC(cipherBytes, keyBytes, ivBytes);
}

function tryDecrypt2423Plain(S) {
    const idx2324 = S.indexOf("2324");
    const pDoll = S.indexOf("$#");
    const pSharp = S.indexOf("#$");
    if (idx2324 < 0 || pDoll < 0 || pSharp < 0) throw new Error("plain形态: 分隔符缺失");
    let dataHex = S.substring(idx2324 + 4, pDoll);
    dataHex = dataHex.replace(/[^0-9a-fA-F]/g, "");
    if (dataHex.length % 2 !== 0) dataHex = dataHex.slice(0, -1);
    const key = rightPadding(S.substring(pDoll + 2, pSharp), "0", 16);
    const iv = rightPadding(S.substring(S.length - 13), "0", 16);
    const keyBytes = strToBytes(rightPadding(key, "0", 16)).slice(0, 16);
    const ivBytes = strToBytes(rightPadding(iv, "0", 16)).slice(0, 16);
    const cipherBytes = hexToBytes(dataHex);
    return AES128.decryptCBC(cipherBytes, keyBytes, ivBytes);
}

function findResult(rawText, rawBytes, depth = 0) {
    const content = rawText || (rawBytes ? new TextDecoder("utf-8", { fatal: false }).decode(rawBytes) : "");
    if (isJSON(content)) return content;

    // ** 标记 + base64
    let starIdx = null;
    if (rawBytes) {
        const pos = Array.from(rawBytes).findIndex((b, i) =>
            i >= 8 && b === 0x2a && rawBytes[i - 1] === 0x2a
        );
        if (pos >= 0) starIdx = pos;
    }
    if (starIdx === null) {
        const m = content.match(/[A-Za-z0-9]{8}\*\*/);
        if (m) starIdx = content.indexOf(m[0]) + m[0].length;
    }
    if (starIdx !== null && starIdx >= 0) {
        if (rawBytes) {
            let b64Bytes = rawBytes.slice(starIdx + 2);
            b64Bytes = b64Bytes.filter(b => ![0x09, 0x0a, 0x0d, 0x20].includes(b));
            try {
                const decoded = atob(String.fromCharCode(...b64Bytes));
                return findResult(decoded, null, depth + 1);
            } catch (e) {
                // fallback
            }
        }
    }

    const stripped = collapseWhitespace(content).trim();
    const hasDelim = stripped.includes("$#") && stripped.includes("#$");
    const has2423 = stripped.startsWith("2423") && stripped.includes("2324");

    if (stripped.startsWith("2423") && (hasDelim || has2423)) {
        try { return findResult(tryDecrypt2423Hex(stripped), null, depth + 1); } catch (e1) {
            try { return findResult(tryDecrypt2423Plain(stripped), null, depth + 1); } catch (e2) {
                throw new Error(`2423 双形态均解密失败: hex=${e1.message} / plain=${e2.message}`);
            }
        }
    }

    // 纯 base64 尝试
    const clean = content.replace(/\s/g, "");
    if (/^[A-Za-z0-9+/=]+$/.test(clean) && clean.length > 50) {
        try {
            const decoded = atob(clean);
            if (isJSON(decoded)) return decoded;
        } catch (e) {}
    }

    return content;
}

// ======================================================================
//  JSON 后处理
// ======================================================================
const KEEP_KEYS = new Set(["video", "sites", "lives", "parses", "rules",
    "spider", "wallpaper", "livePlayHeaders", "md5", "name", "homeSite",
    "homeLogo", "homeBg", "homeSearch", "homeRec", "searchable"]);

function filterJSON(text) {
    try {
        const obj = JSON.parse(text);
        if (typeof obj !== "object" || obj === null) return text;
        const filtered = {};
        for (const k of Object.keys(obj)) {
            if (KEEP_KEYS.has(k)) filtered[k] = obj[k];
        }
        return JSON.stringify(Object.keys(filtered).length ? filtered : obj, null, 2);
    } catch (e) {
        return text;
    }
}

function cleanJSONComments(text) {
    if (!text) return text;
    if (text.startsWith("\ufeff")) text = text.slice(1);
    // 简化版注释去除
    let result = "";
    let i = 0;
    let inString = false;
    let stringChar = "";
    let inBlock = false;
    while (i < text.length) {
        const c = text[i];
        const next = text[i + 1];
        if (inBlock) {
            if (c === "*" && next === "/") { inBlock = false; i += 2; continue; }
            i++;
            continue;
        }
        if (inString) {
            if (c === "\\") { result += c + (next || ""); i += 2; continue; }
            if (c === stringChar) { inString = false; }
            result += c;
            i++;
            continue;
        }
        if (c === "/" && next === "/") {
            while (i < text.length && text[i] !== "\n") i++;
            continue;
        }
        if (c === "/" && next === "*") { inBlock = true; i += 2; continue; }
        if (c === '"' || c === "'") { inString = true; stringChar = c; }
        result += c;
        i++;
    }
    return result;
}

function extractJSON(text) {
    if (!text) return text;
    text = cleanJSONComments(text);
    let start = -1, end = -1;
    for (let i = 0; i < text.length; i++) {
        if (text[i] === "{" || text[i] === "[") { start = i; break; }
    }
    if (start === -1) return text;
    for (let i = text.length - 1; i >= 0; i--) {
        if (text[i] === "}" || text[i] === "]") { end = i + 1; break; }
    }
    if (end <= start) return text;
    const candidate = text.substring(start, end);
    try {
        JSON.parse(candidate);
        return candidate;
    } catch (e) {
        return text;
    }
}

// ======================================================================
//  网络请求（浏览器 fetch + CORS 代理）
// ======================================================================
function getProxy() {
    const sel = document.getElementById("proxySelect").value;
    const custom = document.getElementById("customProxy").value.trim();
    return custom || sel;
}

function buildURL(url) {
    const proxy = getProxy();
    if (!proxy) return url;
    return proxy + encodeURIComponent(url);
}

async function fetchURL(url, uaIdx = 0) {
    const proxy = getProxy();
    const fetchUrl = buildURL(url);
    const controller = new AbortController();
    const timeout = parseInt(document.getElementById("timeoutInput").value) * 1000;
    const timer = setTimeout(() => controller.abort(), timeout);

    const headers = {};
    if (!proxy) {
        // 直连时无法自定义 UA（浏览器限制），但可以通过 proxy 转发
    }

    try {
        const resp = await fetch(fetchUrl, {
            method: "GET",
            headers: { "User-Agent": USER_AGENTS[uaIdx % USER_AGENTS.length] },
            signal: controller.signal,
            cache: "no-store",
        });
        clearTimeout(timer);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const text = await resp.text();
        if (text.length < 20) throw new Error("响应过短");
        return { text, bytes: strToBytes(text) };
    } catch (e) {
        clearTimeout(timer);
        throw e;
    }
}

async function tryFetch(urls) {
    const errors = [];
    for (const url of urls) {
        for (let uaIdx = 0; uaIdx < Math.min(2, USER_AGENTS.length); uaIdx++) {
            try {
                const { text, bytes } = await fetchURL(url, uaIdx);
                // 如果是 HTML 首页，跳过
                if (text.trim().startsWith("<")) {
                    errors.push(`${url} -> HTML首页`);
                    break;
                }
                return { text, bytes, url };
            } catch (e) {
                errors.push(`${url} -> ${e.message}`);
                await sleep(300);
            }
        }
    }
    throw new Error(errors.join(" | "));
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}

// ======================================================================
//  单条处理
// ======================================================================
async function processAPI(name, urls) {
    if (typeof urls === "string") urls = [urls];

    // 检查缓存
    const useCache = document.getElementById("useCache").checked;
    if (useCache) {
        const cached = getCache(name);
        if (cached) {
            stats.cache++;
            updateStats();
            log(`💾 [${name}] 使用缓存 (${cached.data.length} 字符)`, "warn");
            return { name, status: "CACHE", content: cached.data, url: "(cached)" };
        }
    }

    const { text, bytes, url } = await tryFetch(urls);
    log(`✓ [${name}] 下载成功 (${bytes.length} 字节) from ${url}`, "ok");

    let decrypted = findResult("", bytes);
    decrypted = extractJSON(decrypted);

    let status, formatted;
    try {
        JSON.parse(decrypted);
        formatted = filterJSON(decrypted);
        status = "JSON";
    } catch (e) {
        formatted = decrypted;
        status = "TEXT";
    }

    // 写入缓存
    if (useCache && status === "JSON") {
        setCache(name, formatted);
    }

    return { name, status, content: formatted, url };
}

// ======================================================================
//  主流程
// ======================================================================
async function startAll() {
    if (isRunning) return;
    isRunning = true;

    const resultsEl = document.getElementById("results");
    resultsEl.innerHTML = "";

    stats = { total: API_LIST.length, ok: 0, fail: 0, cache: 0 };
    updateStats();

    const useMirror = document.getElementById("useMirror").checked;
    let idx = 0;

    for (const [name, url] of API_LIST) {
        if (!isRunning) { log("⏹ 用户停止", "warn"); break; }
        idx++;
        setProgress(idx, API_LIST.length);

        let urls = useMirror ? (API_MIRRORS[name] || [url]) : [url];

        try {
            const result = await processAPI(name, urls);
            stats[result.status === "CACHE" ? "cache" : (result.status === "JSON" ? "ok" : "ok")]++;
            if (result.status === "JSON") stats.ok++;
            updateStats();
            renderResult(result);
        } catch (e) {
            stats.fail++;
            updateStats();
            log(`✗ [${name}] 全部失败: ${e.message}`, "err");
            renderResult({ name, status: "FAIL", content: "", url: "" });
        }

        // 防止浏览器阻塞，让出主线程
        await sleep(50);
    }

    isRunning = false;
    log(`\n===== 完成: 成功 ${stats.ok}, 失败 ${stats.fail}, 缓存 ${stats.cache} =====`, "info");
}

function stopAll() {
    isRunning = false;
}

function renderResult(result) {
    const el = document.getElementById("results");
    const badgeClass = result.status === "JSON" ? "badge-json"
        : result.status === "CACHE" ? "badge-cache"
        : result.status === "TEXT" ? "badge-text" : "badge-fail";
    const shortContent = result.content ? result.content.substring(0, 500) : "";

    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `
        <div>
            <span class="name">${result.name}</span>
            <span class="badge ${badgeClass}">${result.status}</span>
            ${result.url ? `<small style="color:#666"> ${result.url}</small>` : ""}
        </div>
        ${result.content ? `<a href="data:application/json,${encodeURIComponent(result.content)}" download="${result.name}.json">📥 下载</a>` : ""}
    `;
    el.prepend(div);

    if (shortContent) {
        const details = document.createElement("details");
        details.innerHTML = `<summary>${result.name} - 预览</summary><pre>${escapeHtml(shortContent)}</pre>`;
        div.appendChild(details);
    }
}

function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ======================================================================
//  UI 辅助
// ======================================================================
function toggleSettings() {
    document.getElementById("settings").classList.toggle("hidden");
}

function onProxyChange() {
    const val = document.getElementById("proxySelect").value;
    document.getElementById("customProxy").value = "";
    document.getElementById("proxyConfig").style.display = val === "" ? "block" : "none";
}

        const keyStr = rightPadding("mySecretKey123", "0", 16);
        const ts = "1788447203629";
        const ivStr = rightPadding(ts, "0", 16);
        const keyB = strToBytes(keyStr).slice(0, 16);
        const ivB = strToBytes(ivStr).slice(0, 16);

        // 使用 Web Crypto API 验证
        const crypto = window.crypto.subtle;
        crypto.importKey("raw", keyB, "AES-CBC", false, ["encrypt"]).then(k => {
            const plainBytes = strToBytes(plain);
            const padLen = 16 - (plainBytes.length % 16);
            const padded = new Uint8Array(plainBytes.length + padLen);
            padded.set(plainBytes);
            padded.fill(padLen, plainBytes.length);
            return crypto.encrypt({ name: "AES-CBC", iv: ivB }, k, padded);
        }).then(ct => {
            const ctBytes = new Uint8Array(ct);
            const hex = bytesToHex(ctBytes);
            const tsHex = bytesToHex(strToBytes(ts));
            const payload = "2423" + keyStr + "2324" + hex + tsHex;
            const result = findResult(payload);
            const parsed = JSON.parse(result);
            if (parsed.sites[0].key === "demo") {
                log("✓ 测试1: 2423 hex形态解密正确", "ok");

        }).catch(e => log(`✗ 测试1: ${e.message}`, "err"));

        log(`✗ 自测异常: ${e.message}`, "err");
    }
}
