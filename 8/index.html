<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接口解析工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; font-size: 1.5rem; margin-bottom: 1.5rem; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 0.9rem; outline: none; transition: border-color .2s; }
input:focus, textarea:focus { border-color: #38bdf8; }
textarea { min-height: 200px; font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 0.8rem; resize: vertical; }
.row { display: flex; gap: 10px; margin-bottom: 12px; }
button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all .2s; font-weight: 500; }
.btn-primary { background: #38bdf8; color: #0f172a; }
.btn-primary:hover { background: #0ea5e9; }
.btn-success { background: #22c55e; color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-ghost { background: transparent; border: 1px solid #475569; color: #94a3b8; }
.btn-ghost:hover { border-color: #94a3b8; color: #e2e8f0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.tag { padding: 4px 12px; background: #334155; border-radius: 999px; font-size: 0.78rem; cursor: pointer; transition: background .2s; }
.tag:hover { background: #475569; }
#log { background: #0f172a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.75rem; max-height: 200px; overflow-y: auto; margin-top: 12px; }
.log-line { margin-bottom: 4px; }
.log-ok { color: #4ade80; }
.log-err { color: #f87171; }
.log-info { color: #94a3b8; }
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>📦 TVBox 接口解析工具</h1>

  <div class="card">
    <label>快捷标签</label>
    <div class="tags">
      <span class="tag" onclick="setUrl('http://肥猫.net/tv')">肥猫</span>
      <span class="tag" onclick="setUrl('http://www.饭太硬.cc/tv')">饭太硬一线</span>
      <span class="tag" onclick="setUrl('http://www.饭太硬.net/tv')">饭太硬二线</span>
      <span class="tag" onclick="setUrl('http://itv666.cc/aowu/config.webp')">嗷呜</span>
      <span class="tag" onclick="setUrl('https://api.hgyx.vip/hgyx.json')">嗨哥</span>
      <span class="tag" onclick="setUrl('https://play.iptv365.org/香雅情/api.json')">香雅情</span>
      <span class="tag" onclick="setUrl('http://tvbox.王二小放牛娃.top')">王二小</span>
      <span class="tag" onclick="setUrl('https://6800.kstore.vip/fish.json')">摸鱼</span>
    </div>
    <label>接口 URL</label>
    <div class="row">
      <input id="url" type="text" placeholder="https://example.com/api.json 或 http://肥猫.net/tv">
      <button class="btn-primary" onclick="parse()">开始解析</button>
    </div>
    <div id="log"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <label>解析结果（JSON）</label>
    <textarea id="output" readonly></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn-success" onclick="copyResult()">复制结果</button>
      <button class="btn-ghost" onclick="downloadResult()">下载 JSON</button>
    </div>
  </div>
</div>

<script src="aes.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
