<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 接口解析工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; margin-bottom: 10px; color: #38bdf8; }
.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; }
textarea, input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; resize: vertical; }
textarea { min-height: 100px; font-family: monospace; }
button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .2s; }
button:hover { transform: translateY(-1px); }
.btn-primary { background: #38bdf8; color: #0f172a; }
.btn-success { background: #22c55e; color: #fff; }
.btn-copy { background: #8b5cf6; color: #fff; margin-left: 10px; }
.btn-download { background: #f59e0b; color: #fff; margin-left: 10px; }
.btn-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
.log { background: #0f172a; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; }
.log .ok { color: #22c55e; }
.log .err { color: #ef4444; }
.log .info { color: #38bdf8; }
.result-header { display: flex; align-items: center; margin-bottom: 15px; }
.result-header h3 { margin-right: auto; }
#output { min-height: 200px; max-height: 600px; overflow-y: auto; }
.preset-group { margin-bottom: 15px; }
.preset-group h4 { color: #94a3b8; margin-bottom: 8px; }
.preset-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.preset-tag { padding: 6px 12px; background: #334155; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; }
.preset-tag:hover { background: #38bdf8; color: #0f172a; }
</style>
</head>
<body>
<div class="container">
  <h1>📺 TVBox 接口解析工具</h1>
  <p class="subtitle">输入接口 URL → 伪装 TVBox 环境抓取 → 自动解密 → 复制或下载</p>

  <div class="card">
    <label>快捷选择（点击填入）</label>
    <div class="preset-group">
      <h4>影视接口</h4>
      <div class="preset-tags">
        <span class="preset-tag" data-url="http://肥猫.net/tv">肥猫</span>
        <span class="preset-tag" data-url="http://www.饭太硬.cc/tv">饭太硬一线</span>
        <span class="preset-tag" data-url="http://www.饭太硬.net/tv">饭太硬二线</span>
        <span class="preset-tag" data-url="http://itv666.cc/aowu/config.webp">嗷呜</span>
        <span class="preset-tag" data-url="https://play.iptv365.org/香雅情/api.json">香雅情</span>
        <span class="preset-tag" data-url="https://ztha.top/TVBox/thdjk.json">挺好</span>
        <span class="preset-tag" data-url="http://tvbox.王二小放牛娃.top">王二小</span>
        <span class="preset-tag" data-url="https://szyyds.cn/tv/x.json">小马</span>
      </div>
    </div>
    <div class="preset-group">
      <h4>猫源</h4>
      <div class="preset-tags">
        <span class="preset-tag" data-url="http://wexfnw:wexfnw@cat.xn--4kq62z5rby2qupq9ub.top/index.js.md5">牛二猫源</span>
        <span class="preset-tag" data-url="https://9280.kstore.vip/cat/index.js.md5">牛二猫源2</span>
        <span class="preset-tag" data-url="https://raw.githubusercontent.com/Darklessing/catvod/refs/heads/main/xuenai/index.js.md5">雪乃猫源</span>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="urlInput">接口 URL（每行一个可批量）</label>
    <textarea id="urlInput" placeholder="https://example.com/api.json&#10;http://肥猫.net/tv"></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="startParse()">▶ 开始解析</button>
      <button class="btn-success" onclick="clearAll()">清空</button>
    </div>
  </div>

  <div class="card">
    <label>运行日志</label>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="result-header">
      <h3>解析结果</h3>
      <button class="btn-copy" onclick="copyResult()">📋 复制</button>
      <button class="btn-download" onclick="downloadResult()">💾 下载 JSON</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>
</div>

<script src="aes.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
