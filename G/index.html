<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVBox 万能解密</title>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #38bdf8; }
  .sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 24px; }

  #drop {
    border: 2px dashed #334155; border-radius: 16px; padding: 48px 20px;
    text-align: center; cursor: pointer; transition: .2s; background: #1e293b;
    margin-bottom: 20px;
  }
  #drop:hover, #drop.over { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.2); }
  #drop .icon { font-size: 48px; margin-bottom: 12px; }
  #drop .title { font-size: 18px; margin-bottom: 6px; }
  #drop .desc { font-size: 13px; color: #64748b; }

  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h3 { font-size: 15px; color: #94a3b8; margin-bottom: 12px; font-weight: normal; }

  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    background: #0f172a; border: 1px solid #334155; border-radius: 20px;
    padding: 5px 14px; font-size: 12px; color: #94a3b8;
  }
  .chip.ok { color: #4ade80; border-color: #166534; }
  .chip.warn { color: #fbbf24; border-color: #78350f; }

  textarea {
    width: 100%; padding: 12px; background: #0f172a; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px; font-family: monospace;
    font-size: 13px; resize: vertical; min-height: 300px; line-height: 1.5;
    word-break: break-all;
  }
  textarea:focus { outline: none; border-color: #0ea5e9; }

  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    padding: 9px 18px; background: #0ea5e9; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 13px; transition: .2s;
  }
  button:hover { background: #0284c7; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }

  .log { font-family: monospace; font-size: 12px; color: #64748b; line-height: 1.8; max-height: 240px; overflow-y: auto; }
  .log .hit { color: #4ade80; }
  .log .miss { color: #475569; }
  .log .info { color: #38bdf8; }

  .step { padding: 4px 0; border-bottom: 1px solid #1e293b; }
  #preview { max-width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>🔓 TVBox 万能解密</h1>
  <div class="sub">拖入任意文件，自动识别并解密为接口 JSON</div>

  <div id="drop">
    <div class="icon">📂</div>
    <div class="title">拖入文件 / 点击选择</div>
    <div class="desc">任意格式、任意后缀，或直接把加密串粘贴到下方</div>
    <input type="file" id="fileInput" class="hidden">
  </div>

  <div class="card">
    <h3>识别结果</h3>
    <div class="meta" id="meta"></div>
    <textarea id="raw" placeholder="也可以直接在这里粘贴加密内容..."></textarea>
    <div class="btns">
      <button onclick="run()">🚀 开始解密</button>
      <button class="secondary" onclick="clearAll()">🗑 清空</button>
      <button class="secondary" onclick="copyOut()">📋 复制结果</button>
    </div>
  </div>

  <div class="card">
    <h3>解密过程</h3>
    <div class="log" id="log"></div>
  </div>

  <div class="card">
    <h3>明文结果 (TVBox JSON)</h3>
    <textarea id="output" placeholder="解密后的 JSON 会显示在这里..."></textarea>
    <div class="btns">
      <button class="secondary" onclick="formatJson()">🎨 格式化</button>
      <button class="secondary" onclick="downloadJson()">⬇ 下载 JSON</button>
    </div>
  </div>

  <img id="preview" alt="预览">
</div>

<script>
/* ==================================================================
   常见 TVBox 接口密钥字典
   ================================================================== */
const COMMON_KEYS = [
  '', '12345678', '1234567890', '1234567890123456',
  'tvbox', 'TVBox', 'tvbox123', 'tvbox1234', 'tvbox2023', 'tvbox2024', 'tvbox2025',
  'TVBOX', 'TVBOX123', 'tvbox888', 'tvbox666',
  'vbox', 'vbox123', 'VBOX', 'VBOX123',
  '1234', '123456', '0000', '000000', '00000000',
  'abcd1234', 'admin123', 'password', 'qwerty123',
  'tvboxapi', 'tvboxconfig', 'tvboxdemo', 'tvboxpro',
  'caomei', 'caomei123', 'cctv', 'cctv123',
  'fongmi', 'tv', 'TV', 'ds', 'yx', 'xiao',
  '9527', '521', '520', '88888888', '66666666',
  'a1b2c3d4e5f6g7h8', '1qaz2wsx', 'abcdefgh', 'abcdefghijklmnop',
  '0000000000000000', '1111111111111111', '0123456789abcdef',
  '3.1415926535', 'woaini', 'woaini1314', 'iloveyou',
];

/* ==================================================================
   工具
   ================================================================== */
function $(id) { return document.getElementById(id); }

function log(msg, cls) {
  const el = $('log');
  const line = document.createElement('div');
  line.className = 'step';
  const span = document.createElement('span');
  span.className = cls || '';
  span.textContent = msg;
  line.appendChild(span);
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function clearLog() { $('log').innerHTML = ''; }

/* ==================================================================
   文本清理
   目标：只保留能构成 JSON 的字符，删掉一切注释和空白
   ================================================================== */
function cleanText(text) {
  if (!text) return '';
  let t = String(text);

  // 1) 去 BOM
  t = t.replace(/\uFEFF/g, '');

  // 2) 删块注释
  t = t.replace(/\/\*[\s\S]*?\*\//g, '');
  t = t.replace(/<!--[\s\S]*?-->/g, '');

  // 3) 删行注释：逐行处理，避免复杂正则出错
  const lines = t.split('\n');
  const outLines = [];
  for (let line of lines) {
    // 去掉行尾的 // 注释（保护 http:// https://）
    // 策略：找 // 但前面不是 : 的位置
    let idx = -1;
    for (let i = 0; i < line.length - 1; i++) {
      if (line[i] === '/' && line[i+1] === '/') {
        // 检查前一个字符
        const prev = i > 0 ? line[i-1] : '';
        if (prev !== ':') { idx = i; break; }
      }
    }
    if (idx >= 0) line = line.slice(0, idx);
    outLines.push(line);
  }
  t = outLines.join('\n');

  // 4) 删整行以 # 或 ; 开头的行（仅当该行去空白后以这些字符开头）
  t = t.split('\n').filter(line => {
    const trimmed = line.trim();
    if (trimmed.startsWith('#')) return false;
    if (trimmed.startsWith(';')) return false;
    return true;
  }).join('\n');

  // 5) 只保留 JSON 合法字符
  //    合法：{ } [ ] : , " 0-9 . - + e E 字母 _ \ / 以及中文
  //    其余全部删除
  t = t.replace(/[^{}\[\]:,"0-9.\-+eEa-zA-Z_\\\/\u4e00-\u9fa5]/g, '');

  return t;
}

/* ==================================================================
   文件读取
   ================================================================== */
function readAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = () => reject(r.error);
    r.readAsArrayBuffer(file);
  });
}

function isImageBytes(bytes) {
  if (bytes.length < 4) return false;
  const b = bytes;
  if (b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) return 'png';
  if (b[0]===0xFF && b[1]===0xD8 && b[2]===0xFF) return 'jpeg';
  if (b[0]===0x47 && b[1]===0x49 && b[2]===0x46) return 'gif';
  if (b[0]===0x42 && b[1]===0x4D) return 'bmp';
  if (b[0]===0x52 && b[1]===0x49 && b[2]===0x46 && b[3]===0x46 &&
      b[8]===0x57 && b[9]===0x45 && b[10]===0x42 && b[11]===0x50) return 'webp';
  return false;
}

function bytesToText(bytes) {
  const encodings = ['utf-8', 'gbk', 'gb18030', 'big5'];
  for (const enc of encodings) {
    try {
      const txt = new TextDecoder(enc, { fatal: false }).decode(bytes);
      const bad = (txt.match(/\uFFFD/g) || []).length;
      if (bad / Math.max(txt.length, 1) < 0.01) return { text: txt, enc: enc };
    } catch (e) {}
  }
  return { text: new TextDecoder('utf-8').decode(bytes), enc: 'utf-8' };
}

/* ==================================================================
   解密核心
   ================================================================== */
function looksLikeBase64(s) {
  const t = String(s).replace(/\s/g, '');
  if (t.length < 8) return false;
  if (!/^[A-Za-z0-9+/=_-]+$/.test(t)) return false;
  return t.length % 4 === 0 || /[=_-]/.test(t);
}

function b64Decode(str) {
  let s = String(str).replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function b64ToWordArray(str) {
  let s = String(str).replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return CryptoJS.enc.Base64.parse(s);
}

function tryParseJson(text) {
  if (!text) return null;
  let t = String(text).trim().replace(/\uFEFF/g, '');
  try { return JSON.parse(t); } catch (e) {}
  const i = t.indexOf('{'), j = t.lastIndexOf('}');
  if (i >= 0 && j > i) {
    try { return JSON.parse(t.slice(i, j + 1)); } catch (e) {}
  }
  return null;
}

function looksLikeTvBoxJson(obj) {
  if (!obj || typeof obj !== 'object') return false;
  const keys = ['sites','lives','parses','spider','wallpaper','logo','flags','rules','ijk','doh','ads'];
  return keys.some(k => k in obj);
}

function tryDecrypt(cipherText, algo, keyStr, ivStr, mode, pad, keyFmt) {
  const key = keyFmt === 'hex' ? CryptoJS.enc.Hex.parse(keyStr) : CryptoJS.enc.Utf8.parse(keyStr);
  const iv = ivStr
    ? (keyFmt === 'hex' ? CryptoJS.enc.Hex.parse(ivStr) : CryptoJS.enc.Utf8.parse(ivStr))
    : CryptoJS.enc.Hex.parse('0000000000000000');

  let dec;
  try {
    switch (algo) {
      case 'AES':
        dec = CryptoJS.AES.decrypt({ ciphertext: cipherText }, key,
          { iv: iv, mode: CryptoJS.mode[mode], padding: CryptoJS.pad[pad] });
        break;
      case 'DES':
        dec = CryptoJS.DES.decrypt({ ciphertext: cipherText }, key,
          { iv: iv, mode: CryptoJS.mode[mode], padding: CryptoJS.pad[pad] });
        break;
      case 'TripleDES':
        dec = CryptoJS.TripleDES.decrypt({ ciphertext: cipherText }, key,
          { iv: iv, mode: CryptoJS.mode[mode], padding: CryptoJS.pad[pad] });
        break;
      case 'RC4':
        dec = CryptoJS.RC4.decrypt({ ciphertext: cipherText }, key);
        break;
      case 'Rabbit':
        dec = CryptoJS.Rabbit.decrypt({ ciphertext: cipherText }, key,
          { iv: iv, mode: CryptoJS.mode[mode], padding: CryptoJS.pad[pad] });
        break;
      case 'RabbitLegacy':
        dec = CryptoJS.RabbitLegacy.decrypt({ ciphertext: cipherText }, key,
          { iv: iv, mode: CryptoJS.mode[mode], padding: CryptoJS.pad[pad] });
        break;
    }
    if (!dec) return '';
    return dec.toString(CryptoJS.enc.Utf8);
  } catch (e) {
    return '';
  }
}

/* ==================================================================
   主流程
   ================================================================== */
async function handleFile(file) {
  clearLog();
  $('output').value = '';
  $('preview').style.display = 'none';
  $('meta').innerHTML = '';

  try {
    const buf = await readAsArrayBuffer(file);
    const bytes = new Uint8Array(buf);

    const imageType = isImageBytes(bytes);

    addChip('📄 ' + file.name);
    addChip((file.size / 1024).toFixed(1) + ' KB');
    addChip('类型: ' + (file.type || '未知'));

    if (imageType) {
      const blob = new Blob([bytes], { type: 'image/' + imageType });
      $('preview').src = URL.createObjectURL(blob);
      $('preview').style.display = 'block';
      addChip('🖼 图片 (' + imageType + ')', 'warn');
      log('检测到图片文件 (' + imageType + ')，尝试提取隐藏数据', 'info');

      const tailText = bytesToText(bytes).text;
      // 图片二进制里直接找 base64 串
      const b64Match = tailText.match(/[A-Za-z0-9+/=_-]{40,}/);
      if (b64Match) {
        log('在图片中发现疑似 Base64 数据', 'hit');
        $('raw').value = b64Match[0];
        run();
      } else {
        log('图片中未发现可提取的文本数据', 'miss');
      }
      return;
    }

    const result = bytesToText(bytes);
    const text = result.text;
    const enc = result.enc;
    // 判断是否文本：前 1000 字符里是否有大量控制字符
    const sample = text.slice(0, 1000);
    let ctrlCount = 0;
    for (let i = 0; i < sample.length; i++) {
      const c = sample.charCodeAt(i);
      if (c < 32 && c !== 9 && c !== 10 && c !== 13) ctrlCount++;
    }
    const isText = ctrlCount / Math.max(sample.length, 1) < 0.05;

    if (isText) {
      addChip('📝 文本 (' + enc + ')', 'ok');
      const cleaned = cleanText(text);
      const removed = text.length - cleaned.length;
      $('raw').value = cleaned;
      log('按 ' + enc + ' 解码，原始长度 ' + text.length, 'info');
      log('🧹 清理注释与空白：删除 ' + removed + ' 字符，剩余 ' + cleaned.length, 'info');
      run();
    } else {
      addChip('🔢 二进制', 'warn');
      log('文件是二进制格式，尝试按文本解析', 'info');
      const asText = text;
      if (looksLikeBase64(asText)) {
        $('raw').value = cleanText(asText);
        run();
      } else {
        log('二进制内容无法识别为文本', 'miss');
      }
    }
  } catch (e) {
    log('❌ 读取文件出错：' + e.message, 'miss');
  }
}

function addChip(text, cls) {
  const el = document.createElement('span');
  el.className = 'chip ' + (cls || '');
  el.textContent = text;
  $('meta').appendChild(el);
}

function run() {
  const rawValue = $('raw').value;
  const cleaned = cleanText(rawValue);
  if (!cleaned) { log('内容为空', 'miss'); return; }

  if (cleaned !== rawValue) {
    $('raw').value = cleaned;
  }

  clearLog();
  const removed = rawValue.length - cleaned.length;
  if (removed > 0) {
    log('🧹 清理注释与空白：删除 ' + removed + ' 字符', 'info');
  }
  log('输入长度: ' + cleaned.length + ' 字符', 'info');

  const input = cleaned;

  // 第 1 步：本身是 JSON
  const directJson = tryParseJson(input);
  if (directJson) {
    log('✅ 内容本身就是明文 JSON', 'hit');
    showResult(directJson);
    return;
  }

  // 第 2 步：纯 Base64
  if (looksLikeBase64(input)) {
    log('尝试纯 Base64 解码...', 'info');
    try {
      const decoded = b64Decode(input);
      const json = tryParseJson(decoded);
      if (json) {
        log('✅ Base64 解码后得到 JSON', 'hit');
        showResult(json);
        return;
      } else if (decoded && decoded.length > 10) {
        log('Base64 解码成功但非 JSON，作为中间结果继续尝试', 'info');
        const decodedClean = cleanText(decoded);
        if (decodedClean && decodedClean !== input) {
          $('raw').value = decodedClean;
          run();
          return;
        }
      }
    } catch (e) {
      log('Base64 解码失败: ' + e.message, 'miss');
    }
  }

  // 第 3 步：Base64 → 密文，暴力遍历
  let cipherText;
  try {
    cipherText = b64ToWordArray(input);
    log('输入可作为 Base64 密文处理', 'info');
  } catch (e) {
    log('无法作为密文处理: ' + e.message, 'miss');
    return;
  }

  const algos = ['AES', 'DES', 'TripleDES', 'RC4', 'Rabbit', 'RabbitLegacy'];
  const modes = ['CBC', 'ECB', 'CFB', 'OFB', 'CTR'];
  const pads  = ['Pkcs7', 'ZeroPadding', 'NoPadding', 'Iso97971', 'AnsiX923'];
  const keyFmts = ['utf8', 'hex'];

  let tried = 0;
  let hits = [];
  const MAX_TRY = 20000;

  outer:
  for (let ai = 0; ai < algos.length; ai++) {
    const algo = algos[ai];
    for (let ki = 0; ki < COMMON_KEYS.length; ki++) {
      const keyStr = COMMON_KEYS[ki];
      for (let fi = 0; fi < keyFmts.length; fi++) {
        const keyFmt = keyFmts[fi];
        if (keyFmt === 'hex' && (keyStr.length % 2 !== 0 || !/^[0-9a-fA-F]*$/.test(keyStr))) continue;

        const modeList = (algo === 'RC4') ? ['CBC'] : modes;
        const padList  = (algo === 'RC4') ? ['Pkcs7'] : pads;

        for (let mi = 0; mi < modeList.length; mi++) {
          for (let pi = 0; pi < padList.length; pi++) {
            tried++;
            if (tried > MAX_TRY) break outer;

            const out = tryDecrypt(cipherText, algo, keyStr, '', modeList[mi], padList[pi], keyFmt);
            if (!out) continue;

            const json = tryParseJson(out);
            if (json) {
              const isTvbox = looksLikeTvBoxJson(json);
              hits.push({ algo: algo, key: keyStr || '(空)', mode: modeList[mi], pad: padList[pi], keyFmt: keyFmt, json: json, isTvbox: isTvbox });
              log('🎯 命中: ' + algo + ' / key="' + (keyStr || '(空)') + '" / ' + modeList[mi] + ' / ' + padList[pi] + ' / ' + keyFmt + (isTvbox ? ' 【TVBox 特征】' : ''), 'hit');
              if (isTvbox) break outer;
            }
          }
        }
      }
    }
  }

  log('共尝试 ' + tried + ' 种组合，命中 ' + hits.length + ' 个', hits.length ? 'hit' : 'miss');

  if (hits.length === 0) {
    log('❌ 未能自动解密。可能原因：', 'miss');
    log('  • 密钥不在内置字典中', 'miss');
    log('  • 使用了自定义加密方式', 'miss');
    log('  • 数据经过了压缩（gzip/zlib）', 'miss');
    return;
  }

  hits.sort(function(a, b) { return (b.isTvbox ? 1 : 0) - (a.isTvbox ? 1 : 0); });
  showResult(hits[0].json, hits[0]);
}

function showResult(json, meta) {
  $('output').value = JSON.stringify(json, null, 2);
  if (meta) {
    const info = meta.algo + ' | key="' + meta.key + '" | ' + meta.mode + ' | ' + meta.pad + ' | ' + meta.keyFmt;
    addChip('🔑 ' + info, 'ok');
  }
}

/* ==================================================================
   UI 交互
   ================================================================== */
function initUI() {
  const drop = $('drop');
  const fileInput = $('fileInput');

  // 点击区域触发文件选择
  drop.addEventListener('click', function(e) {
    // 避免点到 input 自身时重复触发
    if (e.target !== fileInput) fileInput.click();
  });

  fileInput.addEventListener('change', function(e) {
    if (e.target.files && e.target.files[0]) {
      handleFile(e.target.files[0]);
      // 清空以便再次选择同一个文件也能触发
      e.target.value = '';
    }
  });

  // 拖拽高亮
  drop.addEventListener('dragenter', function(e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragover',  function(e) { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', function(e) { e.preventDefault(); drop.classList.remove('over'); });
  drop.addEventListener('drop', function(e) {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  // 全局拖放（防止浏览器直接打开文件）
  window.addEventListener('dragover', function(e) { e.preventDefault(); });
  window.addEventListener('drop', function(e) {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });
}

function clearAll() {
  $('raw').value = '';
  $('output').value = '';
  $('meta').innerHTML = '';
  $('preview').style.display = 'none';
  clearLog();
}
function copyOut() {
  const el = $('output');
  el.select();
  try { document.execCommand('copy'); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(el.value).catch(function(){});
}
function formatJson() {
  try {
    $('output').value = JSON.stringify(JSON.parse($('output').value), null, 2);
  } catch (e) {}
}
function downloadJson() {
  const blob = new Blob([$('output').value], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tvbox.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

// 页面加载后初始化
window.addEventListener('DOMContentLoaded', initUI);
</script>
</body>
</html>
