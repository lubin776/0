name: "触发下载"

'on':
  workflow_dispatch:
    inputs:
      extract:
        description: '是否解压 (true/false)，会覆盖脚本里的 EXTRACT'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          # 如需临时改链接/路径，取消下面注释即可（脚本优先读环境变量）
          # DOWNLOAD_URL: "https://example.com/xxx.zip"
          # SAVE_DIR: "zip"
          # FILENAME: "tvboxqq.zip"
          EXTRACT: ${{ github.event.inputs.extract }}
        run: python python/download.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 提交整个 zip 目录（含压缩包，以及解压后的文件）
          git add zip/
          git diff --cached --quiet || (git commit -m "chore: 手动下载更新 $(date +'%Y-%m-%d %H:%M')" && git push)
