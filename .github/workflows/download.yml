name: "触发下载"

'on':
  workflow_dispatch:
    inputs:
      url:
        description: '下载链接 (留空则用脚本里的 DOWNLOAD_URL)'
        required: false
        default: 'https://mpimg.cn/down.php/31d75f152d5ac34ee395947b877c21d2.zip'
      save_path:
        description: '保存路径 (相对于仓库根目录)'
        required: false
        default: 'download/奇奇.zip'
      extract:
        description: '是否解压 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          DL_URL: ${{ github.event.inputs.url }}
          DL_SAVE: ${{ github.event.inputs.save_path }}
          DL_EXTRACT: ${{ github.event.inputs.extract }}
        run: python python/download.py

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m "chore: 手动下载更新 $(date +'%Y-%m-%d %H:%M')" && git push)
