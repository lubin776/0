name: TVBox 两日一更

on:
  schedule:
    # 每天北京时间 00:05（UTC 16:05）触发，由 step「gate」按日期奇偶控制，实现每 2 天运行一次
    - cron: "5 16 * * *"

  # 手动触发按钮（便于调试与立即补跑）
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requests / idna 均为可选依赖，安装失败不影响主流程
          pip install requests idna || true

      - name: Skip on off-day (实现两天一次)
        id: gate
        run: |
          # 以 UTC 日期的天数为准：奇数日运行，偶数日跳过
          DAY=$(date -u +%d)
          if [ $((10#$DAY % 2)) -eq 0 ]; then
            echo "今天是偶日(UTC)，跳过本次运行"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "今天是奇日(UTC)，正常执行"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run fetch script
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python tvbox_get_api.py

      - name: Commit & push results
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 仅提交本次生成的产物（按需调整）
          git add tvbox/ list.txt SUMMARY.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每两日自动抓取更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
