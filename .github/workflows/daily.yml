name: 两日一更

on:
  # 每天北京时间 00:05（UTC 16:05）触发，由 gate 步骤按奇偶日控制，实现每 2 天运行一次
  schedule:
    - cron: "5 16 * * *"

  # 保留手动触发，便于调试与立即补跑（手动运行不受奇偶日限制）
  workflow_dispatch:
    inputs:
      debug:
        description: "是否开启调试模式 (--debug)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests idna || true

      - name: Skip on off-day (实现两天一次)
        id: gate
        run: |
          # 以 UTC 日期的天数为准：奇数日运行，偶数日跳过
          DAY=$(date -u +%d)
          if [ $((10#$DAY % 2)) -eq 0 ]; then
            echo "今天是偶日(UTC)，跳过本次运行"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "今天是奇日(UTC)，正常执行"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Run script
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python tvbox_get_api.py --debug
          else
            python tvbox_get_api.py
          fi

      - name: Commit & push results
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tvbox/ list.txt SUMMARY.txt || true
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每两日自动抓取更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
