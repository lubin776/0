name: TVBox 接口每日抓取

# ======================================================================
# 触发方式：
#   1. 每天 北京时间 06:00 定时运行（UTC 22:00 前一天）
#   2. 手动触发（Actions 页面 -> Run workflow）
#   3. 推送代码时自动运行（便于调试）
# ======================================================================
on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch:        # 允许手动触发
  push:
    paths:
      - "工具.py"
      - ".github/workflows/daily.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # 允许提交 api/ 与 user/ 到仓库

    steps:
      # ---- 1. 检出仓库 ----
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---- 2. 准备 Python 环境 ----
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- 3. 安装依赖（脚本零依赖，仅确保 requests）----
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests  # 可选增强；脚本会自动降级 urllib

      # ---- 4. 运行抓取脚本（CI 模式：JSON->api/，报告->user/）----
      - name: Run fetch (--ci)
        run: |
          mkdir -p api user
          python 工具.py --ci --debug

      # ---- 5. 校验产物：至少一个 JSON 成功 ----
      - name: Verify outputs
        run: |
          echo "=== api/ ==="
          ls -la api/ || true
          echo "=== user/ ==="
          ls -la user/ || true
          # 至少存在一个 .json 才允许提交
          if [ -z "$(ls -A api/*.json 2>/dev/null)" ]; then
            echo "::warning:: 本次未抓取到任何 JSON，仍会继续提交报告"
          fi

      # ---- 6. 提交 api/ 与 user/ 到仓库 ----
      - name: Commit & Push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 仅追踪目标目录
          git add api/ user/ || true

          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            TS="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
            git commit -m "chore: 每日抓取更新 (${TS}) [skip ci]"
            git push
          fi
        env:
          TZ: Asia/Shanghai

      # ---- 7. 上传产物（保留 30 天，便于下载查看）----
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-${{ github.run_number }}
          path: |
            api/*.json
            user/SUMMARY.txt
          retention-days: 30
