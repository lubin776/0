name: 每日聚合TVBox直播源

# 权限配置（必须，否则无法push）
permissions:
  contents: write

# 触发条件：每日UTC 18:00（北京时间02:00）+ 手动触发
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

# 并发控制：与其他两个工作流共用同一把锁，排队执行不冲突
concurrency:
  group: tvbox-repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，避免rebase冲突

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests

      - name: 运行Live聚合下载器
        run: python python/live下载器.py

      - name: 配置Git用户
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 提交并推送变更
        run: |
          git add tvbox/ livelist.txt
          # 仅当有变更时才提交
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "每日更新：TVBox直播源（$(date +%Y%m%d)）"
            git pull --rebase --autostash
            git push
          fi
