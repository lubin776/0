<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TVBox 接口与资源站</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f7fa;
    color: #333;
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  header {
    background: linear-gradient(135deg, #4a9eff, #2c7be5);
    color: #fff;
    padding: 20px 16px;
    text-align: center;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(74,158,255,0.3);
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { font-size: 14px; opacity: 0.9; }
  .search-box {
    margin-bottom: 16px;
    position: sticky;
    top: 8px;
    z-index: 10;
    background: #f5f7fa;
    padding: 8px 0;
  }
  .search-box input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 24px;
    font-size: 16px;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: all 0.2s;
  }
  .search-box input:focus { border-color: #4a9eff; box-shadow: 0 2px 12px rgba(74,158,255,0.2); }
  .nav-tabs {
    display: flex;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .nav-tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    font-size: 16px;
    color: #666;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
  }
  .nav-tab.active {
    color: #4a9eff;
    border-bottom-color: #4a9eff;
    background: #f0f7ff;
    font-weight: bold;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .entry {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .entry-name { font-size: 18px; font-weight: bold; color: #2c3e50; word-break: break-all; }
  .entry-meta-inline { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #888; }
  .badge-new { background: #e8f5e9; color: #4caf50; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .badge-old { background: #f5f5f5; color: #999; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .entry-urls { display: flex; flex-direction: column; gap: 8px; }
  .url-line {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f8f9fa;
    padding: 8px 10px;
    border-radius: 8px;
    flex-wrap: wrap;
  }
  .url-tag {
    background: #4a9eff;
    color: #fff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    white-space: nowrap;
  }
  .url-text {
    flex: 1;
    font-size: 13px;
    color: #555;
    word-break: break-all;
    min-width: 0;
  }
  .copy-btn {
    background: #4a9eff;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied { background: #4caf50; }
  .source-section { margin-bottom: 24px; }
  .source-title {
    font-size: 20px;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 8px;
    padding-left: 8px;
    border-left: 4px solid #4a9eff;
  }
  .source-desc { font-size: 13px; color: #888; margin-bottom: 12px; padding-left: 8px; }
  .group-block { margin-bottom: 16px; }
  .group-title {
    font-size: 16px;
    color: #555;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: #eef4ff;
    border-radius: 8px;
    display: inline-block;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .download-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    border-radius: 12px;
    padding: 16px 12px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: all 0.2s;
    cursor: pointer;
  }
  .download-card:active { transform: scale(0.98); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .download-card.hidden { display: none; }
  .card-icon-wrap {
    width: 88px;
    height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    position: relative;
    background: #f0f7ff;
    border-radius: 16px;
    overflow: hidden;
  }
  .card-icon {
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: 12px;
  }
  .card-version-badge {
    position: absolute;
    left: 0;
    bottom: 0;
    background: rgba(44, 123, 229, 0.85);
    color: #fff;
    font-size: 12px;
    padding: 2px 6px;
    border-top-right-radius: 8px;
  }
  .card-info { width: 100%; }
  .card-name {
    font-size: 15px;
    font-weight: bold;
    color: #2c3e50;
    word-break: break-all;
    margin-bottom: 4px;
  }
  .card-version { font-size: 12px; color: #888; }
  .empty, .error-msg, .loading {
    text-align: center;
    padding: 40px 20px;
    color: #888;
    font-size: 16px;
    background: #fff;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  .error-msg { color: #e74c3c; }
  .domain-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8f9fa;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    word-break: break-all;
  }
  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
    .entry-header { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TVBox 接口与资源站</h1>
    <p>海量接口搬运备份 · 仅供测试学习</p>
  </header>
  <div class="search-box">
    <input type="text" id="search" placeholder="🔍 搜索接口或资源..." oninput="globalSearch()">
  </div>
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" data-tab="api" data-hide="0">接口列表</div>
    <div class="nav-tab" data-tab="downloads" data-hide="0">下载资源</div>
    <div class="nav-tab" data-tab="about" data-hide="1">关于本站</div>
  </div>
  <div class="tab-panel active" id="api-panel">
    <div id="listContainer"><div class="loading">⏳ 正在加载接口列表...</div></div>
  </div>
  <div class="tab-panel" id="downloads-panel">
    <div id="downloads-content"><div class="loading">⏳ 正在加载下载资源...</div></div>
  </div>
  <div class="tab-panel" id="about-panel">
    <div class="entry">
      <h3 style="margin-bottom:12px;color:#2c3e50;">关于本站</h3>
      <p>本站提供接口与 TVBox 资源备份，仅供测试学习使用。</p>
      <br>
      <p>整理者：误道者</p>
      <div id="aboutDomains"></div>
      <div id="aboutDecl"></div>
    </div>
  </div>
</div>
<script>
  const DEFAULT_CONFIG = {
    tabs: [
      { id: 'api', name: '接口列表', hideSearch: false },
      { id: 'downloads', name: '下载资源', hideSearch: false },
      { id: 'about', name: '关于本站', hideSearch: true }
    ],
    api: {
      weights: {},
      domains: []
    },
    downloadSources: [],
    about: {
      domains: [],
      declaration: '内容均来自网络，版权归原作者所有。请勿用于商业用途。',
      qqGroup: ''
    }
  };
  let CONFIG = {};

  function bustUrl(url) {
    return url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }

  async function loadConfig() {
    try {
      const res = await fetch(bustUrl('config.json'), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      CONFIG = JSON.parse(text);
    } catch (e) {
      console.warn('config.json 加载失败，使用默认配置', e);
      CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    }
    renderTabs();
    renderApi();
    renderDownloads();
    renderAbout();
  }

  function renderTabs() {
    const tabs = (CONFIG.tabs && CONFIG.tabs.length) ? CONFIG.tabs : DEFAULT_CONFIG.tabs;
    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    tabs.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'nav-tab' + (i === 0 ? ' active' : '');
      el.setAttribute('data-tab', t.id);
      el.setAttribute('data-hide', t.hideSearch ? '1' : '0');
      el.textContent = t.name;
      el.addEventListener('click', function() {
        const target = this.getAttribute('data-tab');
        const hide = this.getAttribute('data-hide') === '1';
        nav.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        showPanel(target, hide);
      });
      nav.appendChild(el);
    });
    // 默认激活接口列表
    const defaultTab = tabs.find(t => t.id === 'api') || tabs[0];
    showPanel(defaultTab.id, defaultTab.hideSearch);
  }

  function showPanel(tabId, hideSearch) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById(tabId + '-panel') || document.getElementById(tabId);
    if (panel) panel.classList.add('active');
    const searchBox = document.getElementById('search');
    if (searchBox) searchBox.style.display = (hideSearch ? 'none' : '');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function globalSearch() {
    const kw = document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('#api-panel .entry').forEach(entry => {
      const name = entry.getAttribute('data-name') || '';
      entry.classList.toggle('hidden', !name.includes(kw));
    });
    document.querySelectorAll('.download-card').forEach(card => {
      const name = card.getAttribute('data-name') || '';
      card.classList.toggle('hidden', !name.includes(kw));
    });
  }

  function bindCopyEvents(container) {
    container.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const url = this.getAttribute('data-url');
        if (!url) return;
        const done = () => {
          const orig = this.textContent;
          this.textContent = '✅ 已复制';
          this.classList.add('copied');
          setTimeout(() => { this.textContent = orig; this.classList.remove('copied'); }, 1500);
        };
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(done).catch(fallback);
        } else { fallback(); }
        function fallback() {
          const input = document.createElement('input');
          input.value = url; document.body.appendChild(input);
          input.select(); document.execCommand('copy');
          document.body.removeChild(input); done();
        }
      });
    });
  }

  function renderApi() {
    const apiCfg = (CONFIG && CONFIG.api) ? CONFIG.api : DEFAULT_CONFIG.api;
    const WEIGHTS = apiCfg.weights || {};
    const DOMAINS = apiCfg.domains || [];
    const staticEntries = `
<div class="entry" data-name="更新专用接口">
  <div class="entry-header">
    <div class="entry-name" title="更新专用接口">更新专用接口</div>
    <div class="entry-meta-inline">
      <span class="meta-item"><span class="badge-new">备份时间 2026年09月09日</span></span>
      <span class="meta-item">4.2K</span>
    </div>
  </div>
  <div class="entry-urls">
    <div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">https://0.12yue.de5.net/0/666</span><button class="copy-btn" data-url="https://0.12yue.de5.net/0/666">复制</button></div>
    ${DOMAINS.map(d => `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${d.base}更新专用接口.json</span><button class="copy-btn" data-url="${d.base}更新专用接口.json">复制</button></div>`).join('')}
  </div>
</div>`;
    function decodeName(str) { try { return decodeURIComponent(str); } catch(_) { return str; } }
    function isRecent(dateStr) {
      if (!dateStr || dateStr.length !== 8) return false;
      const y = parseInt(dateStr.slice(0,4),10), m = parseInt(dateStr.slice(4,6),10)-1, d = parseInt(dateStr.slice(6,8),10);
      return (Date.now() - new Date(y,m,d).getTime()) / 86400000 <= 2;
    }
    function formatDateToChinese(d) {
      if (!d || d.length !== 8) return '----';
      return `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日`;
    }
    function renderEntry(file, date, size, note, origUrl) {
      const decodedFile = decodeName(file);
      const displayName = decodedFile.replace(/\.json$/i, '');
      const isNew = isRecent(date);
      const newClass = isNew ? 'badge-new' : 'badge-old';
      const headerHtml = `<div class="entry-header"><div class="entry-name" title="${displayName}">${displayName}</div><div class="entry-meta-inline"><span class="meta-item"><span class="${newClass}">备份时间 ${formatDateToChinese(date)}</span></span><span class="meta-item">${size||'-'}</span></div></div>`;
      let lines = '';
      if (origUrl) lines += `<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${origUrl}</span><button class="copy-btn" data-url="${origUrl}">复制</button></div>`;
      DOMAINS.forEach(domain => {
        const fullUrl = domain.base + decodedFile;
        lines += `<div class="url-line"><span class="url-tag">${domain.tag}</span><span class="url-text">${fullUrl}</span><button class="copy-btn" data-url="${fullUrl}">复制</button></div>`;
      });
      return `<div class="entry" data-name="${displayName.toLowerCase()}">${headerHtml}<div class="entry-urls">${lines}</div></div>`;
    }
    const container = document.getElementById('listContainer');
    fetch(bustUrl('list.txt'), { cache: 'no-store' })
      .then(res => res.ok ? res.text() : Promise.reject('HTTP ' + res.status))
      .then(text => {
        const dataMap = {};
        text.trim().split('\n').filter(l => l.trim()).forEach(line => {
          const parts = line.split('|').map(s => s.trim());
          if (parts[0]) dataMap[parts[0]] = { date: parts[1]||'', size: parts[2]||'', origUrl: parts[3]||'', note: parts[4]||'' };
        });
        const entries = Object.entries(dataMap);
        if (!entries.length) {
          container.innerHTML = staticEntries + '<div class="empty">📭 暂无接口数据</div>';
          bindCopyEvents(container); return;
        }
        let items = entries.map(([file, info]) => ({
          file, date: info.date||'', size: info.size||'', note: info.note||'', origUrl: info.origUrl||'',
          weight: WEIGHTS[file] !== undefined ? WEIGHTS[file] : null,
        }));
        items.sort((a, b) => {
          if (a.weight !== null && b.weight !== null) return a.weight - b.weight;
          if (a.weight !== null) return -1; if (b.weight !== null) return 1;
          return Math.random() - 0.5;
        });
        let html = staticEntries;
        items.forEach(item => { html += renderEntry(item.file, item.date, item.size, item.note, item.origUrl); });
        container.innerHTML = html;
        bindCopyEvents(container);
      })
      .catch(err => {
        container.innerHTML = staticEntries + `<div class="error-msg">❌ 接口加载失败：${err}</div>`;
        bindCopyEvents(container);
      });
  }

  async function renderDownloads() {
    const container = document.getElementById('downloads-content');
    if (!container) return;
    container.innerHTML = '<div class="loading">⏳ 正在加载下载资源...</div>';
    const sources = (CONFIG && CONFIG.downloadSources && CONFIG.downloadSources.length)
      ? CONFIG.downloadSources
      : DEFAULT_CONFIG.downloadSources;
    const placeholder = "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNzIiIGhlaWdodD0iNzIiIHZpZXdCb3g9IjAgMCA3MiA3MiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNzIiIGhlaWdodD0iNzIiIHJ4PSIxMiIgZmlsbD0iI0U1RTlFRiIvPjxwYXRoIGQ9Ik0zNiA0MkwyOCAzNEg0NEwzNiA0MloiIGZpbGw9IiNCRkM0REMvPjwvc3ZnPg==";
    function cleanJSON(text) {
      return text.replace(/[\u201c\u201d]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/：/g, ':').replace(/，/g, ',');
    }
    function cardHtml(item) {
      return `<a class="download-card" href="${item.url || '#'}" target="_blank" rel="noopener noreferrer" data-name="${(item.name||'').toLowerCase()} ${(item.version||'').toLowerCase()}">
        <div class="card-icon-wrap">
          <img class="card-icon" src="${item.icon || placeholder}" alt="${item.name||''}" referrerpolicy="no-referrer" onerror="this.src='${placeholder}'">
          ${item.version ? `<div class="card-version-badge">${item.version}</div>` : ''}
        </div>
        <div class="card-info">
          <div class="card-name">${item.name || '未命名'}</div>
        </div>
      </a>`;
    }
    try {
      let allHtml = '';
      for (const source of sources) {
        try {
          const res = await fetch(bustUrl(source.url), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          let text = await res.text();
          let data;
          try { data = JSON.parse(cleanJSON(text)); }
          catch (e) { throw new Error('JSON解析失败：' + e.message + '（请检查引号是否为英文）'); }
          if (!Array.isArray(data)) throw new Error('根必须是数组');
          let section = `<div class="source-section">`;
          if (source.name) section += `<div class="source-title">${source.name}</div>`;
          if (source.description) section += `<div class="source-desc">${source.description}</div>`;
          data.forEach(group => {
            section += `<div class="group-block">
              <div class="group-title">${group.name || '未命名'}</div>
              <div class="cards-grid">`;
            (group.list || []).forEach(item => { section += cardHtml(item); });
            section += `</div></div>`;
          });
          section += `</div>`;
          allHtml += section;
        } catch (err) {
          allHtml += `<div class="source-section">
            <div class="source-title">${source.name || '下载源'}</div>
            <div class="error-msg">❌ ${source.url} 加载失败：${err.message}</div>
          </div>`;
        }
      }
      container.innerHTML = allHtml || '<div class="empty">📭 未配置下载源</div>';
    } catch (e) {
      container.innerHTML = `<div class="error-msg">❌ 渲染失败：${e.message}</div>`;
    }
  }

  function renderAbout() {
    const about = (CONFIG && CONFIG.about) ? CONFIG.about : DEFAULT_CONFIG.about;
    const domainsEl = document.getElementById('aboutDomains');
    if (domainsEl) {
      let html = `<h3>🌐 备份线路域名</h3><p style="margin-bottom:6px;">三个域名互为备份，任一个可用：</p>`;
      (about.domains || []).forEach(d => {
        html += `<div class="domain-line"><span>${d}</span><button class="copy-btn" data-url="${d}">复制</button></div>`;
      });
      domainsEl.innerHTML = html;
      bindCopyEvents(domainsEl);
    }
    const declEl = document.getElementById('aboutDecl');
    if (declEl) {
      declEl.innerHTML = `<h3>📢 声明与联系</h3>
        <ul><li>${about.declaration || ''}</li></ul>
        <p style="margin-top:10px;">QQ 交流群：<strong style="color:#4a9eff;">${about.qqGroup || ''}</strong></p>`;
    }
  }

  loadConfig();
</script>
</body>
</html>
