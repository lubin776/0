<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>加载中...</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fa; color: #1e293b;
        padding: 16px 12px 8px;
    }
    .container { max-width: 820px; margin: 0 auto; position: relative; }

    #modeToggleBtn {
        position: absolute; top: 12px; left: 8px; z-index: 999;
        width: 52px; padding: 4px 2px; border-radius: 12px;
        border: 1px solid #4a9eff; background: #fff; color: #4a9eff;
        font-size: 0.6rem; line-height: 1.25; text-align: center;
        cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .header-block { text-align: center; margin-bottom: 12px; padding-top: 12px; }
    h1 { font-size: 1.3rem; font-weight: 600; color: #0b1e33; }
    h1 .header-logo {
        width: 1.8rem; height: 1.8rem; border-radius: 50%;
        border: 1.5px solid #4a9eff; object-fit: cover;
        vertical-align: -0.45rem; margin-right: 6px;
    }
    .header-divider { height: 1px; background: #e9edf2; margin: 10px 0; }
    .subtitle { font-size: 0.8rem; color: #8b9eb0; line-height: 1.5; }

    .main-card {
        background: #ffffff; border-radius: 16px;
        padding: 16px 18px 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #f0f3f8;
    }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
    .nav-tab {
        padding: 7px 24px; border: 1.5px solid #4a9eff;
        border-radius: 40px; background: #fff; color: #4a9eff;
        font-size: 0.82rem; font-weight: 500; cursor: pointer;
    }
    .nav-tab.active { background: #4a9eff; color: #fff; }

    .search-box {
        width: 100%; padding: 12px 16px;
        border: 1px solid #dce1e9; border-radius: 40px;
        font-size: 0.95rem; background: #fff; outline: none; margin-bottom: 12px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .api-list { padding: 0; }
    .entry { padding: 16px 0; border-bottom: 1px solid #f0f4fa; }
    .entry:last-child { border-bottom: none; }
    .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .entry-name { font-size: 1.05rem; font-weight: 600; color: #0b1e33; }
    .entry-meta-inline { margin-left: auto; font-size: 0.75rem; color: #5a6f88; }
    .url-line {
        padding: 5px 12px; margin-bottom: 6px;
        background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7;
        display: flex; align-items: center; gap: 10px;
    }
    .url-tag {
        font-size: 0.7rem; background: #e6edf6; padding: 0 12px;
        border-radius: 30px; line-height: 24px; white-space: nowrap;
    }
    .url-text { font-size: 0.82rem; color: #2563eb; word-break: break-all; flex: 1; }
    .copy-btn {
        background: #4a9eff; color: white; border: none; border-radius: 30px;
        padding: 0 14px; font-size: 0.7rem; height: 26px; cursor: pointer; flex-shrink: 0;
    }

    .loading, .empty { text-align: center; color: #9aadc2; padding: 48px 0; }

    .about-inner { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .about-inner h3 { font-size: 0.92rem; font-weight: 600; margin-bottom: 8px; }
    .about-inner p, .about-inner li { font-size: 0.76rem; color: #5a6f88; line-height: 1.6; }
    .domain-line { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #fff; border-radius: 40px; border: 1px solid #e0e6ed; margin-top: 6px; }
    .domain-line span { flex: 1; font-size: 0.75rem; color: #2563eb; word-break: break-all; }

    .page-footer { text-align: center; padding: 20px 0 8px; font-size: 0.72rem; color: #9aadc2; line-height: 1.8; }

    body.simple-mode .nav-tabs { display: none !important; }
    body.simple-mode #download-panel, body.simple-mode #about-panel { display: none !important; }
    body.simple-mode #api-panel { display: block !important; }
</style>
</head>
<body class="simple-mode">

<div class="container">
    <button id="modeToggleBtn">切换<br>全能版</button>
    <div class="header-block">
        <h1 id="siteTitle"></h1>
        <div class="header-divider"></div>
        <p class="subtitle" id="siteSubtitle"></p>
    </div>
    <input class="search-box" id="search" type="text" placeholder="🔍 搜索..." oninput="globalSearch()">
    <div class="main-card">
        <div class="nav-tabs" id="navTabs"></div>
        <div class="tab-panel active" id="api-panel">
            <div class="api-list" id="listContainer">
                <div class="loading" id="apiLoading">⏳ 正在加载接口列表...</div>
            </div>
        </div>
        <div class="tab-panel" id="download-panel">
            <div id="downloads-content"><div class="loading">⏳ 正在加载下载资源...</div></div>
        </div>
        <div class="tab-panel" id="about-panel">
            <div class="about-inner" id="aboutDomains"></div>
            <div class="about-inner" id="aboutDecl"></div>
        </div>
    </div>
    <footer class="page-footer" id="footerText"></footer>
</div>

<script>
let CONFIG = null;

// ========== 加载配置 ==========
async function loadConfig() {
    try {
        const res = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
        CONFIG = await res.json();
    } catch (e) {
        console.error('config.json 加载失败', e);
        return;
    }
    applyConfig();
    renderTabs();
    renderApi();
    if (document.body.classList.contains('simple-mode') === false) {
        renderDownloads(true);
        renderAbout(true);
    }
}

// ========== 应用配置到页面 ==========
function applyConfig() {
    const s = CONFIG.site;
    document.title = s.title;
    document.getElementById('siteTitle').innerHTML = `<img class="header-logo" src="${s.logo}"><span>${s.title}</span>`;
    document.getElementById('siteSubtitle').innerHTML = `${s.subtitle}<br>QQ交流群：${s.qqGroup}`;
    document.getElementById('footerText').innerHTML = `<p>${CONFIG.about.declaration} QQ 群：${CONFIG.about.qqGroup}</p>`;
}

// ========== 导航标签 ==========
function renderTabs() {
    const nav = document.getElementById('navTabs');
    nav.innerHTML = CONFIG.tabs.map(t =>
        `<button class="nav-tab ${t.id === 'api' ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    nav.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            nav.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(this.getAttribute('data-tab') + '-panel').classList.add('active');
        });
    });
}

// ========== 接口列表 ==========
function renderApi() {
    const container = document.getElementById('listContainer');
    const loadingTip = document.getElementById('apiLoading');
    if (loadingTip) loadingTip.style.display = 'none';

    fetch('list.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(res => res.text())
        .then(text => {
            const lines = text.trim().split('\n').filter(l => l.trim());
            const weights = CONFIG.api.weights || {};
            const domains = CONFIG.api.domains || [];

            let items = lines.map(line => {
                const parts = line.split('|').map(s => s.trim());
                return { file: parts[0], date: parts[1], size: parts[2], origUrl: parts[3], weight: weights[parts[0]] ?? 999 };
            });
            items.sort((a, b) => a.weight - b.weight);

            container.innerHTML = items.map(item => {
                const name = item.file.replace(/\.json$/i, '');
                let html = `<div class="entry" data-name="${name.toLowerCase()}">
                    <div class="entry-header">
                        <div class="entry-name">${name}</div>
                        <div class="entry-meta-inline">${item.date || ''} ${item.size || ''}</div>
                    </div>
                    <div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${item.origUrl}</span><button class="copy-btn" data-url="${item.origUrl}">复制</button></div>`;
                domains.forEach(d => {
                    html += `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${d.base + item.file}</span><button class="copy-btn" data-url="${d.base + item.file}">复制</button></div>`;
                });
                html += `</div>`;
                return html;
            }).join('');
            bindCopy();
        })
        .catch(err => {
            container.innerHTML = `<div class="loading">❌ 加载失败：${err}</div>`;
        });
}

// ========== 下载资源 ==========
async function renderDownloads() {
    const container = document.getElementById('downloads-content');
    container.innerHTML = '<div class="loading">⏳ 正在加载...</div>';
    let html = '';
    for (const src of CONFIG.downloadSources) {
        try {
            const res = await fetch(src.url + '?t=' + Date.now());
            const data = await res.json();
            html += `<div class="about-inner"><h3>${src.name}</h3><p>${src.description}</p>`;
            data.forEach(group => {
                html += `<h4 style="margin:10px 0 6px;">${group.name}</h4>`;
                group.list.forEach(item => {
                    html += `<div class="url-line"><span class="url-text">${item.name}</span><a class="copy-btn" href="${item.url}" target="_blank">下载</a></div>`;
                });
            });
            html += `</div>`;
        } catch(e) {
            html += `<div class="loading">❌ ${src.name} 加载失败</div>`;
        }
    }
    container.innerHTML = html;
}

// ========== 关于 ==========
function renderAbout() {
    const about = CONFIG.about;
    document.getElementById('aboutDomains').innerHTML = `<h3>🌐 备份线路域名</h3>` +
        about.domains.map(d => `<div class="domain-line"><span>${d}</span><button class="copy-btn" data-url="${d}">复制</button></div>`).join('');
    document.getElementById('aboutDecl').innerHTML = `<h3>📢 声明</h3><p>${about.declaration}</p><p style="margin-top:8px;">QQ群：${about.qqGroup}</p>`;
    bindCopy();
}

// ========== 复制功能 ==========
function bindCopy() {
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const url = this.getAttribute('data-url');
            if (!url) return;
            navigator.clipboard?.writeText(url);
            this.textContent = '✅';
            setTimeout(() => this.textContent = '复制', 1500);
        });
    });
}

// ========== 搜索 ==========
function globalSearch() {
    const kw = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.entry').forEach(e => {
        e.style.display = e.getAttribute('data-name').includes(kw) ? '' : 'none';
    });
}

// ========== 模式切换 ==========
const btn = document.getElementById('modeToggleBtn');
btn.addEventListener('click', () => {
    const isSimple = document.body.classList.contains('simple-mode');
    document.body.className = isSimple ? '' : 'simple-mode';
    btn.innerHTML = isSimple ? '切换<br>简洁版' : '切换<br>全能版';
    if (isSimple) {
        renderDownloads();
        renderAbout();
    }
});

// 启动
loadConfig();
</script>
</body>
</html>
