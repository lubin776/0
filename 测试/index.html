<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>接口备份站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 14px 12px 8px;
        }
        .container { max-width: 820px; margin: 0 auto; }

        /* ===== 模块一：标题 ===== */
        .header-block { text-align: center; margin-bottom: 14px; }
        h1 { font-size: 1.3rem; font-weight: 600; color: #0b1e33; }
        h1 .header-logo {
            width: 1.8rem; height: 1.8rem; border-radius: 50%;
            border: 1.5px solid #4a9eff; object-fit: cover;
            vertical-align: -0.45rem; margin-right: 6px;
        }
        .header-divider { height: 1px; background: #e9edf2; margin: 6px 0; }
        .subtitle { font-size: 0.78rem; color: #8b9eb0; line-height: 1.45; }

        /* ===== 模块二：主卡片 ===== */
        .main-card {
            background: #ffffff; border-radius: 16px; padding: 14px 16px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f3f8;
        }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
        .nav-tab {
            padding: 7px 24px; border: 1.5px solid #4a9eff; border-radius: 40px;
            background: #fff; color: #4a9eff; font-size: 0.82rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .nav-tab.active { background: #4a9eff; color: #fff; }
        .nav-tab:active { transform: scale(0.96); }

        .search-box {
            width: 100%; padding: 10px 16px; border: 1px solid #dce1e9;
            border-radius: 40px; font-size: 0.92rem; background: #fff; outline: none;
            transition: 0.2s; margin-bottom: 12px;
        }
        .search-box:focus { border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.15); }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ===== 通用内容区底色 ===== */
        .panel-box { background: #f8fafc; border-radius: 12px; padding: 4px 12px; border: 1px solid #eef2f7; }

        /* ===== 接口条目 ===== */
        .entry { padding: 12px 0; border-bottom: 1px solid #e8eef5; }
        .entry:last-child { border-bottom: none; }
        .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .entry-name {
            font-size: 1.02rem; font-weight: 600; color: #0b1e33;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0;
        }
        .entry-meta-inline {
            margin-left: auto; display: flex; align-items: center; gap: 10px;
            font-size: 0.72rem; color: #5a6f88; white-space: nowrap; flex-shrink: 0;
        }
        .entry-meta-inline .meta-item { display: inline-block; padding: 0 2px; }
        .badge-new { color: #1b9e5a; }
        .badge-old { color: #b88b3a; }
        .entry-urls { display: block; }
        .url-line {
            padding: 4px 12px 4px 10px; margin-bottom: 5px; background: #fff;
            border-radius: 40px; border: 1px solid #e0e6ed;
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
        }
        .url-line:last-child { margin-bottom: 0; }
        .url-tag {
            font-size: 0.68rem; font-weight: 500; color: #4a6a8a; background: #e6edf6;
            padding: 0 12px; border-radius: 30px; line-height: 22px; white-space: nowrap; flex-shrink: 0;
        }
        .url-text {
            font-size: 0.8rem; color: #2563eb; word-break: break-all;
            overflow-wrap: break-word; white-space: normal; line-height: 1.45; flex: 1 1 0; min-width: 40px;
        }
        .copy-btn {
            flex-shrink: 0; background: #4a9eff; color: #fff; border: none; border-radius: 30px;
            padding: 0 14px; font-size: 0.68rem; font-weight: 500; cursor: pointer;
            height: 24px; line-height: 24px; transition: background 0.15s, transform 0.05s; white-space: nowrap; margin-left: auto;
        }
        .copy-btn:active { background: #2a7ed9; transform: scale(0.96); }
        .copy-btn.copied { background: #3b9b6c; }
        .loading, .empty { text-align: center; color: #9aadc2; padding: 36px 0; font-size: 0.88rem; }
        .entry.hidden, .download-card.hidden { display: none; }

        /* ===== 下载模块 ===== */
        .source-module {
            background: #fff; border-radius: 10px; padding: 12px 14px;
            margin-bottom: 10px; border: 1px solid #e8eef5;
        }
        .source-module:last-child { margin-bottom: 0; }
        .source-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .source-name { font-size: 0.92rem; font-weight: 600; color: #0b1e33; }
        .source-desc { font-size: 0.68rem; color: #8b9eb0; }
        .source-section-label { font-size: 0.78rem; color: #5a6f88; margin: 8px 0 6px; }
        .source-divider { height: 1px; background: #e0e6ed; margin: 8px 0; }
        .download-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .download-card {
            background: #f8fafc; border-radius: 10px; padding: 12px 10px; text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03); border: 1px solid #eef2f7; transition: transform 0.15s;
        }
        .download-card:active { transform: scale(0.97); }
        .download-card img { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 6px; object-fit: cover; }
        .download-card .app-name {
            font-size: 0.75rem; font-weight: 500; color: #1e293b; margin-bottom: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .download-card .app-version { font-size: 0.6rem; color: #8b9eb0; margin-bottom: 8px; }
        .download-card a {
            display: inline-block; background: #4a9eff; color: #fff; font-size: 0.65rem;
            padding: 4px 14px; border-radius: 20px; text-decoration: none; font-weight: 500;
        }
        .download-card a:active { background: #2a7ed9; }

        /* ===== 关于 ===== */
        .about-inner { background: #fff; border-radius: 10px; padding: 14px 16px; border: 1px solid #e8eef5; margin-bottom: 10px; }
        .about-inner:last-child { margin-bottom: 0; }
        .about-inner h3 { font-size: 0.92rem; font-weight: 600; color: #0b1e33; margin-bottom: 8px; }
        .about-inner p, .about-inner li { font-size: 0.76rem; color: #5a6f88; line-height: 1.6; }
        .about-inner ul { padding-left: 16px; margin-top: 4px; }
        .domain-line {
            display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #f8fafc;
            border-radius: 40px; border: 1px solid #eef2f7; margin-top: 6px;
        }
        .domain-line span { flex: 1; font-size: 0.75rem; color: #2563eb; word-break: break-all; }

        .page-footer { text-align: center; padding: 14px 0 6px; font-size: 0.7rem; color: #9aadc2; line-height: 1.7; }

        @media (max-width: 600px) {
            body { padding: 10px 6px 4px; }
            h1 .header-logo { width: 1.6rem; height: 1.6rem; vertical-align: -0.4rem; }
            .main-card { padding: 12px 10px 10px; }
            .nav-tab { padding: 6px 20px; font-size: 0.78rem; }
            .panel-box { padding: 4px 8px; }
            .entry { padding: 10px 0; }
            .entry-header { gap: 6px; margin-bottom: 5px; }
            .entry-name { font-size: 0.95rem; }
            .entry-meta-inline { font-size: 0.66rem; gap: 6px; }
            .url-line { padding: 3px 8px; gap: 4px 6px; }
            .url-tag { font-size: 0.62rem; padding: 0 10px; line-height: 20px; }
            .url-text { font-size: 0.73rem; }
            .copy-btn { font-size: 0.62rem; padding: 0 10px; height: 22px; line-height: 22px; }
            .page-footer { font-size: 0.66rem; padding: 12px 0 4px; }
            .download-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        }
        @media (max-width: 420px) {
            h1 .header-logo { width: 1.4rem; height: 1.4rem; vertical-align: -0.35rem; }
            .nav-tab { padding: 5px 16px; font-size: 0.72rem; }
            .entry { padding: 8px 0; }
            .entry-name { font-size: 0.88rem; }
            .entry-meta-inline { font-size: 0.6rem; gap: 4px; }
            .url-line { padding: 3px 6px; gap: 3px 4px; }
            .url-tag { font-size: 0.55rem; padding: 0 8px; line-height: 18px; }
            .url-text { font-size: 0.68rem; }
            .copy-btn { font-size: 0.55rem; padding: 0 8px; height: 20px; line-height: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 模块一：标题（由 config.json 填充） -->
        <div class="header-block" id="headerBlock"></div>

        <!-- 模块二：主卡片 -->
        <div class="main-card">
            <div class="nav-tabs" id="navTabs"></div>
            <input class="search-box" id="search" type="text" oninput="globalSearch()">

            <!-- 各面板容器（数量/内容由 config.json 驱动） -->
            <div id="panels"></div>
        </div>

        <footer class="page-footer" id="footer"></footer>
    </div>

    <script>
        // ===== 全局配置（先从 config.json 读取） =====
        let CONFIG = null;

        // 默认兜底配置（config.json 加载失败时用）
        const DEFAULT_CONFIG = {
            site: {
                title: "海量接口搬运备份",
                logo: "https://0.12yue.de5.net/tvbox/x/jueson.jpg",
                subtitle: "备用数据源，防屏不迷路<br>QQ交流群：1067685939",
            },
            footer: "",
            tabs: [
                { id: "api", label: "接口" },
                { id: "download", label: "下载" },
                { id: "about", label: "关于" }
            ],
            api: { listFile: "list.txt", domains: [], staticEntries: "" },
            downloadSources: [],
            about: { domains: [], declarations: [], qq: "" }
        };

        // ===== 工具 =====
        function el(html) {
            const t = document.createElement('template');
            t.innerHTML = html.trim();
            return t.content.firstElementChild;
        }

        function bindCopy(container) {
            container.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const url = this.getAttribute('data-url');
                    if (!url) return;
                    const done = () => {
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = orig; this.classList.remove('copied'); }, 1500);
                    };
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(url).then(done).catch(() => fallback());
                    } else { fallback(); }
                    function fallback() {
                        const input = document.createElement('input');
                        input.value = url;
                        document.body.appendChild(input);
                        input.select();
                        document.execCommand('copy');
                        document.body.removeChild(input);
                        done();
                    }
                });
            });
        }

        // ===== 渲染标题模块 =====
        function renderHeader() {
            const s = CONFIG.site;
            document.title = s.title || "接口备份站";
            const block = document.getElementById('headerBlock');
            block.innerHTML = `
                <h1><img class="header-logo" src="${s.logo || ''}" alt="Logo">${s.title || ''}</h1>
                <div class="header-divider"></div>
                <p class="subtitle">${s.subtitle || ''}</p>
            `;
        }

        // ===== 渲染导航 + 面板骨架 =====
        function renderTabs() {
            const tabs = CONFIG.tabs || [];
            const nav = document.getElementById('navTabs');
            const panels = document.getElementById('panels');
            nav.innerHTML = '';
            panels.innerHTML = '';

            tabs.forEach((tab, idx) => {
                // 导航按钮
                const btn = el(`<button class="nav-tab ${idx === 0 ? 'active' : ''}" data-tab="${tab.id}">${tab.label}</button>`);
                nav.appendChild(btn);

                // 面板容器
                const panel = el(`<div class="tab-panel ${idx === 0 ? 'active' : ''}" id="panel-${tab.id}"></div>`);
                panels.appendChild(panel);
            });

            // 绑定切换
            nav.querySelectorAll('.nav-tab').forEach(b => {
                b.addEventListener('click', () => {
                    const id = b.getAttribute('data-tab');
                    nav.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    panels.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                    document.getElementById('panel-' + id).classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    // 关于类面板隐藏搜索框（通过 tab 配置控制）
                    const tabCfg = CONFIG.tabs.find(t => t.id === id);
                    document.getElementById('search').style.display = (tabCfg && tabCfg.hideSearch) ? 'none' : '';
                });
            });
        }

        // ===== 渲染接口面板 =====
        function renderApiPanel() {
            const api = CONFIG.api || {};
            const panel = document.getElementById('panel-' + (CONFIG.tabs.find(t => t.type === 'api')?.id || 'api'));
            if (!panel || panel.dataset.rendered) return;
            panel.dataset.rendered = 'true';

            panel.innerHTML = `<div class="panel-box" id="apiList"><div class="loading">⏳ 正在加载接口列表...</div></div>`;

            // 找到 api 类型对应的 tab id
            const apiTab = CONFIG.tabs.find(t => t.type === 'api');
            if (!apiTab) return;
            const listEl = panel.querySelector('.panel-box');

            fetch((api.listFile || 'list.txt') + '?t=' + Date.now())
                .then(res => res.ok ? res.text() : Promise.reject())
                .then(text => {
                    const lines = text.trim().split('\n').filter(l => l.trim());
                    let html = api.staticEntries || '';
                    lines.forEach(line => {
                        const p = line.split('|').map(s => s.trim());
                        if (!p[0]) return;
                        const file = decodeURIComponent(p[0]);
                        const name = file.replace(/\.json$/i, '');
                        const date = p[1] || '';
                        const size = p[2] || '-';
                        const origUrl = p[3] || '';
                        const isNew = isRecent(date);
                        const newClass = isNew ? 'badge-new' : 'badge-old';
                        const chDate = formatDate(date);
                        let urls = '';
                        if (origUrl) urls += urlLine('原始线路', origUrl);
                        (api.domains || []).forEach(d => {
                            urls += urlLine(d.tag, d.base + file);
                        });
                        html += `
                            <div class="entry" data-name="${name.toLowerCase()}">
                                <div class="entry-header">
                                    <div class="entry-name" title="${name}">${name}</div>
                                    <div class="entry-meta-inline">
                                        <span class="meta-item"><span class="${newClass}">备份时间 ${chDate}</span></span>
                                        <span class="meta-item">${size}</span>
                                    </div>
                                </div>
                                <div class="entry-urls">${urls}</div>
                            </div>`;
                    });
                    listEl.innerHTML = html || '<div class="empty">📭 暂无接口数据</div>';
                    bindCopy(listEl);
                })
                .catch(() => {
                    listEl.innerHTML = (api.staticEntries || '') + '<div class="empty">❌ 加载失败</div>';
                    bindCopy(listEl);
                });
        }

        function urlLine(tag, url) {
            return `<div class="url-line"><span class="url-tag">${tag}</span><span class="url-text">${url}</span><button class="copy-btn" data-url="${url}">复制</button></div>`;
        }
        function isRecent(dateStr) {
            if (!dateStr || dateStr.length !== 8) return false;
            const y = parseInt(dateStr.slice(0,4),10), m = parseInt(dateStr.slice(4,6),10)-1, d = parseInt(dateStr.slice(6,8),10);
            return (Date.now() - new Date(y,m,d).getTime()) / 86400000 <= 2;
        }
        function formatDate(d) { return (!d || d.length !== 8) ? '----' : `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日`; }

        // ===== 渲染下载面板 =====
        function renderDownloadPanel() {
            const sources = CONFIG.downloadSources || [];
            const dlTab = CONFIG.tabs.find(t => t.type === 'download');
            if (!dlTab) return;
            const panel = document.getElementById('panel-' + dlTab.id);
            if (!panel || panel.dataset.rendered) return;
            panel.dataset.rendered = 'true';

            panel.innerHTML = `<div class="panel-box" id="dlContainer"><div class="loading">⏳ 正在加载下载资源...</div></div>`;
            const container = panel.querySelector('.panel-box');

            if (!sources.length) { container.innerHTML = '<div class="empty">📭 暂无下载来源</div>'; return; }

            const cardHtml = item => `
                <div class="download-card" data-name="${(item.name || '').toLowerCase()}">
                    <img src="${item.icon || 'https://via.placeholder.com/48'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/48'">
                    <div class="app-name">${item.name}</div>
                    <div class="app-version">${item.version || ''}</div>
                    <a href="${item.url}" target="_blank">下载</a>
                </div>`;

            const loadOne = source => fetch(source.url + '?t=' + Date.now())
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(data => {
                    let html = `<div class="source-module">
                        <div class="source-header">
                            <span class="source-name">${source.name || '未命名来源'}</span>
                            ${source.description ? '<span class="source-desc">· ' + source.description + '</span>' : ''}
                        </div>`;
                    if (data.apps && data.apps.length) {
                        html += `<div class="source-section-label">📱 APP 客户端</div><div class="download-grid">${data.apps.map(cardHtml).join('')}</div>`;
                    }
                    if (data.packages && data.packages.length) {
                        html += `<div class="source-divider"></div><div class="source-section-label">📂 本地包 / 配置包</div><div class="download-grid">${data.packages.map(cardHtml).join('')}</div>`;
                    }
                    html += `</div>`;
                    return html;
                })
                .catch(() => `<div class="source-module"><div class="source-header"><span class="source-name">${source.name || '未命名来源'}</span></div><div class="empty">❌ 加载失败：${source.url}</div></div>`);

            Promise.all(sources.map(loadOne)).then(results => { container.innerHTML = results.join(''); });
        }

        // ===== 渲染关于面板 =====
        function renderAboutPanel() {
            const about = CONFIG.about || {};
            const tab = CONFIG.tabs.find(t => t.type === 'about');
            if (!tab) return;
            const panel = document.getElementById('panel-' + tab.id);
            if (!panel || panel.dataset.rendered) return;
            panel.dataset.rendered = 'true';

            let domainsHtml = (about.domains || []).map(d =>
                `<div class="domain-line"><span>${d.url}</span><button class="copy-btn" data-url="${d.url}">复制</button></div>`
            ).join('');

            let declHtml = (about.declarations || []).map(d => `<li>${d}</li>`).join('');

            panel.innerHTML = `
                <div class="panel-box">
                    <div class="about-inner">
                        <h3>🌐 备份线路域名</h3>
                        <p style="margin-bottom:6px;">三个域名互为备份，任一个可用：</p>
                        ${domainsHtml}
                    </div>
                    <div class="about-inner">
                        <h3>📢 声明与联系</h3>
                        <ul>${declHtml}</ul>
                        ${about.qq ? `<p style="margin-top:10px;">QQ 交流群：<strong style="color:#4a9eff;">${about.qq}</strong></p>` : ''}
                    </div>
                </div>`;
            bindCopy(panel);
        }

        // ===== 全局搜索 =====
        function globalSearch() {
            const kw = document.getElementById('search').value.toLowerCase().trim();
            document.querySelectorAll('#panel-api .entry, .download-card').forEach(el => {
                const name = el.getAttribute('data-name') || '';
                el.classList.toggle('hidden', !name.includes(kw));
            });
        }

        // ===== 初始化 =====
        function init() {
            renderHeader();
            renderTabs();
            document.getElementById('footer').innerHTML = CONFIG.footer || '';

            // 根据 tab 类型渲染对应面板
            CONFIG.tabs.forEach(tab => {
                if (tab.type === 'api') renderApiPanel();
                else if (tab.type === 'download') renderDownloadPanel();
                else if (tab.type === 'about') renderAboutPanel();
            });
        }

        // 先加载 config.json，失败用默认值
        fetch('config.json?t=' + Date.now())
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(cfg => { CONFIG = Object.assign({}, DEFAULT_CONFIG, cfg); init(); })
            .catch(() => { CONFIG = DEFAULT_CONFIG; init(); });
    </script>
</body>
</html>
