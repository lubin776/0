<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>加载中...</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fa; color: #1e293b;
        padding: 16px 12px 8px;
        transition: padding 0.3s;
    }
    .container { max-width: 820px; margin: 0 auto; position: relative; }

    #modeToggleBtn {
        position: absolute; top: 12px; left: 8px; z-index: 999;
        width: 52px; padding: 4px 2px; border-radius: 12px;
        border: 1px solid #4a9eff; background: #fff; color: #4a9eff;
        font-size: 0.6rem; line-height: 1.25; text-align: center;
        cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .header-block { text-align: center; margin-bottom: 12px; padding-top: 12px; }
    h1 { font-size: 1.3rem; font-weight: 600; color: #0b1e33; }
    h1 .header-logo {
        width: 1.8rem; height: 1.8rem; border-radius: 50%;
        border: 1.5px solid #4a9eff; object-fit: cover;
        vertical-align: -0.45rem; margin-right: 6px;
    }
    .header-divider { height: 1px; background: #e9edf2; margin: 10px 0; }
    .subtitle { font-size: 0.8rem; color: #8b9eb0; line-height: 1.5; }

    .main-card {
        background: #ffffff; border-radius: 16px;
        padding: 16px 18px 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        border: 1px solid #f0f3f8;
    }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
    .nav-tab {
        padding: 7px 24px; border: 1.5px solid #4a9eff;
        border-radius: 40px; background: #fff; color: #4a9eff;
        font-size: 0.82rem; font-weight: 500; cursor: pointer;
    }
    .nav-tab.active { background: #4a9eff; color: #fff; }

    .search-box {
        width: 100%; padding: 12px 16px;
        border: 1px solid #dce1e9; border-radius: 40px;
        font-size: 0.95rem; background: #fff; outline: none; margin-bottom: 12px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .entry { padding: 16px 0; border-bottom: 1px solid #f0f4fa; }
    .entry:last-child { border-bottom: none; }
    .entry-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .entry-name { font-size: 1.05rem; font-weight: 600; color: #0b1e33; }
    .entry-meta-inline { margin-left: auto; font-size: 0.75rem; color: #5a6f88; white-space: nowrap; }
    .badge-new { color: #1b9e5a; }
    .badge-old { color: #b88b3a; }
    .url-line {
        padding: 5px 12px; margin-bottom: 6px;
        background: #f8fafc; border-radius: 40px; border: 1px solid #eef2f7;
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .url-tag {
        font-size: 0.7rem; background: #e6edf6; padding: 0 12px;
        border-radius: 30px; line-height: 24px; white-space: nowrap; flex-shrink: 0;
    }
    .url-text { font-size: 0.82rem; color: #2563eb; word-break: break-all; flex: 1 1 0; min-width: 40px; }
    .copy-btn {
        flex-shrink: 0; background: #4a9eff; color: white; border: none;
        border-radius: 30px; padding: 0 14px; font-size: 0.7rem;
        height: 26px; cursor: pointer; white-space: nowrap; margin-left: auto;
    }
    .download-card {
        background: #fff; border-radius: 10px; padding: 16px 12px;
        text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        border: 1px solid #e8eef5; margin-bottom: 10px;
    }
    .download-card .card-name { font-size: 0.85rem; font-weight: 500; }
    .download-card .card-desc { font-size: 0.7rem; color: #8b9eb0; margin-top: 4px; }
    .group-title { font-size: 0.9rem; font-weight: 600; margin: 12px 0 8px; }

    .loading { text-align: center; color: #9aadc2; padding: 48px 0; }
    .error-msg { text-align: center; color: #d9534f; padding: 16px; background: #fff3f3; border-radius: 10px; margin: 8px 0; }

    .about-inner { background: #f8fafc; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #eef2f7; }
    .about-inner h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
    .about-inner p { font-size: 0.76rem; color: #5a6f88; line-height: 1.6; margin-bottom: 6px; }
    .domain-line { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: #fff; border-radius: 40px; border: 1px solid #e0e6ed; margin-top: 6px; }
    .domain-line span { flex: 1; font-size: 0.75rem; color: #2563eb; word-break: break-all; }

    .page-footer { text-align: center; padding: 20px 0 8px; font-size: 0.72rem; color: #9aadc2; line-height: 1.8; }

    body.simple-mode .nav-tabs { display: none !important; }
    body.simple-mode #download-panel, body.simple-mode #about-panel { display: none !important; }
    body.simple-mode #api-panel { display: block !important; }

    @media (max-width: 600px) {
        .url-line { padding: 4px 8px; }
        .url-text { font-size: 0.72rem; }
        .copy-btn { padding: 0 10px; font-size: 0.65rem; }
    }
</style>
</head>
<body class="simple-mode">

<div class="container">
    <button id="modeToggleBtn">切换<br>全能版</button>
    <div class="header-block">
        <h1 id="siteTitle"></h1>
        <div class="header-divider"></div>
        <p class="subtitle" id="siteSubtitle"></p>
    </div>
    <input class="search-box" id="search" type="text" placeholder="🔍 搜索..." oninput="globalSearch()">
    <div class="main-card">
        <div class="nav-tabs" id="navTabs"></div>
        <div class="tab-panel active" id="api-panel">
            <div class="api-list" id="listContainer">
                <div class="loading" id="apiLoading">⏳ 正在加载接口列表...</div>
            </div>
        </div>
        <div class="tab-panel" id="download-panel">
            <div id="downloads-content"><div class="loading">⏳ 正在加载下载资源...</div></div>
        </div>
        <div class="tab-panel" id="about-panel">
            <div class="about-inner" id="aboutDomains"></div>
            <div class="about-inner" id="aboutDecl"></div>
        </div>
    </div>
    <footer class="page-footer" id="footerText"></footer>
</div>

<script>
let CONFIG = null;

/* ========== 工具函数 ========== */
function ensureJson(name) {
    // 文件名没有 .json 后缀时自动补上（保证备份线路 URL 正确）
    return name.endsWith('.json') ? name : name + '.json';
}

/* ========== 加载 config.json ========== */
async function loadConfig() {
    try {
        const res = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        CONFIG = await res.json();
    } catch (e) {
        console.error('config.json 加载失败', e);
        return;
    }
    applyConfig();
    renderTabs();
    renderApi();
    if (!document.body.classList.contains('simple-mode')) {
        renderDownloads(true);
        renderAbout();
    }
}

/* ========== 应用站点配置（标题/logo/副标题/footer）========== */
function applyConfig() {
    const s = CONFIG.site;
    document.title = s.title;
    document.getElementById('siteTitle').innerHTML =
        `<img class="header-logo" src="${s.logo}" alt="Logo"><span>${s.title}</span>`;
    document.getElementById('siteSubtitle').innerHTML =
        `${s.subtitle}<br>QQ交流群：${s.qqGroup}`;
    document.getElementById('footerText').innerHTML =
        `<p>${CONFIG.footer} QQ 群：${s.qqGroup}</p>`;
}

/* ========== 导航标签 ========== */
function renderTabs() {
    const nav = document.getElementById('navTabs');
    nav.innerHTML = CONFIG.tabs.map(t =>
        `<button class="nav-tab ${t.id === 'api' ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    nav.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            nav.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(this.getAttribute('data-tab') + '-panel').classList.add('active');
        });
    });
}

/* ========== 搜索 ========== */
function globalSearch() {
    const kw = document.getElementById('search').value.toLowerCase().trim();
    document.querySelectorAll('#api-panel .entry').forEach(e => {
        const name = e.getAttribute('data-name') || '';
        e.style.display = name.includes(kw) ? '' : 'none';
    });
    if (!document.body.classList.contains('simple-mode')) {
        document.querySelectorAll('.download-card').forEach(c => {
            const name = c.getAttribute('data-name') || '';
            c.style.display = name.includes(kw) ? '' : 'none';
        });
    }
}

/* ========== 复制功能 ========== */
function bindCopy(container) {
    container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const url = this.getAttribute('data-url');
            if (!url) return;
            const done = () => {
                const orig = this.textContent;
                this.textContent = '✅ 已复制';
                setTimeout(() => { this.textContent = orig; }, 1500);
            };
            if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(fallback);
            else fallback();
            function fallback() {
                const input = document.createElement('input');
                input.value = url; document.body.appendChild(input);
                input.select(); document.execCommand('copy'); document.body.removeChild(input); done();
            }
        });
    });
}

/* ========== API 列表（还原原始渲染：备份时间/颜色/排序/补.json）========== */
function renderApi() {
    const container = document.getElementById('listContainer');
    const WEIGHTS = (CONFIG.api && CONFIG.api.weights) || {};
    const DOMAINS = (CONFIG.api && CONFIG.api.domains) || [];

    function formatDateToChinese(d) {
        if (!d || d.length !== 8) return '----';
        return `${d.slice(0,4)}年${d.slice(4,6)}月${d.slice(6,8)}日`;
    }
    function isRecent(d) {
        if (!d || d.length !== 8) return false;
        const y = parseInt(d.slice(0,4),10), m = parseInt(d.slice(4,6),10)-1, day = parseInt(d.slice(6,8),10);
        return (Date.now() - new Date(y, m, day).getTime()) / 86400000 <= 2;
    }

    fetch('list.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(res => res.ok ? res.text() : Promise.reject('HTTP ' + res.status))
        .then(text => {
            const loadingTip = document.getElementById('apiLoading');
            if (loadingTip) loadingTip.style.display = 'none';

            const lines = text.trim().split('\n').filter(l => l.trim());
            let items = lines.map(line => {
                const parts = line.split('|').map(s => s.trim());
                const file = parts[0];
                return {
                    file: file,
                    name: file.replace(/\.json$/i, ''),
                    date: parts[1] || '',
                    size: parts[2] || '',
                    origUrl: parts[3] || '',
                    weight: WEIGHTS.hasOwnProperty(file) ? WEIGHTS[file] : 999
                };
            });
            // 原始排序：有权重的按权重升序排前面，其余按名字典序稳定排列
            items.sort((a, b) => {
                if (a.weight !== b.weight) return a.weight - b.weight;
                return a.name.localeCompare(b.name, 'zh');
            });

            let html = '';
            items.forEach(it => {
                const isNew = isRecent(it.date);
                const cls = isNew ? 'badge-new' : 'badge-old';
                const jsonName = ensureJson(it.file);  // 关键：无后缀自动补 .json
                let linesHtml = '';
                if (it.origUrl) {
                    linesHtml += `<div class="url-line"><span class="url-tag">原始线路</span><span class="url-text">${it.origUrl}</span><button class="copy-btn" data-url="${it.origUrl}">复制</button></div>`;
                }
                DOMAINS.forEach(d => {
                    const url = d.base + jsonName;
                    linesHtml += `<div class="url-line"><span class="url-tag">${d.tag}</span><span class="url-text">${url}</span><button class="copy-btn" data-url="${url}">复制</button></div>`;
                });
                html += `<div class="entry" data-name="${it.name.toLowerCase()}">
                    <div class="entry-header">
                        <div class="entry-name" title="${it.name}">${it.name}</div>
                        <div class="entry-meta-inline">
                            <span class="${cls}">备份时间 ${formatDateToChinese(it.date)}</span>
                            ${it.size ? '  ' + it.size : ''}
                        </div>
                    </div>
                    <div class="entry-urls">${linesHtml}</div>
                </div>`;
            });
            container.innerHTML = html;
            bindCopy(container);
        })
        .catch(err => {
            const loadingTip = document.getElementById('apiLoading');
            if (loadingTip) loadingTip.style.display = 'none';
            container.innerHTML = `<div class="error-msg">❌ 接口加载失败：${err}</div>`;
        });
}

/* ========== 下载资源（url 支持 ry/ 子目录，来自 config）========== */
async function renderDownloads(force) {
    const container = document.getElementById('downloads-content');
    if (!container || (container.dataset.rendered && !force)) return;
    container.dataset.rendered = 'true';
    container.innerHTML = '<div class="loading">⏳ 正在加载下载资源...</div>';

    let html = '';
    const sources = CONFIG.downloadSources || [];
    for (const src of sources) {
        try {
            const res = await fetch(src.url + '?t=' + Date.now());
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            html += `<div class="group-title">${src.name}${src.description ? '（' + src.description + '）' : ''}</div>`;
            (data.list || data).forEach(item => {
                const name = item.name || item.title || '';
                const url = item.url || item.link || '';
                html += `<div class="download-card" data-name="${name.toLowerCase()}">
                    <div class="card-name">${name}</div>
                    ${url ? `<a class="card-desc" href="${url}" target="_blank" rel="noopener">${url}</a>` : ''}
                </div>`;
            });
        } catch (e) {
            html += `<div class="error-msg">❌ ${src.name}（${src.url}）加载失败：${e.message}</div>`;
        }
    }
    container.innerHTML = html;
    bindCopy(container);
}

/* ========== 关于页（来自 config.about）========== */
function renderAbout() {
    const a = CONFIG.about;
    const domEl = document.getElementById('aboutDomains');
    let domHtml = `<h3>${a.domainTitle || ''}</h3>`;
    if (a.domainTip) domHtml += `<p>${a.domainTip}</p>`;
    (a.domains || []).forEach(d => {
        domHtml += `<div class="domain-line"><span>${d}</span><button class="copy-btn" data-url="${d}">复制</button></div>`;
    });
    domEl.innerHTML = domHtml;
    bindCopy(domEl);

    const declEl = document.getElementById('aboutDecl');
    let declHtml = `<h3>${a.declarationLabel || ''}</h3>`;
    if (a.declaration) declHtml += `<p>${a.declaration}</p>`;
    if (a.qqGroup) declHtml += `<p>${a.qqGroupLabel || 'QQ 交流群'}：<strong style="color:#4a9eff;">${a.qqGroup}</strong></p>`;
    declEl.innerHTML = declHtml;
}

/* ========== 模式切换 ========== */
document.getElementById('modeToggleBtn').addEventListener('click', () => {
    const isSimple = document.body.classList.contains('simple-mode');
    document.body.classList.toggle('simple-mode', !isSimple);
    document.getElementById('modeToggleBtn').innerHTML = isSimple ? '切换<br>简洁版' : '切换<br>全能版';
    if (isSimple) { renderDownloads(); renderAbout(); }
});

/* ========== 启动 ========== */
loadConfig();
</script>
</body>
</html>
